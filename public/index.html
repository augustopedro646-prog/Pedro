  // ---------- feriados ----------
  // Mesma regra do PDV Jabá (calculados por ano, nada gravado): nacionais, RN e
  // Natal — a ATPN fica em Natal, então os de Parnamirim não entram. Páscoa pelo
  // cálculo gregoriano; Carnaval, Cinzas, Sexta-feira Santa e Corpus Christi
  // derivam dela.
  const ROTULO_FERIADO = { nacional: 'Feriado nacional', estadual: 'Feriado estadual (RN)', municipal: 'Feriado municipal (Natal)', facultativo: 'Ponto facultativo' };
  const _feriadosCache = {};
  function pascoaDoAno(ano) {
    const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
      m = Math.floor((a + 11 * h + 22 * l) / 451), mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(ano, mes - 1, dia);
  }
  function dataLocalStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function feriadosDoAno(ano) {
    if (_feriadosCache[ano]) return _feriadosCache[ano];
    const out = {};
    const add = (data, nome, tipo) => { (out[data] = out[data] || []).push({ nome, tipo }); };
    const fixo = (mm, dd, nome, tipo) => add(`${ano}-${mm}-${dd}`, nome, tipo);
    const rel = (dias, nome, tipo) => { const p = pascoaDoAno(ano); p.setDate(p.getDate() + dias); add(dataLocalStr(p), nome, tipo); };
    fixo('01', '01', 'Confraternização Universal', 'nacional');
    fixo('01', '06', 'Santos Reis (Natal)', 'municipal');
    rel(-48, 'Carnaval', 'facultativo'); rel(-47, 'Carnaval', 'facultativo'); rel(-46, 'Quarta-feira de Cinzas (até 14h)', 'facultativo');
    rel(-2, 'Sexta-feira Santa', 'nacional');
    fixo('04', '21', 'Tiradentes', 'nacional');
    fixo('05', '01', 'Dia do Trabalho', 'nacional');
    rel(60, 'Corpus Christi', 'facultativo');
    fixo('09', '07', 'Independência do Brasil', 'nacional');
    fixo('10', '03', 'Mártires de Cunhaú e Uruaçu (RN)', 'estadual');
    fixo('10', '12', 'Nossa Senhora Aparecida', 'nacional');
    fixo('11', '02', 'Finados', 'nacional');
    fixo('11', '15', 'Proclamação da República', 'nacional');
    fixo('11', '20', 'Consciência Negra', 'nacional');
    fixo('11', '21', 'N. Sra. da Apresentação (Natal)', 'municipal');
    fixo('12', '24', 'Véspera de Natal (tarde)', 'facultativo');
    fixo('12', '25', 'Natal', 'nacional');
    fixo('12', '31', 'Véspera de Ano-Novo (tarde)', 'facultativo');
    return (_feriadosCache[ano] = out);
  }
  function feriadosDoDia(dataStr) { return feriadosDoAno(Number(dataStr.slice(0, 4)))[dataStr] || []; }

  // ---------- relatórios ----------
  const REL_CLUBE = { cepe_atpn: 'ATPN', cepe: 'CEPE' };
  const REL_STATUS = { em_dia: 'Em dia', ate_2_meses: '1 a 2 meses', '3_a_5_meses': '3 a 5 meses', '6_meses_ou_mais': '6 meses ou mais', desligado: 'Desativado' };
  const pilulaStatus = (st) => `<span class="st-pill st-${esc(st)}">${esc(REL_STATUS[st] || st)}</span>`;
  const tagDobro = (s) => (s && s.possivelDuplicado ? '<span class="tag-dobro" title="Mesma matrícula/nome aparece mais de uma vez na planilha: pode haver contagem dobrada">possível contagem dobrada</span>' : '');
  const REL_CATEGORIA = { efetivo: 'Efetivo', contribuinte: 'Contribuinte', nao_identificada: 'Não identificada' };
  const NOMES_MES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const idxMes = (ano, mes) => ano * 12 + (mes - 1);

  // Meses da série e quais já "fecharam": a planilha é um retrato de uma data
  // (ex.: 10/11), então o mês dela e os seguintes são PARCIAIS, e o mês logo
  // antes ainda pode estar em cobrança. Totais e comparações só usam meses
  // anteriores ao mês da planilha.
  function relMeses() {
    const m = state.rel.mensal;
    const ref = new Date(`${m.planilhaAtualizadaEm}T12:00:00`);
    const idxRef = idxMes(ref.getFullYear(), ref.getMonth() + 1);
    const vistos = new Map();
    m.serie.forEach((r) => {
      const k = idxMes(r.ano, r.mes);
      if (!vistos.has(k)) vistos.set(k, { ano: r.ano, mes: r.mes, idx: k, arrecadado: 0, pagantes: 0, naoPagaram: 0, especiais: 0 });
      const v = vistos.get(k);
      v.arrecadado += r.arrecadado; v.pagantes += r.pagantes; v.naoPagaram += r.naoPagaram; v.especiais += r.especiais;
    });
    const todos = [...vistos.values()].sort((a, b) => a.idx - b.idx).map((v) => ({ ...v, parcial: v.idx >= idxRef, emCobranca: v.idx === idxRef - 1 }));
    return { todos, fechados: todos.filter((v) => !v.parcial) };
  }

  function relSoma(meses) {
    const s = { arrecadado: 0, pagantes: 0, naoPagaram: 0, n: meses.length };
    meses.forEach((m) => { s.arrecadado += m.arrecadado; s.pagantes += m.pagantes; s.naoPagaram += m.naoPagaram; });
    s.ticket = s.pagantes ? s.arrecadado / s.pagantes : 0;
    s.taxaInad = (s.pagantes + s.naoPagaram) ? s.naoPagaram / (s.pagantes + s.naoPagaram) * 100 : 0;
    return s;
  }

  function relDelta(atual, anterior, inverso) {
    if (anterior == null || !anterior) return '';
    const pct = (atual - anterior) / anterior * 100;
    if (Math.abs(pct) < 0.05) return '<span class="placeholder">= igual ao período anterior</span>';
    const bom = inverso ? pct < 0 : pct > 0;
    return `<span class="${bom ? 'rel-delta-pos' : 'rel-delta-neg'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1).replace('.', ',')}%</span> <span class="placeholder">vs. período anterior</span>`;
  }

  function relPeriodo(meses) {
    const fech = meses.fechados;
    const preset = state.relPeriodo;
    let atual;
    if (preset === 'ano') atual = fech;
    else if (preset === '3m') atual = fech.slice(-3);
    else atual = fech.slice(-1);
    let anterior = null;
    if (preset !== 'ano' && atual.length) {
      const ini = atual[0].idx;
      const ant = fech.filter((m) => m.idx >= ini - atual.length && m.idx < ini);
      if (ant.length === atual.length) anterior = ant;
    }
    return { atual, anterior };
  }

  function relRotuloPeriodo(lista) {
    if (!lista.length) return '—';
    const f = (m) => `${NOMES_MES_CURTO[m.mes - 1]}/${String(m.ano).slice(2)}`;
    return lista.length === 1 ? f(lista[0]) : `${f(lista[0])} a ${f(lista[lista.length - 1])}`;
  }

  function relAbaMensalidades() {
    const meses = relMeses();
    if (!meses.fechados.length) return '<p class="placeholder">Ainda não há mês fechado na planilha.</p>';
    const { atual, anterior } = relPeriodo(meses);
    const S = relSoma(atual);
    const P = anterior ? relSoma(anterior) : null;
    const cartao = (rotulo, valor, sub, classe) => `<div class="cartao-resumo"><span class="cartao-resumo-label">${rotulo}</span><strong class="cartao-resumo-valor ${classe || ''}">${valor}</strong><span class="cartao-resumo-label">${sub || ''}</span></div>`;
    const mediaPag = S.n ? Math.round(S.pagantes / S.n) : 0;
    const maxArr = Math.max(...meses.todos.map((m) => m.arrecadado), 1);
    const barras = meses.todos.map((m) => `
      <div class="rel-barra ${m.parcial ? 'parcial' : ''}" title="${NOMES_MES_CURTO[m.mes - 1]}/${m.ano}: ${formatarMoeda(m.arrecadado)} · ${m.pagantes} pagantes${m.parcial ? ' · mês parcial (planilha de ' + state.rel.mensal.planilhaAtualizadaEm.split('-').reverse().join('/') + ')' : m.emCobranca ? ' · ainda em cobrança' : ''}">
        <div class="rel-barra-fill" style="height:${(m.arrecadado / maxArr * 100).toFixed(1)}%"></div>
      </div>`).join('');
    const rotulos = meses.todos.map((m) => `<span>${NOMES_MES_CURTO[m.mes - 1]}${m.emCobranca ? '*' : ''}</span>`).join('');
    const presetBtn = (id, rot) => `<button class="${state.relPeriodo === id ? 'ativa' : ''}" data-rel="periodo" data-valor="${id}">${rot}</button>`;
    return `
      <div class="abas-secundarias">${presetBtn('ultimo', 'Último mês')}${presetBtn('3m', 'Últimos 3 meses')}${presetBtn('ano', 'Ano 2026')}</div>
      <p class="placeholder">Período: <strong>${esc(relRotuloPeriodo(atual))}</strong>${anterior ? ` · comparado com ${esc(relRotuloPeriodo(anterior))}` : ''}${atual.some((m) => m.emCobranca) ? ' · <strong>inclui um mês ainda em cobrança</strong> (pagamentos podem subir e a inadimplência cair)' : ''}</p>
      <div class="cartoes-resumo">
        ${cartao('Arrecadado (sócios ATPN)', formatarMoeda(S.arrecadado), relDelta(S.arrecadado, P && P.arrecadado), 'cor-receita')}
        ${cartao('Pagantes por mês (média)', mediaPag, P ? relDelta(S.pagantes / S.n, P.pagantes / P.n) : '')}
        ${cartao('Ticket médio', formatarMoeda(S.ticket), P ? relDelta(S.ticket, P.ticket) : '')}
        ${cartao('Inadimplência', S.taxaInad.toFixed(1).replace('.', ',') + '%', P ? relDelta(S.taxaInad, P.taxaInad, true) : 'não pagaram ÷ (pagaram + não pagaram)', S.taxaInad > 8 ? 'cor-atraso' : '')}
      </div>
      <h3>Arrecadação mês a mês — 2026</h3>
      <div class="rel-barras">${barras}</div>
      <div class="rel-barra-rot">${rotulos}</div>
      <p class="placeholder">Barras listradas = mês parcial (a planilha é de ${esc(state.rel.mensal.planilhaAtualizadaEm.split('-').reverse().join('/'))}). * = mês ainda em cobrança, pode subir. Passe o mouse para ver os valores.</p>
      <p class="placeholder">Só sócios da ATPN (os do CEPE ficam apenas na aba Sócios). O valor de cada mês é o da planilha e, quando a planilha não tem o pagamento, o que foi registrado na aba Mensalidades — o mesmo dinheiro nunca conta duas vezes. É por mês de referência da mensalidade. Só 2026: os meses de 2024/2025 existem apenas para quem já saiu e dariam um total falso.</p>`;
  }

  function relBarraH(rotulo, n, max) {
    return `<div class="rel-hbar"><span class="rel-hbar-nome">${esc(rotulo)}</span><div class="rel-hbar-trilho"><div class="rel-hbar-fill" style="width:${max ? (n / max * 100).toFixed(1) : 0}%"></div></div><strong>${n}</strong></div>`;
  }

  function relAbaSocios() {
    const d = state.rel.socios;
    // só ATPN (o servidor já manda só ATPN): dado de sócio do CEPE fica na aba Sócios
    const n = (status) => (d.porStatus.find((r) => r.status === status) || { n: 0 }).n;
    const ativos = ['em_dia', 'ate_2_meses', '3_a_5_meses', '6_meses_ou_mais'].reduce((s, st) => s + n(st), 0);
    const cat = (c) => (d.porCategoria.find((r) => r.categoria === c) || { n: 0 }).n;
    const maxMot = Math.max(...d.motivosDesligamento.map((m) => m.n), 1);
    const maxEsp = Math.max(...d.situacoesEspeciais.map((m) => m.n), 1);
    return `
      <p class="placeholder">Sócios da ATPN — retrato da planilha de ${esc(d.atualizadoEm.split('-').reverse().join('/'))}, mais o que foi recebido na aba Mensalidades.</p>
      <h3>Situação dos sócios</h3>
      <div class="cartoes-resumo">
        <div class="cartao-resumo"><span class="cartao-resumo-label">Quadro atual (aba ATIVO GERAL)</span><strong class="cartao-resumo-valor">${d.quadro ?? ativos}</strong></div>
        <div class="cartao-resumo faixa-em_dia"><span class="cartao-resumo-label">Em dia</span><strong class="cartao-resumo-valor cor-receita">${n('em_dia')}</strong></div>
        <div class="cartao-resumo faixa-ate_2_meses"><span class="cartao-resumo-label">1 a 2 meses</span><strong class="cartao-resumo-valor">${n('ate_2_meses')}</strong></div>
        <div class="cartao-resumo faixa-3_a_5_meses"><span class="cartao-resumo-label">3 a 5 meses</span><strong class="cartao-resumo-valor">${n('3_a_5_meses')}</strong></div>
        <div class="cartao-resumo faixa-6_meses_ou_mais"><span class="cartao-resumo-label">6 meses ou mais</span><strong class="cartao-resumo-valor cor-atraso">${n('6_meses_ou_mais')}</strong></div>
        <div class="cartao-resumo faixa-desligado"><span class="cartao-resumo-label">Desativados</span><strong class="cartao-resumo-valor">${n('desligado')}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Já saíram (aba DESLIGADOS)</span><strong class="cartao-resumo-valor">${d.saiu ?? 0}</strong></div>
      </div>
      <h3>Dependentes</h3>
      <div class="cartoes-resumo">
        <div class="cartao-resumo"><span class="cartao-resumo-label">Dependentes cadastrados</span><strong class="cartao-resumo-valor">${d.dependentes ?? 0}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Possível contagem dobrada</span><strong class="cartao-resumo-valor">${d.possiveisDuplicados ?? 0}</strong></div>
      </div>
      <p class="placeholder">Dependente é quem aparece em azul embaixo do sócio titular na mesma célula da planilha. Fica ligado ao titular e não entra na contagem do quadro. "Possível contagem dobrada" = mesma matrícula ou mesmo nome em mais de uma linha.</p>
      <h3>Ativos por categoria</h3>
      <div style="overflow-x:auto;"><table class="tabela-lista">
        <thead><tr>${Object.values(REL_CATEGORIA).map((c) => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody><tr>${Object.keys(REL_CATEGORIA).map((c) => `<td>${cat(c)}</td>`).join('')}</tr></tbody>
      </table></div>
      <p class="placeholder">"Não identificada" = categoria da planilha que não é efetivo nem contribuinte (alunos, funcionários, convidados etc.).</p>
      ${d.situacoesEspeciais.length ? `<h3>Situações especiais (ativos)</h3>${d.situacoesEspeciais.map((s) => relBarraH(s.situacao, s.n, maxEsp)).join('')}` : ''}
      <h3>Por que saíram (desligados)</h3>
      ${d.motivosDesligamento.map((m) => relBarraH(m.motivo, m.n, maxMot)).join('')}`;
  }

  function relAbaInadimplentes() {
    const l = state.rel.inad;
    const faixaBtn = (v, r) => `<button class="${state.relInadFaixa === v ? 'ativa' : ''}" data-rel="inad-faixa" data-valor="${v}">${r}</button>`;
    const linhas = l.socios.map((s) => `
      <tr>
        <td>${esc(s.nome)}</td><td>${esc(s.matricula || '—')}</td>
        <td><strong class="cor-atraso">${s.mesesEmAberto}</strong> ${pilulaStatus(s.status)}</td>
        <td>${s.ultimoPagamento ? `${esc(s.ultimoPagamento)} · ${formatarMoeda(s.ultimoValor)}` : '<span class="placeholder">nenhum em 2026</span>'}</td>
        <td>${esc(s.telefone || '—')}</td>
      </tr>`).join('') || '<tr><td colspan="5" class="placeholder">Nenhum sócio nessa seleção.</td></tr>';
    return `
      <div class="abas-secundarias">${faixaBtn('todas', 'Qualquer atraso')}${faixaBtn('ate_2_meses', '1 a 2 meses')}${faixaBtn('3_a_5_meses', '3 a 5 meses')}${faixaBtn('6_meses_ou_mais', '6 meses ou mais')}</div>
      <p><strong>${l.total}</strong> sócio${l.total === 1 ? '' : 's'} em atraso${l.total > l.socios.length ? ` (mostrando ${l.socios.length})` : ''}.
        <button class="botao" data-rel="csv">Baixar CSV</button></p>
      <div style="overflow-x:auto;"><table class="tabela-lista">
        <thead><tr><th>Nome</th><th>Matrícula</th><th>Meses em aberto</th><th>Último pagamento</th><th>Telefone</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table></div>
      <p class="placeholder">Meses em aberto = meses seguidos com valor zero, contando de trás pra frente (mesma regra da planilha). Quem tem "sem margem", INSS, abonado etc. não entra como atraso.</p>`;
  }

  // ---------- cobrança: faixas de atraso, projeção e metas ----------
  const COBRANCA_PADRAO = { prazo: 8, taxas: { ate_2_meses: 70, '3_a_5_meses': 40, '6_meses_ou_mais': 15 } };
  function metaCobranca() {
    if (!state.relMeta) {
      let salvo = null;
      try { salvo = JSON.parse(localStorage.getItem('atpn-cobranca') || 'null'); } catch (e) { /* sem armazenamento */ }
      state.relMeta = { prazo: salvo?.prazo > 0 ? salvo.prazo : COBRANCA_PADRAO.prazo, taxas: { ...COBRANCA_PADRAO.taxas, ...(salvo?.taxas || {}) } };
    }
    return state.relMeta;
  }
  const COBRANCA_FAIXAS = [
    ['ate_2_meses', '1 a 2 meses', 'Abordagem de lembrete'],
    ['3_a_5_meses', '3 a 5 meses', 'Acordo / negociação'],
    ['6_meses_ou_mais', '6 meses ou mais', 'Contato: renovar ou descartar'],
  ];

  function relAbaCobranca() {
    const c = state.rel.cobranca;
    if (!c) return '<p class="placeholder">Carregando…</p>';
    const meta = metaCobranca();
    const brl = formatarMoeda;
    let totSocios = 0, totAberto = 0, totProj = 0;
    const linhas = COBRANCA_FAIXAS.map(([chave, rotulo, abordagem]) => {
      const f = c.faixas[chave];
      const taxa = (meta.taxas[chave] || 0) / 100;
      // 6+ meses: o ganho é quem volta a pagar a mensalidade; nas outras, o que está em aberto
      const proj = chave === '6_meses_ou_mais' ? f.mensalidadeMensal * taxa : f.valorEmAberto * taxa;
      const contatos = Math.ceil(f.socios / meta.prazo);
      totSocios += f.socios; totAberto += f.valorEmAberto; totProj += proj;
      const extra = chave === '6_meses_ou_mais'
        ? `<br><span class="placeholder">≈ ${Math.round(f.socios * taxa)} renovam · ≈ ${f.socios - Math.round(f.socios * taxa)} a descartar</span>` : '';
      return `<tr>
        <td>${pilulaStatus(chave)}<br><span class="placeholder">${esc(abordagem)}</span></td>
        <td><strong>${f.socios}</strong></td>
        <td>${f.meses}</td>
        <td>${brl(f.valorEmAberto)}${f.estimados ? `<br><span class="placeholder">${f.estimados} com valor estimado</span>` : ''}</td>
        <td><input type="number" min="0" max="100" step="5" value="${meta.taxas[chave]}" data-rel-meta="taxa" data-faixa="${chave}" style="width:70px;" aria-label="Taxa esperada ${rotulo}" /> %</td>
        <td>${brl(proj)}${chave === '6_meses_ou_mais' ? '<br><span class="placeholder">por mês, se voltarem</span>' : ''}${extra}</td>
        <td><strong>${contatos}</strong> / semana<br><button class="botao botao-pq" data-rel="ver-faixa" data-valor="${chave}">Ver lista</button></td>
      </tr>`;
    }).join('');
    const totContatos = COBRANCA_FAIXAS.reduce((s, [k]) => s + Math.ceil(c.faixas[k].socios / meta.prazo), 0);
    return `
      <p class="placeholder">Quem está sem pagar, separado pelas faixas da planilha, com o que isso representa em dinheiro. A mensalidade de cada sócio é o último valor que ele pagou em 2026; sem histórico, usa a média (${brl(c.mensalidadeMedia)}).</p>
      <div class="cartoes-resumo">
        <div class="cartao-resumo faixa-em_dia"><span class="cartao-resumo-label">Em dia</span><strong class="cartao-resumo-valor cor-receita">${c.emDia}</strong></div>
        <div class="cartao-resumo faixa-6_meses_ou_mais"><span class="cartao-resumo-label">Em atraso</span><strong class="cartao-resumo-valor cor-atraso">${totSocios}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Valor em aberto</span><strong class="cartao-resumo-valor cor-atraso">${brl(totAberto)}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Projeção a recuperar</span><strong class="cartao-resumo-valor cor-receita">${brl(totProj)}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Meta da equipe</span><strong class="cartao-resumo-valor">${totContatos}</strong><span class="cartao-resumo-label" style="margin:2px 0 0;text-transform:none;">contatos por semana</span></div>
      </div>
      <div class="linha-form" style="margin:10px 0;">
        <label>Prazo para falar com todos: <input type="number" min="1" max="52" value="${meta.prazo}" data-rel-meta="prazo" style="width:70px;" /> semanas</label>
      </div>
      <div style="overflow-x:auto;"><table class="tabela-lista">
        <thead><tr><th>Faixa</th><th>Sócios</th><th>Meses somados</th><th>Valor em aberto</th><th>Chance de pagar</th><th>Projeção</th><th>Meta de contatos</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table></div>
      <p class="placeholder">A "chance de pagar" é uma suposição sua para a projeção (os valores iniciais são só um ponto de partida) — ajuste conforme os resultados reais da cobrança. A meta de contatos divide os sócios de cada faixa pelo prazo escolhido.</p>`;
  }

  function viewRelatorios() {
    const cab = cabecalho('Relatórios', 'Só sócios da ATPN: mensalidades, quadro de sócios e inadimplência');
    if (state.relErro) return `${cab}<div class="secao"><p>Não foi possível carregar (${esc(state.relErro)}). Isso é falha de carregamento, não "zero". <button class="botao" data-rel="recarregar">Tentar de novo</button></p></div>`;
    if (!state.rel) return `${cab}<p class="placeholder">Carregando…</p>`;
    const abaBtn = (id, r) => `<button class="${state.relAba === id ? 'ativa' : ''}" data-rel="aba" data-valor="${id}">${r}</button>`;
    const corpo = state.relAba === 'socios' ? relAbaSocios() : state.relAba === 'inadimplentes' ? relAbaInadimplentes() : state.relAba === 'cobranca' ? relAbaCobranca() : relAbaMensalidades();
    return `${cab}<div class="abas-secundarias">${abaBtn('mensalidades', 'Mensalidades')}${abaBtn('socios', 'Sócios')}${abaBtn('cobranca', 'Cobrança')}${abaBtn('inadimplentes', 'Inadimplentes')}</div><div class="secao">${corpo}</div>`;
  }

  async function carregarInadimplentes() {
    const p = new URLSearchParams();
    if (state.relInadFaixa !== 'todas') p.set('status', state.relInadFaixa);
    state.rel.inad = await api(`/relatorios/inadimplentes?${p.toString()}`);
  }

  async function carregarRelatorios() {
    state.relErro = null;
    try {
      const [socios, mensal, cobranca] = await Promise.all([api('/relatorios/socios'), api('/relatorios/mensalidades'), api('/relatorios/cobranca')]);
      state.rel = { socios, mensal, cobranca, inad: { total: 0, socios: [] } };
      await carregarInadimplentes();
    } catch (err) {
      state.rel = null;
      state.relErro = err.message;
    }
  }

  async function baixarInadimplentesCsv() {
    const p = new URLSearchParams();
    if (state.relInadFaixa !== 'todas') p.set('status', state.relInadFaixa);
    try {
      const resp = await fetch(`${API_BASE}/relatorios/inadimplentes.csv?${p.toString()}`, { headers: { Authorization: `Bearer ${state.token}` } });
      if (!resp.ok) throw new Error('Não foi possível gerar o CSV');
      const url = URL.createObjectURL(await resp.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'inadimplentes-atpn.csv';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      avisar(err.message);
    }
  }

  async function acaoRelatorio(el) {
    const tipo = el.dataset.rel;
    const v = el.dataset.valor;
    if (tipo === 'aba') state.relAba = v;
    else if (tipo === 'periodo') state.relPeriodo = v;
    else if (tipo === 'inad-faixa') { state.relInadFaixa = v; await carregarInadimplentes(); }
    else if (tipo === 'ver-faixa') { state.relAba = 'inadimplentes'; state.relInadFaixa = v; await carregarInadimplentes(); }
    else if (tipo === 'csv') { await baixarInadimplentesCsv(); return; }
    else if (tipo === 'recarregar') { state.rel = null; render(); await carregarRelatorios(); }
    render();
  }

  // ---------- dados da associação e horário ----------
  const NOMES_DIA_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  function secaoAssociacaoHtml() {
    const a = state.configAssoc;
    if (!a) return '<div class="secao"><h3>Dados da associação</h3><p>Não foi possível carregar os dados da associação. Isso é falha de carregamento, não "vazio" — recarregue a página antes de salvar.</p></div>';
    const v = a.valor;
    const campo = (id, rotulo, valor, extra) => `<label class="campo-assoc"><span>${rotulo}</span><input id="${id}" value="${esc(valor)}" ${extra || ''} /></label>`;
    const horas = (i, t) => {
      const x = (v.horario.dias[i].turnos || [])[t] || { abre: '', fecha: '' };
      const dis = v.horario.dias[i].fechado ? 'disabled' : '';
      return `<span class="h-turno">
          <input type="time" class="as-h" data-dia="${i}" data-turno="${t}" data-campo="abre" value="${esc(x.abre)}" ${dis} aria-label="Abre ${t + 1}" />
          <span>às</span>
          <input type="time" class="as-h" data-dia="${i}" data-turno="${t}" data-campo="fecha" value="${esc(x.fecha)}" ${dis} aria-label="Fecha ${t + 1}" />
        </span>`;
    };
    const linhasHorario = NOMES_DIA_LONGO.map((nome, i) => `
      <div class="linha-horario">
        <label class="h-dia"><input type="checkbox" class="as-h-fechado" data-dia="${i}" ${v.horario.dias[i].fechado ? 'checked' : ''} /> ${nome} — fechado</label>
        ${horas(i, 0)}${horas(i, 1)}
      </div>`).join('');
    return `
      <div class="secao">
        <h3>Dados da associação</h3>
        <p class="placeholder">${a.configurado ? `Última alteração em ${esc(new Date(a.atualizadoEm).toLocaleString('pt-BR'))}. Versões anteriores ficam no Histórico.` : 'Ainda não preenchido — os campos abaixo são só o ponto de partida.'}</p>
        <div class="grade-assoc">
          ${campo('as-nome', 'Nome da associação', v.nome, 'maxlength="120"')}
          ${campo('as-telefone', 'Telefone', v.telefone, 'maxlength="30" inputmode="tel"')}
          ${campo('as-whatsapp', 'WhatsApp (só números, com DDI+DDD)', v.whatsapp, 'maxlength="20" inputmode="numeric" placeholder="5584999999999"')}
          ${campo('as-email', 'E-mail', v.email, 'maxlength="120" inputmode="email"')}
          ${campo('as-instagram', 'Instagram (link completo)', v.instagram, 'maxlength="200" placeholder="https://www.instagram.com/..."')}
          ${campo('as-endereco', 'Endereço', v.endereco, 'maxlength="250"')}
        </div>
        <h3>Horário de funcionamento</h3>
        <p class="placeholder">Até dois turnos por dia (por exemplo, manhã e noite). Deixe o segundo em branco se só tem um.</p>
        ${linhasHorario}
        <div class="linha-form"><button class="botao" data-assoc="salvar">Salvar dados e horário</button></div>
      </div>`;
  }

  function lerAssociacaoDaTela() {
    const val = (id) => document.getElementById(id).value;
    const dias = NOMES_DIA_LONGO.map((_, i) => {
      const fechado = document.querySelector(`.as-h-fechado[data-dia="${i}"]`).checked;
      const turnos = [0, 1].map((t) => ({
        abre: document.querySelector(`.as-h[data-dia="${i}"][data-turno="${t}"][data-campo="abre"]`).value,
        fecha: document.querySelector(`.as-h[data-dia="${i}"][data-turno="${t}"][data-campo="fecha"]`).value,
      }));
      return { fechado, turnos };
    });
    return {
      nome: val('as-nome'), telefone: val('as-telefone'), whatsapp: val('as-whatsapp'),
      email: val('as-email'), instagram: val('as-instagram'), endereco: val('as-endereco'),
      horario: { dias },
    };
  }

  async function salvarAssociacaoTela() {
    try {
      state.configAssoc = await api('/config/associacao', { method: 'PUT', body: lerAssociacaoDaTela() });
      state.historicoVersoes = null;
      render();
      avisar('Dados e horário salvos.');
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---------- histórico de versões (só Administrador) ----------
  const HIST_TIPOS = [
    { id: 'associacao', rotulo: 'Dados da associação' },
    { id: 'permissoes', rotulo: 'Permissões por cargo' },
    { id: 'pessoas', rotulo: 'Equipe' },
  ];

  async function carregarHistorico() {
    state.historicoErro = null;
    try {
      state.historicoVersoes = await api(`/historico?tipo=${state.historicoTipo}`);
    } catch (err) {
      state.historicoVersoes = null;
      state.historicoErro = err.message;
    }
    render();
  }

  function viewHistorico() {
    const chips = HIST_TIPOS.map((t) => `<button class="${state.historicoTipo === t.id ? 'ativa' : ''}" data-hist="tipo" data-valor="${t.id}">${t.rotulo}</button>`).join('');
    let corpo;
    if (state.historicoErro) corpo = `<p>Não foi possível carregar (${esc(state.historicoErro)}). Isso é falha de carregamento, não "sem versões". <button class="botao" data-hist="recarregar">Tentar de novo</button></p>`;
    else if (!state.historicoVersoes) corpo = '<p class="placeholder">Carregando…</p>';
    else if (!state.historicoVersoes.length) corpo = '<p class="placeholder">Nenhuma versão guardada ainda. Toda vez que isso for alterado, a versão anterior aparece aqui.</p>';
    else {
      corpo = state.historicoVersoes.map((v, i) => `
        <div class="item-historico">
          <div>
            <strong>${esc(new Date(v.alteradoEm).toLocaleString('pt-BR'))}</strong> <span class="placeholder">por ${esc(v.alteradoPor)}${i === 0 ? ' · alteração mais recente' : ''}</span>
            <div class="placeholder">${esc(v.resumo)}</div>
          </div>
          <button class="botao" data-hist="restaurar" data-valor="${v.id}">Restaurar esta versão</button>
        </div>`).join('');
    }
    return `
      ${cabecalho('Histórico de versões', 'Volte a uma versão anterior dos dados da associação, das permissões e da equipe')}
      <div class="secao">
        <p class="placeholder">Guarda as últimas 50 versões anteriores. "Restaurar" volta ao estado que a pessoa tinha <em>antes</em> daquela alteração, e o estado de agora também fica guardado — dá pra desfazer a restauração. PIN nunca é guardado.</p>
        <div class="abas-secundarias">${chips}</div>
        ${corpo}
      </div>`;
  }

  async function acaoHistorico(el) {
    const tipo = el.dataset.hist;
    if (tipo === 'tipo') {
      state.historicoTipo = el.dataset.valor;
      state.historicoVersoes = null;
      render();
      await carregarHistorico();
    } else if (tipo === 'recarregar') {
      state.historicoVersoes = null;
      render();
      await carregarHistorico();
    } else if (tipo === 'restaurar') {
      if (!await confirma('Restaurar esta versão? O estado de agora fica guardado no histórico.')) return;
      try {
        await api(`/historico/${el.dataset.valor}/restaurar`, { method: 'POST' });
        // o que foi restaurado pode mudar a tela de Configurações e as abas do menu
        state.configCarregado = false;
        state.configAssoc = null;
        state.abas = await api('/auth/me/abas');
        await carregarHistorico();
        avisar('Versão restaurada.');
      } catch (err) {
        avisar(err.message);
      }
    }
  }

  // ---------- mensalidades (recepção: receber, comprovante, estorno) ----------
  const MENS_SITUACAO = {
    pago_planilha: ['Pago', 'cor-receita'], pago_atpn: ['Pago (recebido aqui)', 'cor-receita'],
    aberto: ['Em aberto', 'cor-atraso'], especial: ['Situação especial', ''], sem_lancamento: ['Sem lançamento', 'placeholder'],
  };

  function mensFormValoresIniciais(f) {
    // mês mais antigo em aberto; senão o mês atual
    const aberto = f.meses.find((m) => m.situacao === 'aberto');
    const hoje = new Date();
    const alvo = aberto || f.meses.find((m) => m.ano === hoje.getFullYear() && m.mes === hoje.getMonth() + 1) || f.meses[f.meses.length - 1];
    return { mes: `${alvo.ano}-${alvo.mes}`, valor: f.valorSugerido != null ? String(f.valorSugerido).replace('.', ',') : '', forma: 'Dinheiro', data: dataLocalStr(hoje), obs: '' };
  }

  function mensFichaHtml() {
    const f = state.mensFicha;
    if (!f) return '';
    const s = f.socio;
    const ehAdmin = state.usuario.administrador;
    const frm = state.mensForm;
    const abertos = f.meses.filter((m) => m.situacao === 'aberto').length;
    const linhasMeses = f.meses.map((m) => {
      const [rot, cls] = MENS_SITUACAO[m.situacao];
      return `<tr><td>${String(m.mes).padStart(2, '0')}/${m.ano}</td><td class="${cls}">${rot}${m.observacao && m.situacao === 'especial' ? ` (${esc(m.observacao)})` : ''}</td><td>${m.valor ? formatarMoeda(m.valor) : '—'}</td></tr>`;
    }).join('');
    const linhasPag = f.pagamentos.map((p) => `
      <tr style="${p.canceladoEm ? 'opacity:.55;text-decoration:line-through;' : ''}">
        <td>${esc(String(p.mes).padStart(2, '0'))}/${p.ano}</td><td>${formatarMoeda(p.valor)}</td><td>${esc(p.forma)}</td>
        <td>${esc(p.dataPagamento.split('-').reverse().join('/'))}</td><td>${esc(p.registradoPor || '—')}</td>
        <td style="text-decoration:none;">${p.canceladoEm ? `<span class="placeholder">estornado: ${esc(p.motivoCancelamento || '')}</span>`
          : `<button class="botao-ir" data-mens="comprovante" data-id="${p.id}">comprovante</button>${ehAdmin ? ` <button class="botao-link" data-mens="estornar" data-id="${p.id}">estornar</button>` : ''}`}</td>
      </tr>`).join('') || '<tr><td colspan="6" class="placeholder">Nenhum pagamento registrado aqui para esse sócio.</td></tr>';
    const opcoesMes = f.meses.map((m) => `<option value="${m.ano}-${m.mes}" ${frm.mes === `${m.ano}-${m.mes}` ? 'selected' : ''}>${String(m.mes).padStart(2, '0')}/${m.ano} — ${MENS_SITUACAO[m.situacao][0]}</option>`).join('');
    const opcoesForma = f.formas.map((x) => `<option ${frm.forma === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
    return `
      <div class="secao">
        <h3>${esc(s.nome)}</h3>
        <p class="placeholder">Matrícula ${esc(s.matricula || '—')} · ${esc(s.categoria || 'categoria não identificada')} · ${esc(s.telefone || 'sem telefone')} ·
          situação: ${pilulaStatus(s.status)} · <strong>${abertos}</strong> ${abertos === 1 ? 'mês' : 'meses'} em aberto em 2026</p>
        <h3>Receber mensalidade</h3>
        <div class="grade-assoc">
          <label class="campo-assoc"><span>Mês de referência</span><select id="mf-mes">${opcoesMes}</select></label>
          <label class="campo-assoc"><span>Valor (R$)</span><input id="mf-valor" inputmode="decimal" autocomplete="off" value="${esc(frm.valor)}" /></label>
          <label class="campo-assoc"><span>Forma de pagamento</span><select id="mf-forma">${opcoesForma}</select></label>
          <label class="campo-assoc"><span>Data do pagamento</span><input id="mf-data" type="date" value="${esc(frm.data)}" /></label>
          <label class="campo-assoc"><span>Observação (opcional)</span><input id="mf-obs" maxlength="300" value="${esc(frm.obs)}" /></label>
        </div>
        <div class="linha-form"><button class="botao" data-mens="receber">Registrar recebimento</button></div>
        <h3>Meses de 2026</h3>
        <div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Mês</th><th>Situação</th><th>Valor</th></tr></thead><tbody>${linhasMeses}</tbody></table></div>
        <h3>Pagamentos registrados aqui</h3>
        <div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Mês ref.</th><th>Valor</th><th>Forma</th><th>Pago em</th><th>Por</th><th></th></tr></thead><tbody>${linhasPag}</tbody></table></div>
      </div>`;
  }

  function viewMensalidades() {
    if (state.mensErro) return `<h2>Mensalidades</h2><div class="secao"><p>Não foi possível carregar (${esc(state.mensErro)}). Isso é falha de carregamento, não "nenhum recebimento". <button class="botao" data-mens="recarregar">Tentar de novo</button></p></div>`;
    const res = state.mensResultados.map((s) => `
      <tr class="linha-socio" data-mens="abrir" data-id="${s.id}">
        <td>${esc(s.nome)}</td><td>${esc(s.matricula || '—')}</td><td>${pilulaStatus(s.status)}</td><td>${esc(s.telefone || '—')}</td>
      </tr>`).join('');
    const h = state.mensHoje;
    const formasHoje = h ? Object.entries(h.porForma).map(([k, v]) => `${esc(k)}: ${formatarMoeda(v)}`).join(' · ') : '';
    const linhasHoje = h ? h.pagamentos.map((p) => `
      <tr style="${p.canceladoEm ? 'opacity:.55;text-decoration:line-through;' : ''}">
        <td>${esc(p.socioNome)}</td><td>${String(p.mes).padStart(2, '0')}/${p.ano}</td><td>${formatarMoeda(p.valor)}</td><td>${esc(p.forma)}</td><td>${esc(p.registradoPor || '—')}</td>
      </tr>`).join('') : '';
    return `
      ${cabecalho('Mensalidades', 'Recepção da ATPN: receber, imprimir o comprovante e conferir o que está em aberto')}
      <div class="secao">
        <p class="placeholder">Recepção da ATPN: procure o sócio, confira o que está em aberto e registre o recebimento. Só sócios da <strong>ATPN</strong> (os do CEPE ficam apenas na aba Sócios). O valor entra no fluxo de caixa e no relatório, e a reimportação da planilha não apaga o que foi registrado aqui.</p>
        <input type="text" id="mens-busca" class="busca-socios-grande" placeholder="Nome, matrícula, telefone ou CPF do sócio…" value="${esc(state.mensBusca)}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search" />
        ${state.mensBusca.trim().length >= 2 ? (state.mensResultados.length
          ? `<div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Nome</th><th>Matrícula</th><th>Situação</th><th>Telefone</th></tr></thead><tbody>${res}</tbody></table></div>`
          : '<p class="placeholder">Nenhum sócio ATPN ativo encontrado.</p>') : ''}
      </div>
      ${mensFichaHtml()}
      <div class="secao">
        <h3>Recebido hoje</h3>
        ${!h ? '<p class="placeholder">Carregando…</p>' : `
          <p><strong>${formatarMoeda(h.total)}</strong> <span class="placeholder">${formasHoje ? '· ' + formasHoje : '· nada recebido hoje ainda'}</span></p>
          ${h.pagamentos.length ? `<div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Sócio</th><th>Mês ref.</th><th>Valor</th><th>Forma</th><th>Por</th></tr></thead><tbody>${linhasHoje}</tbody></table></div>` : ''}`}
      </div>`;
  }

  async function carregarMensHoje() {
    try { state.mensHoje = await api('/mensalidades/hoje'); state.mensErro = null; } catch (err) { state.mensErro = err.message; }
  }

  let timerBuscaMens = null;
  async function abrirFichaMens(id) {
    state.mensFicha = await api(`/mensalidades/socio/${id}`);
    state.mensForm = mensFormValoresIniciais(state.mensFicha);
  }

  function lerFormMens() {
    return {
      mes: document.getElementById('mf-mes').value,
      valor: document.getElementById('mf-valor').value,
      forma: document.getElementById('mf-forma').value,
      data: document.getElementById('mf-data').value,
      obs: document.getElementById('mf-obs').value,
    };
  }

  function imprimirComprovante(c) {
    const brl = (v) => `R$ ${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const dt = (s) => String(s).split('-').reverse().join('/');
    const w = window.open('', '_blank', 'width=520,height=680');
    if (!w) { avisar('O navegador bloqueou a janela do comprovante. Permita pop-ups para este site.'); return; }
    w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Comprovante ${c.id}</title>
      <style>body{font-family:system-ui,sans-serif;padding:24px;color:#111} h1{font-size:18px;margin:0 0 2px} .sub{color:#555;font-size:12px;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;font-size:14px} td{padding:6px 0;border-bottom:1px solid #ddd} td:first-child{color:#555;width:42%}
      .v{font-size:22px;font-weight:700;margin:14px 0} .rod{margin-top:22px;font-size:11px;color:#666} .canc{color:#b00;font-weight:700}
      @media print{button{display:none}}</style></head><body>
      <h1>${esc(c.associacao.nome)}</h1>
      <div class="sub">${esc([c.associacao.endereco, c.associacao.telefone].filter(Boolean).join(' · '))}</div>
      <h1>Comprovante de pagamento — mensalidade</h1>
      ${c.canceladoEm ? '<div class="canc">PAGAMENTO ESTORNADO</div>' : ''}
      <div class="v">${esc(brl(c.valor))}</div>
      <table>
        <tr><td>Sócio</td><td>${esc(c.socioNome)}</td></tr>
        <tr><td>Matrícula</td><td>${esc(c.matricula || '—')}</td></tr>
        <tr><td>Mês de referência</td><td>${esc(String(c.mes).padStart(2, '0'))}/${c.ano}</td></tr>
        <tr><td>Forma de pagamento</td><td>${esc(c.forma)}</td></tr>
        <tr><td>Data do pagamento</td><td>${esc(dt(c.dataPagamento))}</td></tr>
        <tr><td>Recebido por</td><td>${esc(c.registradoPor || '—')}</td></tr>
        <tr><td>Nº do registro</td><td>${c.id}</td></tr>
        ${c.observacao ? `<tr><td>Observação</td><td>${esc(c.observacao)}</td></tr>` : ''}
      </table>
      <div class="rod">Este comprovante não é documento fiscal. Emitido em ${esc(new Date().toLocaleString('pt-BR'))}.</div>
      <p><button onclick="window.print()">Imprimir</button></p></body></html>`);
    w.document.close();
  }

  async function acaoMens(el) {
    const tipo = el.dataset.mens;
    try {
      if (tipo === 'recarregar') { state.mensHoje = null; render(); await carregarMensHoje(); render(); return; }
      if (tipo === 'abrir') {
        await abrirFichaMens(Number(el.dataset.id));
        render();
        const campo = document.getElementById('mf-valor');
        if (campo) campo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (tipo === 'comprovante') {
        imprimirComprovante(await api(`/mensalidades/comprovante/${el.dataset.id}`));
        return;
      }
      if (tipo === 'estornar') {
        const motivo = await pergunta('Motivo do estorno (obrigatório):');
        if (!motivo || motivo.trim().length < 3) { if (motivo !== null) avisar('Informe o motivo (pelo menos 3 letras).'); return; }
        await api(`/mensalidades/pagamentos/${el.dataset.id}/estornar`, { method: 'POST', body: { motivo: motivo.trim() } });
      } else if (tipo === 'receber') {
        const f = lerFormMens();
        state.mensForm = f;
        const [ano, mes] = f.mes.split('-').map(Number);
        const valor = parseNumero(f.valor);
        if (!(valor > 0)) { avisar('Informe o valor.'); return; }
        const corpo = { socioId: state.mensFicha.socio.id, ano, mes, valor, forma: f.forma, dataPagamento: f.data, observacao: f.obs };
        let pagamento;
        try {
          pagamento = await api('/mensalidades/pagamentos', { method: 'POST', body: corpo });
        } catch (err) {
          if (!err.precisaConfirmar) throw err;
          if (!await confirma(err.message)) return;
          pagamento = await api('/mensalidades/pagamentos', { method: 'POST', body: { ...corpo, confirmarParcial: true } });
        }
        state.mensForm = null;
        await abrirFichaMens(state.mensFicha.socio.id);
        await carregarMensHoje();
        render();
        if (await confirma('Recebimento registrado. Abrir o comprovante para imprimir?')) imprimirComprovante(await api(`/mensalidades/comprovante/${pagamento.id}`));
        return;
      }
      await abrirFichaMens(state.mensFicha.socio.id);
      await carregarMensHoje();
      render();
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---------- início: busca de sócio + quem frequentou ----------
  // Só isso: a recepção procura o sócio, registra a presença do dia, e os números
  // mostram quantos sócios frequentaram hoje, na semana e no mês (só ATPN).
  function resultadosInicioHtml() {
    if (state.iniBusca.trim().length < 2) return '';
    if (!state.iniResultados.length) return '<p class="placeholder" style="margin-top:12px;">Nenhum sócio ATPN ativo encontrado.</p>';
    return `<div style="margin-top:8px;">${state.iniResultados.map((s) => `
      <div class="linha-item">
        <div><div class="nome">${esc(s.nome)}${tagDobro(s)}</div>
          <div class="desc">Matrícula ${esc(s.matricula || '—')} · ${pilulaStatus(s.status)}${s.telefone ? ' · ' + esc(s.telefone) : ''} · ${s.visitasMes} ${s.visitasMes === 1 ? 'vez' : 'vezes'} no mês</div></div>
        ${s.presenteHoje ? '<span class="tag-tipo" style="font-size:.8rem;">✓ Presente hoje</span>'
          : `<button class="botao" data-ini="presenca" data-id="${s.id}">Confirmar presença</button>`}
      </div>
      ${(s.dependentes || []).map((d) => `
      <div class="linha-item" style="margin-left:18px;">
        <div><div class="nome"><span class="st-pill st-dep">dependente</span> ${esc(d.nome)}</div>
          <div class="desc">de ${esc(s.nome)}</div></div>
        ${d.presenteHoje ? '<span class="tag-tipo" style="font-size:.8rem;">✓ Presente hoje</span>'
          : `<button class="botao" data-ini="presenca" data-id="${s.id}" data-dep="${d.id}">Confirmar presença</button>`}
      </div>`).join('')}`).join('')}</div>`;
  }

  function viewInicio() {
    const cab = cabecalho('Início', 'Procure um sócio e registre a presença de hoje');
    if (state.inicioErro || (state.inicioCarregado && !state.inicio)) {
      return `${cab}<div class="secao"><p>Não foi possível carregar (${esc(state.inicioErro || 'erro')}). Os números <strong>não</strong> são zero — é falha de carregamento. <button class="botao" data-ini="recarregar">Tentar de novo</button></p></div>`;
    }
    if (!state.inicioCarregado) return `${cab}<p class="placeholder">Carregando…</p>`;
    const r = state.inicio;
    const cartao = (rot, p) => `
      <div class="cartao-resumo"><span class="cartao-resumo-label">${rot}</span>
        <strong class="cartao-resumo-valor">${p.pessoas}</strong>
        <span class="cartao-resumo-label" style="margin:2px 0 0;text-transform:none;">${p.visitas} ${p.visitas === 1 ? 'visita' : 'visitas'}</span></div>`;
    const ehAdmin = state.usuario.administrador;
    const lista = r.hoje.map((p) => `
      <div class="linha-item"><div><div class="nome">${p.dependente ? '<span class="st-pill st-dep">dependente</span> ' : ''}${esc(p.nome)}</div><div class="desc">chegou às ${esc(p.hora)}${p.categoria ? ' · ' + esc(p.categoria) : ''}</div></div>
        ${ehAdmin ? `<button class="botao botao-perigo botao-pq" data-ini="desfazer" data-id="${p.id}" title="Desfazer esse registro">✕</button>` : ''}</div>`).join('')
      || '<p class="placeholder">Ninguém registrado hoje ainda.</p>';
    return `
      ${cab}
      <div class="secao">
        ${state.iniMsg ? `<p class="aviso-livre" style="margin:0 0 10px;">${esc(state.iniMsg)}</p>` : ''}
        <input type="text" inputmode="search" id="ini-busca" class="busca-socios-grande" placeholder="Buscar sócio (nome, matrícula…)" value="${esc(state.iniBusca)}"
          autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search" />
        <div id="ini-resultados">${resultadosInicioHtml()}</div>
      </div>
      <h3>Quem frequentou</h3>
      <div class="cartoes-resumo">${cartao('Hoje', r.dia)}${cartao('Esta semana', r.semana)}${cartao('Este mês', r.mes)}</div>
      <p class="placeholder">"Pessoas" são sócios diferentes; "visitas" somam cada dia em que vieram. A semana começa na segunda-feira. Só sócios da ATPN.</p>
      <div class="secao"><h3>Quem veio hoje (${r.hoje.length})</h3>${lista}</div>`;
  }

  async function carregarInicio() {
    state.inicioErro = null;
    try { state.inicio = await api('/presencas/resumo'); } catch (err) { state.inicio = null; state.inicioErro = err.message; }
    state.inicioCarregado = true;
  }

  let timerBuscaInicio = null;
  // A busca atualiza SÓ a área de resultados (a tela não é refeita a cada letra), pra o
  // teclado do celular não fechar e o cursor não pular.
  function ligarBuscaInicio() {
    const campo = document.getElementById('ini-busca');
    if (!campo) return;
    campo.addEventListener('input', (e) => {
      state.iniBusca = e.target.value;
      clearTimeout(timerBuscaInicio);
      timerBuscaInicio = setTimeout(async () => {
        try {
          state.iniResultados = state.iniBusca.trim().length >= 2 ? await api(`/presencas/buscar?q=${encodeURIComponent(state.iniBusca.trim())}`) : [];
        } catch (err) { state.iniResultados = []; avisar(err.message); }
        const alvo = document.getElementById('ini-resultados');
        if (!alvo) return;
        alvo.innerHTML = resultadosInicioHtml();
        alvo.querySelectorAll('[data-ini]').forEach((el) => el.addEventListener('click', () => acaoInicio(el)));
      }, 250);
    });
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); }); // Enter/Buscar recolhe o teclado e deixa ver os resultados
  }

  async function acaoInicio(el) {
    const a = el.dataset.ini;
    const id = Number(el.dataset.id);
    try {
      if (a === 'recarregar') { state.inicioCarregado = false; render(); await carregarInicio(); render(); return; }
      if (a === 'presenca') {
        const dep = el.dataset.dep ? Number(el.dataset.dep) : null;
        const socio = state.iniResultados.find((s) => s.id === id) || {};
        const nome = dep ? ((socio.dependentes || []).find((d) => d.id === dep) || {}).nome || 'Dependente' : socio.nome || 'Sócio';
        if (!await confirma(`Confirmar a presença de ${nome} hoje?`, { ok: 'Confirmar presença' })) return;
        const r = await api('/presencas', { method: 'POST', body: { socioId: id, dependenteId: dep } });
        state.iniMsg = r.jaRegistrado ? `${nome} já estava registrado(a) hoje.` : `✓ Presença de ${nome} registrada.`;
        state.iniBusca = ''; state.iniResultados = [];
      } else if (a === 'desfazer') {
        if (!await confirma('Desfazer esse registro de presença?', { ok: 'Desfazer', perigo: true })) return;
        await api(`/presencas/${id}`, { method: 'DELETE' });
        state.iniMsg = null;
      }
      await carregarInicio();
      render();
      const campo = document.getElementById('ini-busca');
      if (campo && a === 'presenca') campo.focus(); // pronto pra próxima pessoa na fila
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---------- eventos (próximos 90 dias, só leitura, mesma agenda) ----------
  function viewAgenda90() {
    if (!state.eventosCarregado) return '<p class="placeholder">Carregando…</p>';
    const lista = [...state.eventosProximos].sort((a, b) => a.data.localeCompare(b.data) || (a.horaInicio || '').localeCompare(b.horaInicio || ''));
    const grupos = new Map();
    lista.forEach((e) => { const k = e.data.slice(0, 7); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(e); });
    const nomeMes = (k) => {
      const [a, m] = k.split('-').map(Number);
      const t = new Date(a, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      return t.charAt(0).toUpperCase() + t.slice(1);
    };
    const cartao = (e) => {
      const dt = new Date(`${e.data}T12:00:00`);
      const dia = dt.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
      const hora = e.horaInicio ? `${e.horaInicio}${e.horaFim ? '–' + e.horaFim : ''}` : 'sem horário';
      return `<div class="cartao-reserva">
        <div class="topo-reserva">
          <div><strong>${esc(e.titulo)}</strong>
            <div class="placeholder">📅 ${esc(dia)}, ${esc(e.data.split('-').reverse().join('/'))} · ${esc(hora)}</div>
            ${e.observacao ? `<div class="placeholder">${esc(e.observacao)}</div>` : ''}
          </div>
          <span class="tag-status ${e.proprio ? 'tag-confirmado' : 'tag-novo'}">${e.proprio ? 'ATPN' : esc(e.origem || 'Restaurante')}</span>
        </div>
      </div>`;
    };
    const corpo = [...grupos.keys()].map((k) => `<h3 style="margin:14px 0 6px;">${esc(nomeMes(k))} <span class="placeholder">· ${grupos.get(k).length} ${grupos.get(k).length === 1 ? 'evento' : 'eventos'}</span></h3>${grupos.get(k).map(cartao).join('')}`).join('')
      || '<div class="vazio"><h3>Nenhum evento nos próximos 90 dias</h3><p>Os eventos do espaço (agenda do restaurante) e os da ATPN aparecem aqui.</p></div>';
    return `
      <p class="placeholder">Próximos 90 dias — eventos e reservas do espaço (agenda compartilhada com o PDV Jabá) e os da ATPN. Reservas da ATPN só aparecem aqui depois de confirmadas.</p>
      ${corpo}`;
  }

  // ---------- eventos / reservas da ATPN (funil + conflito de espaço + equipe) ----------
  // Mesmo desenho do PDV: cabeçalho com "+ Novo", pílulas de filtro com contagem,
  // lista agrupada por mês (seção que abre/fecha) e um cartão por reserva com
  // observação da equipe e os botões do próximo passo. Formulário em modal.
  const STATUS_RESERVA = { novo: 'Novo', negociando: 'Em negociação', confirmado: 'Confirmado', recusado: 'Recusado', concluido: 'Concluído' };
  // próximos passos de cada status: [status destino, rótulo, estilo]
  const ACOES_RESERVA = {
    novo: [['negociando', 'Iniciar negociação', 'botao-sec'], ['confirmado', 'Confirmar', 'botao-sec'], ['recusado', 'Recusar', 'botao-perigo']],
    negociando: [['confirmado', 'Confirmar', 'botao-sec'], ['novo', 'Voltar p/ novo', 'botao-sec'], ['recusado', 'Recusar', 'botao-perigo']],
    confirmado: [['concluido', '✔ Concluir', ''], ['negociando', 'Voltar p/ negociação', 'botao-sec'], ['recusado', 'Recusar', 'botao-perigo']],
    recusado: [['novo', '↩ Reabrir', 'botao-sec']],
    concluido: [['confirmado', '↩ Reabrir', 'botao-sec']],
  };
  const ABAS_EVENTOS = ['agenda', 'abertas', 'confirmadas', 'encerradas'];

  function textoConflito(c) {
    const quando = c.horaInicio ? `${c.horaInicio}${c.horaFim ? '–' + c.horaFim : ''}` : 'sem horário';
    const rotulo = c.motivo === 'sobrepoe' ? 'Horário sobreposto' : 'Mesmo dia, sem horário pra comparar';
    return `${rotulo}: ${c.titulo} (${c.origem || '?'}, ${quando})`;
  }
  const listaConflitosTexto = (lista) => lista.map((c) => `• ${textoConflito(c)}`).join('\n');

  function avisosConflitoHtml(conflitos, configurado) {
    if (conflitos === null) return '<div class="aviso-conflito aviso-incerto">Não foi possível checar conflitos agora (agenda do PDV indisponível) — isso não significa que está livre.</div>';
    if (configurado === false) return '<div class="aviso-conflito aviso-incerto">Integração com o PDV Jabá não configurada: conflitos não são checados.</div>';
    if (conflitos && conflitos.length) return conflitos.map((c) => `<div class="aviso-conflito ${c.motivo === 'sobrepoe' ? 'aviso-forte' : ''}">⚠ ${esc(textoConflito(c))}</div>`).join('');
    return '<div class="aviso-livre">✓ Nenhum conflito de espaço nesse dia.</div>';
  }

  function cartaoReservaHtml(r, ehAdmin) {
    const dia = new Date(`${r.data}T12:00:00`).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
    const passou = ['novo', 'negociando', 'confirmado'].includes(r.status) && r.data < dataLocalStr(new Date());
    const aberta = r.status === 'novo' || r.status === 'negociando';
    const encerrada = r.status === 'recusado' || r.status === 'concluido';
    const equipe = (r.equipe || []).length ? `<div class="placeholder" style="margin-top:3px;">👥 <strong>Equipe:</strong> ${esc(r.equipe.map((p) => p.nome).join(', '))}</div>` : '';
    const acoes = ehAdmin ? `
      <div class="acoes-reserva">
        ${encerrada ? '' : `<button class="botao botao-sec botao-pq" data-rv="obs" data-id="${r.id}">Salvar observação</button>`}
        <button class="botao botao-sec botao-pq" data-rv="editar" data-id="${r.id}">✎ Editar</button>
        <button class="botao botao-sec botao-pq" data-rv="equipe" data-id="${r.id}">👥 ${(r.equipe || []).length ? 'Equipe' : 'Escalar equipe'}</button>
        ${(ACOES_RESERVA[r.status] || []).map(([s, rot, est]) => `<button class="botao ${est} botao-pq" data-rv="status" data-id="${r.id}" data-valor="${s}">${rot}</button>`).join('')}
        <button class="botao botao-perigo botao-pq" data-rv="excluir" data-id="${r.id}">🗑 Excluir</button>
      </div>` : '';
    return `
      <div class="cartao-reserva status-${esc(r.status)}">
        <div class="topo-reserva">
          <div><strong>${esc(r.titulo)}</strong>
            <div class="placeholder">📅 ${esc(dia)}${r.horaInicio ? ` · ${esc(r.horaInicio)}${r.horaFim ? '–' + esc(r.horaFim) : ''}` : ' · sem horário'}${r.numConvidados ? ` · 👥 ${r.numConvidados} pessoas` : ''}</div>
            ${r.solicitante || r.telefone ? `<div class="placeholder">${esc(r.solicitante || '')}${r.telefone ? ' · ' + esc(r.telefone) : ''}</div>` : ''}
            ${r.observacao ? `<div class="placeholder">${esc(r.observacao)}</div>` : ''}
            ${equipe}
          </div>
          <span class="tag-status tag-${esc(r.status)}">${esc(STATUS_RESERVA[r.status])}</span>
        </div>
        ${passou ? '<div class="aviso-conflito">⚠ A data já passou — conclua, edite ou exclua.</div>' : ''}
        ${aberta ? avisosConflitoHtml(r.conflitos, state.reservas && state.reservas.configurado) : ''}
        ${encerrada ? (r.obsEquipe ? `<div class="placeholder" style="margin-top:6px;">Equipe: ${esc(r.obsEquipe)}</div>` : '')
          : `<label class="campo" style="margin-top:10px;"><span>Observação da equipe</span><input id="obs-${r.id}" class="input-obs-equipe" maxlength="500" value="${esc(r.obsEquipe || '')}" placeholder="Ex.: orçamento enviado, sinal pago, cliente vai confirmar" ${ehAdmin ? '' : 'disabled'} /></label>`}
        ${acoes}
      </div>`;
  }

  // agrupado por mês, cada mês numa seção que abre/fecha; "Este mês" abre sozinho
  function reservasPorMesHtml(lista, aba, ehAdmin) {
    const grupos = new Map();
    lista.forEach((r) => { const k = r.data.slice(0, 7); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(r); });
    const mesAtual = dataLocalStr(new Date()).slice(0, 7);
    const rotulo = (k) => {
      if (k === mesAtual) return 'Este mês';
      const [a, m] = k.split('-').map(Number);
      const t = new Date(a, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      return t.charAt(0).toUpperCase() + t.slice(1);
    };
    return [...grupos.keys()].map((k) => {
      const chave = `${aba}:${k}`;
      const padrao = k <= mesAtual || grupos.size === 1; // meses passados/atual abertos; futuros fechados se houver muitos
      const aberto = chave in state.eventosMesesAbertos ? state.eventosMesesAbertos[chave] : (k === mesAtual || grupos.size <= 3 || padrao);
      const itens = grupos.get(k);
      return `<div class="mes-grupo">
        <button class="mes-grupo-cab" data-rv="mes" data-chave="${esc(chave)}" data-aberto="${aberto ? 1 : 0}" aria-expanded="${aberto}">
          <span>${esc(rotulo(k))} <span class="placeholder">· ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}</span></span><span>${aberto ? '▴' : '▾'}</span></button>
        ${aberto ? itens.map((r) => cartaoReservaHtml(r, ehAdmin)).join('') : ''}
      </div>`;
    }).join('');
  }

  function viewEventos() {
    const ehAdmin = state.usuario.administrador;
    const aba = ABAS_EVENTOS.includes(state.eventosAba) ? state.eventosAba : 'agenda';
    const cab = cabecalho('Eventos/Reservas', 'Reservas e pedidos de evento no espaço da ATPN. Só as confirmadas entram na agenda compartilhada com o restaurante; antes de confirmar, o sistema avisa se já há algo no mesmo dia.',
      ehAdmin ? '<button class="botao" data-rv="nova">+ Novo evento/reserva</button>' : '');
    if (state.reservasErro) {
      return `${cab}<div class="secao"><p>Não foi possível carregar as reservas (${esc(state.reservasErro)}). Isso é falha de carregamento, não "nenhuma reserva". <button class="botao" data-rv="recarregar">Tentar de novo</button></p></div>`;
    }
    if (!state.reservas) return `${cab}<p class="placeholder">Carregando…</p>`;

    const todas = state.reservas.reservas;
    const grupo = {
      abertas: todas.filter((r) => r.status === 'novo' || r.status === 'negociando').sort((a, b) => a.data.localeCompare(b.data) || (a.horaInicio || '').localeCompare(b.horaInicio || '')),
      confirmadas: todas.filter((r) => r.status === 'confirmado').sort((a, b) => a.data.localeCompare(b.data) || (a.horaInicio || '').localeCompare(b.horaInicio || '')),
      encerradas: todas.filter((r) => r.status === 'recusado' || r.status === 'concluido').sort((a, b) => b.data.localeCompare(a.data)),
    };
    const pilula = (id, rot, n) => `<button class="pilula ${aba === id ? 'sel' : ''}" data-rv="aba" data-valor="${id}">${rot}${n != null ? ` (${n})` : ''}</button>`;
    const filtros = `<div class="pilulas-escolha" style="margin:0 0 14px;">${pilula('agenda', 'Agenda', state.eventosCarregado ? state.eventosProximos.length : null)}${pilula('abertas', 'Reservas em aberto', grupo.abertas.length)}${pilula('confirmadas', 'Confirmadas', grupo.confirmadas.length)}${pilula('encerradas', 'Recusadas / concluídas', grupo.encerradas.length)}</div>`;
    if (aba === 'agenda') return `${cab}${filtros}${viewAgenda90()}`;

    const lista = grupo[aba];
    const vazio = {
      abertas: ['Nada em aberto', 'Cadastre uma reserva em “+ Novo evento/reserva” ou marque no calendário.'],
      confirmadas: ['Nenhuma reserva confirmada', 'As confirmadas aparecem aqui e na agenda do restaurante.'],
      encerradas: ['Nada encerrado ainda', 'Reservas concluídas ou recusadas aparecem aqui.'],
    }[aba];
    return `${cab}${filtros}${lista.length ? reservasPorMesHtml(lista, aba, ehAdmin) : `<div class="vazio"><h3>${vazio[0]}</h3><p>${vazio[1]}</p></div>`}`;
  }

  async function carregarReservas() {
    state.reservasErro = null;
    try {
      state.reservas = await api('/reservas?filtro=todas');
    } catch (err) {
      state.reservas = null;
      state.reservasErro = err.message;
    }
  }

  async function carregarAgenda90() {
    try {
      const hoje = new Date();
      const fim = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 90);
      const resposta = await api(`/calendario?inicio=${dataLocalStr(hoje)}&fim=${dataLocalStr(fim)}`);
      state.eventosProximos = resposta.eventos;
      state.eventosCarregado = true;
    } catch (err) {
      state.eventosProximos = [];
      state.eventosCarregado = true;
    }
    if (state.abaAtual === 'eventos') render();
  }

  // ---- formulário (novo / editar) em modal, com a prévia de conflito ao vivo ----
  function abrirReservaModal(r) {
    const e = r || {};
    const est = { id: e.id || null, titulo: e.titulo || '', solicitante: e.solicitante || '', telefone: e.telefone || '', data: e.data || '',
      ini: e.horaInicio || '', fim: e.horaFim || '', conv: e.numConvidados || '', obs: e.observacao || '' };
    const previa = async () => {
      const alvo = document.getElementById('rv-previa');
      if (!alvo) return;
      if (!est.data) { alvo.innerHTML = '<span class="placeholder">Escolha a data (e o horário) para ver se o espaço está livre.</span>'; return; }
      try {
        const p = new URLSearchParams({ data: est.data, horaInicio: est.ini, horaFim: est.fim });
        if (est.id) p.set('ignorarId', est.id);
        const r2 = await api(`/reservas/conflitos?${p.toString()}`);
        alvo.innerHTML = avisosConflitoHtml(r2.conflitos, r2.configurado);
      } catch (err) {
        alvo.innerHTML = avisosConflitoHtml(null, true);
      }
    };
    abrirModal({
      titulo: est.id ? 'Editar reserva' : 'Novo evento/reserva',
      fecharNoFundo: false,
      render: () => `
        <label class="campo"><span>Título (obrigatório)</span><input id="rv-titulo" maxlength="120" value="${esc(est.titulo)}" placeholder="Ex.: Formatura Turma 2026" /></label>
        <div class="campo-linha">
          <label class="campo"><span>Solicitante</span><input id="rv-solicitante" maxlength="100" value="${esc(est.solicitante)}" /></label>
          <label class="campo"><span>Telefone</span><input id="rv-telefone" maxlength="30" inputmode="tel" value="${esc(est.telefone)}" /></label>
        </div>
        <label class="campo"><span>Data</span><input id="rv-data" type="date" value="${esc(est.data)}" /></label>
        <div class="campo-linha">
          <label class="campo"><span>Início</span><input id="rv-inicio" type="time" value="${esc(est.ini)}" /></label>
          <label class="campo"><span>Fim</span><input id="rv-fim" type="time" value="${esc(est.fim)}" /></label>
        </div>
        <label class="campo"><span>Convidados</span><input id="rv-convidados" inputmode="numeric" maxlength="6" value="${esc(est.conv)}" /></label>
        <label class="campo"><span>Observação do pedido</span><input id="rv-obs" maxlength="500" value="${esc(est.obs)}" /></label>
        <div id="rv-previa" class="placeholder">Escolha a data (e o horário) para ver se o espaço está livre.</div>
        <div class="acoes-modal"><button class="botao" data-m="salvar">${est.id ? 'Salvar alterações' : 'Adicionar reserva'}</button><button class="botao botao-sec" data-m="cancelar">Cancelar</button></div>`,
      onMontar: () => previa(),
      onInput: (c) => {
        const mapa = { 'rv-titulo': 'titulo', 'rv-solicitante': 'solicitante', 'rv-telefone': 'telefone', 'rv-convidados': 'conv', 'rv-obs': 'obs' };
        if (mapa[c.id]) est[mapa[c.id]] = c.value;
      },
      onMudou: (c) => {
        const mapa = { 'rv-data': 'data', 'rv-inicio': 'ini', 'rv-fim': 'fim' };
        if (mapa[c.id]) { est[mapa[c.id]] = c.value; previa(); }
      },
      onClick: async (el) => {
        if (el.dataset.m === 'cancelar') { fecharModal(); return; }
        const corpo = { titulo: est.titulo, solicitante: est.solicitante, telefone: est.telefone, data: est.data,
          horaInicio: est.ini, horaFim: est.fim, numConvidados: est.conv, observacao: est.obs };
        const chamar = (extra) => api(est.id ? `/reservas/${est.id}` : '/reservas', { method: est.id ? 'PUT' : 'POST', body: { ...corpo, ...extra } });
        try {
          try {
            await chamar({});
          } catch (err) {
            if (!err.conflitos) throw err;
            if (!await confirma(`Conflito de espaço:\n\n${listaConflitosTexto(err.conflitos)}\n\nSalvar mesmo assim?`, { ok: 'Salvar mesmo assim' })) return;
            await chamar({ forcar: true });
          }
          fecharModal();
          await atualizarEventos();
        } catch (err) { avisar(err.message); }
      },
    });
  }

  async function atualizarEventos() {
    await carregarReservas();
    state.eventosCarregado = false;
    render();
    carregarAgenda90();
  }

  async function acaoReserva(el) {
    const tipo = el.dataset.rv;
    const id = Number(el.dataset.id);
    try {
      if (tipo === 'aba') { state.eventosAba = el.dataset.valor; render(); return; }
      if (tipo === 'recarregar') { state.reservas = null; render(); await carregarReservas(); render(); return; }
      if (tipo === 'mes') { state.eventosMesesAbertos[el.dataset.chave] = el.dataset.aberto !== '1'; render(); return; }
      if (tipo === 'nova') { abrirReservaModal(null); return; }
      const r = state.reservas && state.reservas.reservas.find((x) => x.id === id);
      if (tipo === 'editar') { abrirReservaModal(r); return; }
      if (tipo === 'equipe') { await abrirEquipeModal(r, null); return; } // salvar recarrega a tela (dentro do modal)
      if (tipo === 'obs') {
        const campo = document.getElementById(`obs-${id}`);
        await api(`/reservas/${id}/obs-equipe`, { method: 'PUT', body: { obsEquipe: campo ? campo.value : '' } });
        await avisar('Observação salva.');
      } else if (tipo === 'excluir') {
        if (!await confirma('Excluir essa reserva? Se estiver confirmada, ela também sai da agenda do restaurante. Isso não tem volta.', { ok: 'Excluir', perigo: true })) return;
        await api(`/reservas/${id}`, { method: 'DELETE' });
      } else if (tipo === 'status') {
        try {
          await api(`/reservas/${id}/status`, { method: 'POST', body: { status: el.dataset.valor } });
        } catch (err) {
          if (!err.conflitos) throw err;
          if (!await confirma(`Conflito de espaço:\n\n${listaConflitosTexto(err.conflitos)}\n\nConfirmar mesmo assim?`, { ok: 'Confirmar mesmo assim' })) return;
          await api(`/reservas/${id}/status`, { method: 'POST', body: { status: el.dataset.valor, forcar: true } });
        }
      }
      await atualizarEventos();
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---------- calendário: eventos + feriados + escala da equipe da ATPN ----------
  // Mesmo comportamento do PDV Jabá: a grade é clicável e cada dia abre um modal
  // (feriados, eventos, escala com o ponto batido, equipe dos eventos). Só o
  // Administrador cria evento, escala, edita e remove. A escala é DA ATPN
  // (tabela própria) e não vai pra agenda do restaurante.
  const MAX_PILULAS_CELULA = 3;
  const NOMES_DIA_CURTO = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];

  function uid() { return Math.random().toString(36).slice(2, 9); } // mesmo padrão de id do PDV Jabá

  const dataLocalDoIso = (iso) => dataLocalStr(new Date(iso));
  const horaLocalDoIso = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const fmtDataBr = (s) => String(s).split('-').reverse().join('/');
  const faixaHora = (ini, fim) => (ini ? `${ini}${fim ? '–' + fim : ''}` : null);

  function pontosDoDia(dataStr) {
    const porPessoa = new Map();
    state.calPontos.filter((p) => dataLocalDoIso(p.registradoEm) === dataStr).forEach((p) => {
      if (!porPessoa.has(p.pessoaId)) porPessoa.set(p.pessoaId, { nome: p.pessoaNome, horas: [] });
      porPessoa.get(p.pessoaId).horas.push(horaLocalDoIso(p.registradoEm));
    });
    return porPessoa;
  }

  function viewCalendario() {
    const cab = (acoes) => cabecalho('Calendário', 'Eventos e escala da equipe da ATPN', acoes);
    if (!state.calendarioCarregado) return `${cab('')}<p class="placeholder">Carregando…</p>`;
    if (state.calendarioErro) {
      return `${cab('')}<div class="secao"><p>Não foi possível carregar o calendário (${esc(state.calendarioErro)}). Isso é falha de carregamento, não "mês vazio". <button class="botao" data-cal="recarregar">Tentar de novo</button></p></div>`;
    }
    if (!state.calendarioConfigurado) {
      return `${cab('')}
        <div class="secao">
          <p class="placeholder">A integração com o PDV Jabá ainda não foi configurada nesse servidor
          (falta rodar <code>scripts/configurar-integracao-jaba.js</code> uma vez e preencher
          <code>JABA_DATABASE_URL</code>/<code>JABA_LOJA_ID</code> no <code>.env</code>). Sem isso os eventos do
          restaurante não aparecem aqui.</p>
        </div>`;
    }

    const ehAdmin = state.usuario.administrador;
    const { ano, mes } = state.calendarioMesRef;
    const hojeStr = dataLocalStr(new Date());
    const diasNoMes = new Date(ano, mes + 1, 0).getDate();
    const vaziasAntes = new Date(ano, mes, 1).getDay();

    const nav = `
      <button class="botao botao-sec botao-pq" data-cal="mes-ant" aria-label="Mês anterior">←</button>
      <span class="mes-rotulo">${esc(nomeMes(state.calendarioMesRef))}</span>
      <button class="botao botao-sec botao-pq" data-cal="mes-seg" aria-label="Próximo mês">→</button>`;
    const botoesAdmin = ehAdmin ? `
      <button class="botao" data-cal="novo-evento">+ Novo evento</button>
      <button class="botao botao-sec" data-cal="escalar">+ Escalar alguém</button>` : '';

    let celulas = '<div class="cal-cell cal-cell-vazia"></div>'.repeat(vaziasAntes);
    const pontosPorDia = new Set(state.calPontos.map((p) => dataLocalDoIso(p.registradoEm)));
    for (let dia = 1; dia <= diasNoMes; dia++) {
      const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      const evs = state.calendarioEventos.filter((e) => e.data === dataStr);
      const escs = state.calEscalas.filter((e) => e.data === dataStr);
      const fers = feriadosDoDia(dataStr);
      const ehFeriado = fers.some((f) => f.tipo !== 'facultativo');
      const classe = ['cal-cell', dataStr === hojeStr ? 'cal-cell-hoje' : '', evs.length ? 'cal-cell-evento' : '',
        ehFeriado ? 'cal-cell-feriado' : (fers.length ? 'cal-cell-facultativo' : '')].join(' ');
      const visiveis = escs.slice(0, MAX_PILULAS_CELULA);
      const resto = escs.length - visiveis.length;
      celulas += `
        <div class="${classe}" data-cal="dia" data-data="${dataStr}" role="button" tabindex="0" aria-label="Abrir o dia ${dia}">
          <span class="cal-cell-num">${dia}${pontosPorDia.has(dataStr) ? ' <span class="cal-ponto-dot" title="Tem ponto registrado neste dia">●</span>' : ''}</span>
          ${fers.map((f) => `<div class="cal-chip ${f.tipo === 'facultativo' ? 'cal-chip-facultativo' : 'cal-chip-feriado'}">${f.tipo === 'facultativo' ? '' : '🇧🇷 '}${esc(f.nome)}</div>`).join('')}
          ${evs.map((e) => `<div class="cal-chip cal-chip-evento">${esc(e.titulo)}</div>`).join('')}
          ${visiveis.map((e) => `<div class="cal-pilula ${e.reservaId ? 'cal-pilula-evento' : ''}" title="${esc(e.pessoaNome)}${e.horaInicio ? ' · ' + esc(faixaHora(e.horaInicio, e.horaFim)) : ''}">${esc(e.pessoaNome)}</div>`).join('')}
          ${resto > 0 ? `<div class="cal-mais">+${resto}</div>` : ''}
        </div>`;

    const linhasEventos = state.calendarioEventos.map((e) => `
      <div class="linha-item" data-cal="dia" data-data="${e.data}" style="cursor:pointer;">
        <div><div class="nome">${esc(e.titulo)}</div>
          <div class="desc">${esc(fmtDataBr(e.data))}${e.horaInicio ? ' · ' + esc(faixaHora(e.horaInicio, e.horaFim)) : ''}${e.observacao ? ' · ' + esc(e.observacao) : ''}</div></div>
        <span class="tag-tipo">${esc(e.origem || '—')}</span>
      </div>`).join('') || '<div class="vazio"><h3>Nenhum evento neste mês</h3><p>Clique num dia da grade para ver o que há nele.</p></div>';

    return `
      ${cab(`<div class="nav-mes">${nav}</div>${botoesAdmin}`)}
      <div class="secao">
        <div class="cal-legenda">
          <span><i style="background:var(--ev-bg)"></i>Evento</span>
          <span><i style="background:var(--fer-bg)"></i>Feriado</span>
          <span><i style="background:var(--fer-soft)"></i>Ponto facultativo</span>
          <span><i style="background:var(--primaria)"></i>Equipe escalada</span>

        </div>
        <div class="cal-grid-head">${NOMES_DIA_CURTO.map((d) => `<div>${d}</div>`).join('')}</div>
        <div class="cal-grid">${celulas}</div>
      </div>
      <div class="secao"><h3>Eventos do mês</h3>${linhasEventos}</div>`;
