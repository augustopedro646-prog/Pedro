<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATPN — Gestão</title>
<!-- mesmas fontes do PDV Jabá (títulos Baloo 2, texto Inter); sem internet cai na fonte do sistema -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Paleta baseada na marca da ATPN (círculo verde/dourado, "Clube Social"):
     verde principal e dourado de apoio. Nunca cor hardcoded num componente,
     sempre var(--token) — troca de tema (claro/escuro) mexe só aqui. */
  :root {
    color-scheme: light;
    --fundo: #f3f6f3;
    --superficie: #ffffff;
    --borda: #dde6de;
    --texto: #1b241d;
    --texto-fraco: #5f6f62;
    --primaria: #1f7a3f;
    --primaria-texto: #ffffff;
    --dourado: #c99a12;
    --perigo: #b3413a;
    --sidebar-bg: #112a1b;
    --sidebar-text: #d3e6d8;
    --sidebar-active-bg: #1f7a3f;
    --sidebar-active-text: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 10px;
    --ev-bg: #f9dca0; --ev-fg: #6b4a05;
    --fer-bg: #f9c9dc; --fer-soft: #fde9f1; --fer-fg: #8f1d4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fundo: #10140f;
      --superficie: #182019;
      --borda: #27342a;
      --texto: #e8efe9;
      --texto-fraco: #9fb0a4;
      --primaria: #3fae6a;
      --primaria-texto: #0a160d;
      --dourado: #e8c04a;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --ev-bg: #54421a; --ev-fg: #f2d68a;
      --fer-bg: #5a2038; --fer-soft: #3a1a29; --fer-fg: #f6b3cf;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fundo: #10140f;
    --superficie: #182019;
    --borda: #27342a;
    --texto: #e8efe9;
    --texto-fraco: #9fb0a4;
    --primaria: #3fae6a;
    --primaria-texto: #0a160d;
    --dourado: #e8c04a;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --ev-bg: #54421a; --ev-fg: #f2d68a;
    --fer-bg: #5a2038; --fer-soft: #3a1a29; --fer-fg: #f6b3cf;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fundo);
    color: var(--texto);
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- Login ---------- */
  .tela-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cartao-login {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-top: 4px solid var(--dourado);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    width: 100%;
    max-width: 360px;
  }
  .marca-login { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 18px; }
  .marca-login svg { margin-bottom: 10px; }
  .cartao-login h1 { font-size: 1.3rem; letter-spacing: .06em; margin: 0; color: var(--primaria); }
  .cartao-login .sub { color: var(--texto-fraco); font-size: .82rem; margin: 2px 0 0; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: .8rem; color: var(--texto-fraco); margin-bottom: 4px; }
  .campo select, .campo input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    background: var(--fundo);
    color: var(--texto);
  }
  .pin-display { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
  .pin-display span { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--texto-fraco); }
  .pin-display span.preenchido { background: var(--primaria); border-color: var(--primaria); }
  .teclado-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .teclado-pin button {
    padding: 14px 0; border-radius: 8px; border: 1px solid var(--borda);
    background: var(--superficie); cursor: pointer; font-size: 1.1rem;
  }
  .teclado-pin button:active { background: var(--fundo); }
  .erro-login { color: var(--perigo); font-size: .85rem; min-height: 1.2em; margin-top: 8px; text-align: center; }

  /* ---------- Sidebar / shell (mesmo padrão do PDV Jabá) ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 230px;
    background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; transition: transform .2s ease; overflow-y: auto;
    z-index: 10;
  }
  .sidebar.colapsada { transform: translateX(-100%); }
  .main-content { margin-left: 230px; transition: margin-left .2s ease; min-height: 100vh; }
  .main-content.sidebar-colapsada { margin-left: 0; }

  .sidebar .marca { padding: 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .sidebar .marca strong { display: block; }
  .sidebar .marca span { color: var(--sidebar-text); opacity: .7; font-size: .8rem; }
  .sidebar .marca button {
    margin-top: 10px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    background: transparent; color: var(--sidebar-text); cursor: pointer; font-size: .8rem;
  }

  nav.tabs { display: flex; flex-direction: column; gap: 2px; padding: .75rem; flex: 1; overflow-y: auto; }
  nav.tabs button {
    position: relative; display: flex; align-items: center; text-align: left;
    padding: 10px 12px; border-radius: 8px; border: none; background: transparent;
    color: var(--sidebar-text); cursor: pointer; font-size: .92rem;
  }
  nav.tabs button.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); }
  nav.tabs button:not(.active):hover { background: rgba(255,255,255,.08); }
  .tab-badge {
    margin-left: auto; background: var(--perigo); color: #fff; border-radius: 999px;
    font-size: .7rem; padding: 1px 7px; min-width: 18px; text-align: center;
  }

  .user-chip { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: .85rem; }
  .user-chip button {
    margin-top: 8px; background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: .8rem;
  }

  .abrir-sidebar-btn {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--borda); background: var(--superficie);
    box-shadow: var(--shadow); cursor: pointer; font-size: 1.1rem;
  }
  .sidebar-backdrop { display: none; }

  @media (max-width: 820px) {
    .sidebar { width: 78vw; max-width: 280px; box-shadow: 2px 0 16px rgba(0,0,0,.35); }
    .main-content { margin-left: 0 !important; }
    .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9; }
  }

  /* Teclado no celular: campo com fonte menor que 16px faz o iPhone dar zoom ao tocar nele
     (e a tela não volta sozinha). Todo campo fica em 16px no celular. */
  @media (max-width: 820px) { input, select, textarea { font-size: 16px !important; } }
  .busca-socios-grande { -webkit-appearance: none; appearance: none; }
  /* altura que desconta o teclado aberto (dvh) — o modal não fica escondido atrás dele */
  .modal { max-height: calc(100dvh - 32px); }
  @media (max-width: 560px) { .modal { max-height: 94dvh; } }
  .conteudo { padding: 28px; }
  /* em tela estreita o botão ☰ fica por cima do canto: dá espaço no topo (mesmo jeito do PDV) */
  @media (max-width: 820px) { .conteudo { padding: 64px 16px 28px; } }
  .conteudo h2 { margin-top: 0; }
  .placeholder { color: var(--texto-fraco); }

  /* ---------- Configurações ---------- */
  .secao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
  .secao h3 { margin-top: 0; }
  .linha-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .linha-form input, .linha-form select {
    flex: 1 1 160px; min-width: 120px; padding: 8px 10px; border: 1px solid var(--borda);
    border-radius: 6px; background: var(--fundo); color: var(--texto);
  }
  /* ---------- Botões (mesma família do PDV: .btn, .btn-primary, .btn-danger, .btn-sm) ---------- */
  .botao {
    background: var(--primaria); color: var(--primaria-texto); border: 1.5px solid var(--primaria); border-radius: 9px;
    padding: 8px 15px; cursor: pointer; font-size: .9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
  }
  .botao:hover { filter: brightness(1.08); }
  .botao:disabled { opacity: .4; cursor: not-allowed; }
  .botao-sec { background: var(--superficie); color: var(--texto); border-color: var(--borda); }
  .botao-sec:hover { border-color: var(--primaria); filter: none; }
  .botao-perigo { background: transparent; color: var(--perigo); border-color: var(--perigo); }
  .botao-perigo:hover { background: rgba(179,65,58,.1); filter: none; }
  .botao-perigo-cheio { background: var(--perigo); border-color: var(--perigo); color: #fff; }
  .botao-pq { padding: 4px 10px; font-size: .8rem; border-radius: 8px; }

  /* ---------- Cabeçalho de página: título + subtítulo à esquerda, ações à direita ---------- */
  .cabecalho-pagina { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .cabecalho-pagina h2 { margin: 0; }
  .cabecalho-pagina .subtitulo { color: var(--texto-fraco); font-size: .85rem; margin-top: 2px; max-width: 70ch; }
  .cabecalho-acoes { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  .conteudo h2, .conteudo h3, .modal h2, .dialogo h3 { font-family: 'Baloo 2', 'Inter', system-ui, sans-serif; }
  .conteudo h2 { font-size: 1.5rem; color: var(--primaria); }

  /* ---------- Estado vazio ---------- */
  .vazio { text-align: center; padding: 34px 16px; color: var(--texto-fraco); }
  .vazio h3 { color: var(--texto); margin: 0 0 6px; }

  /* ---------- Modal (formulários e detalhes abrem aqui, como no PDV) ---------- */
  body.modal-aberto { overflow: hidden; }
  .modal-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .modal { background: var(--fundo); color: var(--texto); border-radius: 16px; width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .modal-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 16px 20px 8px; }
  .modal-topo h2 { margin: 0; font-size: 1.25rem; color: var(--primaria); }
  .modal-x { background: none; border: none; font-size: 1.6rem; line-height: 1; color: var(--texto-fraco); cursor: pointer; padding: 2px 8px; }
  .modal-x:hover { color: var(--texto); }
  .modal-corpo { padding: 8px 20px 20px; overflow-y: auto; }
  .modal-corpo h4 { font-family: 'Baloo 2', 'Inter', sans-serif; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--texto-fraco); margin: 16px 0 6px; }
  .campo { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--texto-fraco); }
  .campo input, .campo select, .campo textarea { font-size: 16px; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; background: var(--superficie); color: var(--texto); font-family: inherit; }
  .campo-linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acoes-modal { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .linha-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--borda); }
  .linha-item:last-child { border-bottom: none; }
  .linha-item .nome { font-weight: 600; }
  .linha-item .desc { color: var(--texto-fraco); font-size: .82rem; }
  @media (max-width: 560px) {
    .modal-fundo { align-items: flex-end; padding: 0; }
    .modal { border-radius: 16px 16px 0 0; max-height: 94vh; }
  }

  /* ---------- Caixas próprias de aviso/confirmação/pergunta (no lugar de alert/confirm/prompt) ---------- */
  .dialogo-fundo { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .dialogo { background: var(--superficie); color: var(--texto); border: 1px solid var(--borda); border-radius: 14px; max-width: 460px; width: 100%; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .dialogo h3 { margin: 0 0 8px; }
  .dialogo-msg { white-space: pre-wrap; line-height: 1.45; overflow-wrap: anywhere; }
  .dialogo input { width: 100%; margin-top: 12px; font-size: 16px; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; background: var(--fundo); color: var(--texto); }
  .dialogo-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  table.permissoes { border-collapse: collapse; width: 100%; }
  table.permissoes th, table.permissoes td { border: 1px solid var(--borda); padding: 8px 10px; text-align: center; font-size: .85rem; }
  table.permissoes th:first-child, table.permissoes td:first-child { text-align: left; }

  /* ---------- Bater ponto / Fluxo de caixa ---------- */
  table.tabela-lista { border-collapse: collapse; width: 100%; font-size: .88rem; }
  table.tabela-lista th, table.tabela-lista td { border-bottom: 1px solid var(--borda); padding: 8px 10px; text-align: left; }
  @media (max-width: 680px) { .col-sec { display: none; } }
  table.tabela-lista th { color: var(--texto-fraco); font-weight: 600; }
  .botao-ir { background: none; border: none; color: var(--primaria); cursor: pointer; padding: 0; font-size: .85rem; font-weight: 600; }
  .botao-link { background: none; border: none; color: var(--perigo); cursor: pointer; padding: 0; font-size: .82rem; text-decoration: underline; }
  .abas-secundarias { display: flex; gap: 6px; margin-bottom: 14px; }
  .abas-secundarias button { padding: 6px 14px; border: 1px solid var(--borda); background: var(--fundo); border-radius: 999px; cursor: pointer; font-size: .85rem; }
  .abas-secundarias button.ativa { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); }
  .navegacao-mes { display: flex; align-items: center; gap: 12px; }

  /* ---------- Calendário: células clicáveis, pílulas de escala, navegação ---------- */
  .cal-cell[data-cal="dia"] { cursor: pointer; }
  .cal-cell[data-cal="dia"]:hover { border-color: var(--primaria); }
  .cal-cell[data-cal="dia"]:focus-visible { outline: 2px solid var(--primaria); outline-offset: 1px; }
  .cal-ponto-dot { color: var(--primaria); font-size: .6rem; }
  .cal-pilula { font-size: .66rem; line-height: 1.25; padding: 1px 6px; border-radius: 6px; background: var(--primaria); color: var(--primaria-texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-pilula-evento { background: var(--dourado); color: #2b2418; }
  .cal-mais { font-size: .66rem; color: var(--texto-fraco); font-weight: 700; }
  .nav-mes { display: flex; align-items: center; gap: 8px; }
  .mes-rotulo { min-width: 140px; text-align: center; font-weight: 600; }
  .esc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .esc-grid-head { text-align: center; font-size: .72rem; color: var(--texto-fraco); margin-bottom: 2px; }
  .esc-dia { border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 8px; padding: 8px 0; cursor: pointer; font-size: .9rem; }
  .esc-dia:hover { border-color: var(--primaria); }
  .esc-dia.hoje { border-width: 2px; }
  .esc-dia.sel { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); font-weight: 700; }
  .pilulas-escolha { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
  .pilula { border: 1.5px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: .88rem; }
  .pilula.sel { background: var(--primaria); border-color: var(--primaria); color: var(--primaria-texto); }

  /* ---------- Despesas por foto ---------- */
  .tag-tipo { font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--borda); color: var(--texto-fraco); white-space: nowrap; }
  .form-despesa { border-color: var(--primaria); }
  .fotos-despesa { margin: 10px 0; }
  .miniaturas { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .miniatura { display: inline-flex; align-items: flex-start; gap: 4px; }
  .miniatura img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--borda); }
  .pdf-icone { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 96px; border: 1px solid var(--borda); border-radius: 8px; font-weight: 700; }
  .aviso-ia { padding: 8px 12px; border-radius: 8px; background: var(--ev-bg); color: var(--ev-fg); font-size: .85rem; }
  .painel-anexos { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  /* ---------- Eventos / Reservas ---------- */
  .mes-grupo { margin-bottom: 14px; }
  .mes-grupo-cab { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); border-radius: 10px; cursor: pointer; font-weight: 700; font-family: 'Baloo 2', 'Inter', sans-serif; margin-bottom: 10px; }
  .mes-grupo-cab:hover { border-color: var(--primaria); }
  .cartao-reserva { border: 1px solid var(--borda); border-left-width: 4px; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; background: var(--superficie); }
  .cartao-reserva.status-novo { border-left-color: var(--dourado); }
  .cartao-reserva.status-negociando { border-left-color: var(--dourado); }
  .cartao-reserva.status-confirmado { border-left-color: var(--primaria); }
  .cartao-reserva.status-recusado, .cartao-reserva.status-concluido { border-left-color: var(--borda); opacity: .85; }
  .topo-reserva { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .tag-status { align-self: flex-start; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--borda); }
  .tag-confirmado { color: var(--primaria); border-color: var(--primaria); }
  .tag-novo, .tag-negociando { color: var(--dourado); border-color: var(--dourado); }
  .acoes-reserva { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .aviso-conflito { margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-size: .82rem; background: var(--fer-soft); color: var(--fer-fg); }
  .aviso-forte { background: var(--fer-bg); font-weight: 700; }
  .aviso-incerto { background: var(--ev-bg); color: var(--ev-fg); }
  .aviso-livre { margin-top: 8px; font-size: .82rem; color: var(--primaria); font-weight: 600; }

  /* ---------- Configurações / Histórico ---------- */
  .grade-assoc { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .campo-assoc { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--texto-fraco); }
  .campo-assoc input, .linha-horario input[type="time"] { font-size: 16px; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--fundo); }
  .linha-horario { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 0; border-bottom: 1px solid var(--borda); }
  .linha-horario .h-dia { width: 170px; font-weight: 600; font-size: .9rem; }
  .linha-horario .h-turno { display: inline-flex; align-items: center; gap: 6px; }
  .item-historico { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--borda); }

  /* ---------- Relatórios ---------- */
  .rel-barras { display: flex; align-items: flex-end; gap: 6px; height: 160px; margin: 12px 0 4px; }
  .rel-barra { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .rel-barra-fill { width: 100%; background: var(--primaria); border-radius: 4px 4px 0 0; min-height: 2px; }
  .rel-barra.parcial .rel-barra-fill { background: repeating-linear-gradient(45deg, var(--dourado), var(--dourado) 4px, transparent 4px, transparent 8px); border: 1px solid var(--dourado); }
  .rel-barra-rot { display: flex; gap: 6px; font-size: .68rem; color: var(--texto-fraco); }
  .rel-barra-rot span { flex: 1; text-align: center; min-width: 0; }
  .rel-delta-pos { color: var(--primaria); font-weight: 600; }
  .rel-delta-neg { color: var(--perigo); font-weight: 600; }
  .rel-hbar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: .85rem; }
  .rel-hbar-nome { width: 170px; flex: none; }
  .rel-hbar-trilho { flex: 1; background: var(--borda); border-radius: 4px; height: 10px; overflow: hidden; }
  .rel-hbar-fill { height: 100%; background: var(--primaria); }

  /* ---------- Calendário (grade do mês) ---------- */
  .cal-grid-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-grid-head { margin-bottom: 6px; text-align: center; font-size: .72rem; text-transform: uppercase; color: var(--texto-fraco); }
  .cal-cell { min-height: 84px; border: 1px solid var(--borda); border-radius: 8px; background: var(--superficie); padding: 5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-cell-vazia { border: none; background: transparent; }
  .cal-cell-hoje { border-color: var(--primaria); border-width: 2px; }
  .cal-cell-num { font-weight: 700; font-size: .8rem; }
  .cal-cell-evento { background: var(--ev-bg); }
  .cal-cell-evento .cal-cell-num { color: var(--ev-fg); }
  .cal-cell-facultativo { background: var(--fer-soft); }
  .cal-cell-feriado { background: var(--fer-bg); }
  .cal-cell-feriado .cal-cell-num, .cal-cell-facultativo .cal-cell-num { color: var(--fer-fg); }
  .cal-chip { font-size: .66rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip-evento { color: var(--ev-fg); font-weight: 700; }
  .cal-chip-feriado { color: var(--fer-fg); font-weight: 700; }
  .cal-chip-facultativo { color: var(--fer-fg); }
  .cal-legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--texto-fraco); margin-bottom: 10px; }
  .cal-legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  @media (max-width: 680px) { .cal-cell { min-height: 56px; padding: 3px; } .cal-chip { font-size: .58rem; } }

  /* ---------- Cartões/gráficos do Fluxo de caixa ---------- */
  /* Legenda da planilha: verde em dia · azul-claro 1-2 meses · laranja 3-5 · vermelho 6+ · rosa desativado */
  .st-pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; color: #1a1a1a; }
  .st-em_dia { background: #86efac; }
  .st-ate_2_meses { background: #67e8f9; }
  .st-3_a_5_meses { background: #fdba74; }
  .st-6_meses_ou_mais { background: #f87171; color: #fff; }
  .st-desligado { background: #f9a8d4; }
  .st-dep { background: #bfdbfe; }
  .tag-dobro { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 6px; font-size: .7rem; background: #fde68a; color: #7c4a03; font-weight: 600; }
  .cartao-resumo.faixa-em_dia { border-left: 5px solid #4ade80; }
  .cartao-resumo.faixa-ate_2_meses { border-left: 5px solid #22d3ee; }
  .cartao-resumo.faixa-3_a_5_meses { border-left: 5px solid #fb923c; }
  .cartao-resumo.faixa-6_meses_ou_mais { border-left: 5px solid #ef4444; }
  .cartao-resumo.faixa-desligado { border-left: 5px solid #f472b6; }
  .cor-receita { color: var(--primaria); }
  .cor-despesa { color: var(--perigo); }
  .cor-receita-bg { background: var(--primaria); }
  .cor-despesa-bg { background: var(--perigo); }

  .cartoes-resumo { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .cartao-resumo { flex: 1 1 170px; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  /* cartão de número no padrão do PDV (.metric): rótulo pequeno em maiúscula + valor grande em Baloo 2 */
  .cartao-resumo-label { display: block; color: var(--texto-fraco); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .cartao-resumo-valor { font-family: 'Baloo 2', 'Inter', sans-serif; font-size: 1.6rem; font-weight: 700; line-height: 1.15; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primaria); color: var(--primaria-texto); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; flex: none; }
  .user-linha { display: flex; align-items: center; gap: 10px; }

  .graficos-lado-a-lado { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .graficos-lado-a-lado { grid-template-columns: 1fr; } }

  .grafico-categorias { display: flex; flex-direction: column; gap: 10px; }
  .linha-categoria { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .categoria-nome { flex: 0 0 38%; color: var(--texto-fraco); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .categoria-barra-trilho { flex: 1; background: var(--fundo); border-radius: 6px; height: 14px; overflow: hidden; }
  .categoria-barra { height: 100%; border-radius: 6px; }
  .categoria-valor { flex: 0 0 auto; text-align: right; white-space: nowrap; }

  .grafico-tendencia { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding: 10px 4px 0; overflow-x: auto; }
  .coluna-mes { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 28px; height: 100%; justify-content: flex-end; }
  .duas-barras { display: flex; align-items: flex-end; gap: 4px; height: 100%; width: 100%; justify-content: center; }
  .barra-tendencia { width: 14px; min-height: 2px; border-radius: 3px 3px 0 0; }
  .mes-label { margin-top: 6px; font-size: .75rem; color: var(--texto-fraco); text-transform: capitalize; }
  .legenda-tendencia { display: flex; gap: 16px; margin-top: 10px; font-size: .8rem; color: var(--texto-fraco); }
  .legenda-cor { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  /* ---------- Tarefas ---------- */
  .lista-tarefas { display: flex; flex-direction: column; gap: 10px; }
  .item-tarefa { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; cursor: pointer; }
  .item-tarefa input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; flex: none; }
  .item-tarefa.concluida { opacity: .6; }
  .item-tarefa.concluida .item-tarefa-titulo { text-decoration: line-through; }
  .item-tarefa-titulo { font-weight: 600; }
  .item-tarefa-descricao { color: var(--texto-fraco); font-size: .85rem; margin-top: 2px; }
  .item-tarefa-cargo { color: var(--texto-fraco); font-size: .78rem; margin-top: 4px; }
  .dias-semana-tarefa { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .dias-semana-tarefa label { display: flex; align-items: center; gap: 4px; font-size: .85rem; }

  /* ---------- Sócios ---------- */
  .busca-socios-grande {
    width: 100%; padding: 14px 16px; font-size: 1.05rem; border: 2px solid var(--borda);
    border-radius: var(--radius); background: var(--superficie); color: var(--texto);
  }
  .busca-socios-grande:focus { outline: none; border-color: var(--primaria); }
  tr.linha-socio { cursor: pointer; }
  tr.linha-socio:hover { background: var(--fundo); }
  .cor-atraso { color: var(--perigo); }

  /* ---------- Rodapé da sidebar: tema, atualizar ---------- */
  .rodape-sidebar { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 6px; }
  .rodape-sidebar button {
    background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text);
    border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: .82rem; text-align: left;
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- fora do #app de propósito: render() reconstrói o #app inteiro, e modal/diálogo não podem ser destruídos junto -->
<div id="modal-raiz"></div>
<div id="dialogo-raiz"></div>

<script>
(() => {
  // ---------- Estado global (SPA "na mão", sem framework/build step) ----------
  const API_BASE = '/api';
  let timerBuscaSocios = null;

  const state = {
    token: localStorage.getItem('token') || null,
    usuario: null,        // {pessoaId, nome, cargoId, cargoNome, administrador}

    // tela de login
    cargos: [],
    pessoasDoCargo: [],
    cargoSelecionado: null,
    pessoaSelecionada: null,
    pin: '',
    erroLogin: '',

    // shell
    sidebarColapsada: localStorage.getItem('sidebarColapsada') === '1',
    abas: [],
    abaAtual: null,

    // tema (claro/escuro): preferência salva neste aparelho. Sem escolha
    // salva, o CSS já reage sozinho a prefers-color-scheme (não força nada).
    tema: localStorage.getItem('tema'),

    // configurações
    configCarregado: false,
    configCargos: [],
    configEquipe: [],
    calEscalas: [],
    calPontos: [],
    calReservas: [],
    calendarioErro: null,
    despForm: null,
    despAnexos: null,
    financeiroAPagar: null,
    leituraNotaConfigurada: false,
    mensBusca: '',
    mensResultados: [],
    mensFicha: null,
    mensForm: null,
    mensHoje: null,
    mensErro: null,
    eventosAba: 'agenda',
    eventosMesesAbertos: {},
    reservas: null,
    reservasErro: null,
    configAssoc: null,
    historicoTipo: 'associacao',
    historicoVersoes: null,
    historicoErro: null,
    rel: null,
    relErro: null,
    relAba: 'mensalidades',
    relPeriodo: '3m',
    relInadFaixa: 'todas',
    inicio: null,
    inicioCarregado: false,
    inicioErro: null,
    iniBusca: '',
    iniResultados: [],
    iniMsg: null,
    configAbas: [],
    configMatriz: [],

    // bater ponto
    pontoCarregado: false,
    pontoModo: 'pin',
    pontoPessoaId: null,
    pontoStatus: null,
    pontoMsg: null,
    pontoErroPin: null,
    pontoErro: null,
    pontoPessoas: [],
    pontoHoje: [],
    pontoDispositivo: null,
    pontoAparelhos: [],
    pontoRegistros: [],

    // fluxo de caixa
    financeiroCarregado: false,
    financeiroMesRef: null, // {ano, mes(0-indexado)}
    financeiroAba: 'despesas', // ou 'receitas'
    financeiroDespesas: [],
    financeiroReceitas: [],
    financeiroResumo: null,

    // tarefas
    tarefasCarregado: false,
    tarefasData: null, // 'YYYY-MM-DD', padrão: hoje
    tarefasLista: [],
    tarefasCadastroCarregado: false,
    tarefasCadastro: [],
    novaTarefaFrequencia: 'diaria',

    // calendário (agenda compartilhada com o PDV Jabá)
    calendarioCarregado: false,
    calendarioConfigurado: true,
    calendarioMesRef: null,
    calendarioEventos: [],
    eventosProximos: [],
    eventosCarregado: false,

    // sócios (importado de planilha — ver scripts/importar-socios.js)
    sociosCarregado: false,
    sociosBusca: '',
    sociosFiltroClube: 'todos',
    sociosFiltroStatus: 'todos',
    sociosLista: [],
    sociosTotal: 0,
    sociosResumo: [],
    sociosExpandidoId: null,
    sociosDetalhe: null,
  };

  // Aplica o tema salvo antes do primeiro render (senão a tela nasce no
  // tema errado e pisca ao corrigir). Sem escolha salva, não toca no
  // atributo — o CSS cuida da preferência do sistema por conta própria.
  if (state.tema) document.documentElement.setAttribute('data-theme', state.tema);

  const FORMAS_PAGAMENTO = ['Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Pix', 'Boleto', 'Transferência'];

  // Escapa texto livre digitado por qualquer pessoa antes de ir pro
  // innerHTML. Sem isso é XSS armazenado — usar em TODO dado de usuário.
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Padrão de campo numérico: nunca <input type="number"> puro (apaga
  // "10," e depende do locale do navegador) — type="text" inputmode="decimal" + parser.
  function parseNumero(texto) {
    const limpo = String(texto ?? '').trim().replace(/\./g, '').replace(',', '.');
    const n = parseFloat(limpo);
    return Number.isFinite(n) ? n : 0;
  }

  async function api(caminho, opts = {}) {
    const resp = await fetch(API_BASE + caminho, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
        ...(opts.headers || {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const dado = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const erro = new Error(dado.erro || 'Erro na requisição');
      if (dado.conflitos) erro.conflitos = dado.conflitos; // reservas: conflito de espaço (409)
      if (dado.precisaConfirmar) erro.precisaConfirmar = true; // mensalidades: mês já tem pagamento registrado
      throw erro;
    }
    return dado;
  }

  function ehMobile() { return window.matchMedia('(max-width: 820px)').matches; }
  // bolinha de contagem no menu (só pendência de verdade; erro de carga = sem bolinha)
  function badgeDaAba(id) { return Number((state.badges || {})[id]) || 0; }
  async function carregarBadges() {
    try { state.badges = await api('/badges'); } catch (e) { state.badges = {}; }
    // Redesenhar a tela com o teclado aberto destrói o campo em foco e o teclado "bugava".
    // Se a pessoa está digitando, os avisos do menu esperam o próximo ciclo.
    const digitando = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (state.usuario && !digitando) render();
  }
  const iniciaisDe = (nome) => String(nome || '?').trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join('').toUpperCase();

  // ---------- caixas próprias: avisar / confirma / pergunta (no lugar de alert/confirm/prompt) ----------
  // Feitas fora do #app (render() não as destrói), uma por vez, Enter confirma e Esc cancela.
  const filaDialogos = [];
  let dialogoAberto = false;

  function dialogo(cfg) {
    return new Promise((resolve) => {
      filaDialogos.push({ cfg, resolve });
      if (!dialogoAberto) proximoDialogo();
    });
  }

  function proximoDialogo() {
    const item = filaDialogos.shift();
    if (!item) { dialogoAberto = false; return; }
    dialogoAberto = true;
    const { cfg, resolve } = item;
    const raiz = document.getElementById('dialogo-raiz');
    const focoAnterior = document.activeElement;
    raiz.innerHTML = `
      <div class="dialogo-fundo"><div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="dlg-msg">
        ${cfg.titulo ? `<h3>${esc(cfg.titulo)}</h3>` : ''}
        <div class="dialogo-msg" id="dlg-msg">${esc(cfg.mensagem)}</div>
        ${cfg.tipo === 'pergunta' ? `<input id="dlg-entrada" autocomplete="off" value="${esc(cfg.padrao || '')}" placeholder="${esc(cfg.dica || '')}" />` : ''}
        <div class="dialogo-acoes">
          ${cfg.tipo !== 'aviso' ? `<button class="botao botao-sec" data-dlg="nao">${esc(cfg.cancelar || 'Cancelar')}</button>` : ''}
          <button class="botao ${cfg.perigo ? 'botao-perigo-cheio' : ''}" data-dlg="sim">${esc(cfg.ok || 'OK')}</button>
        </div>
      </div></div>`;
    const entrada = raiz.querySelector('#dlg-entrada');
    const fechar = (valor) => {
      document.removeEventListener('keydown', tecla, true);
      raiz.innerHTML = '';
      if (focoAnterior && focoAnterior.focus) try { focoAnterior.focus(); } catch (e) { /* ignora */ }
      resolve(valor);
      proximoDialogo();
    };
    const confirmar = () => fechar(cfg.tipo === 'pergunta' ? entrada.value : (cfg.tipo === 'confirma' ? true : undefined));
    const cancelar = () => fechar(cfg.tipo === 'pergunta' ? null : (cfg.tipo === 'confirma' ? false : undefined));
    function tecla(e) {
      if (e.key === 'Escape') { e.stopPropagation(); e.preventDefault(); cancelar(); }
      else if (e.key === 'Enter') { e.stopPropagation(); e.preventDefault(); confirmar(); }
    }
    document.addEventListener('keydown', tecla, true);
    raiz.querySelector('[data-dlg="sim"]').addEventListener('click', confirmar);
    const btnNao = raiz.querySelector('[data-dlg="nao"]');
    if (btnNao) btnNao.addEventListener('click', cancelar);
    (entrada || raiz.querySelector('[data-dlg="sim"]')).focus();
    if (entrada) entrada.select();
  }

  const avisar = (mensagem, titulo) => dialogo({ tipo: 'aviso', mensagem, titulo });
  const confirma = (mensagem, opcoes) => dialogo({ tipo: 'confirma', mensagem, ...(opcoes || {}) });
  const pergunta = (mensagem, padrao, opcoes) => dialogo({ tipo: 'pergunta', mensagem, padrao, ...(opcoes || {}) });

  // ---------- modal (formulários e detalhes: o dia do calendário, escalar alguém, evento...) ----------
  // Um modal por vez, vivendo fora do #app. O controlador traz: titulo, largura,
  // render() -> html, onClick(el) para os [data-m], onMontar() depois de cada
  // desenho, onInput(campo) opcional e fecharNoFundo (padrão true; formulários
  // com digitação usam false pra um clique sem querer não perder o que foi escrito).
  let modalAtual = null;

  function abrirModal(ctrl) {
    modalAtual = ctrl;
    document.body.classList.add('modal-aberto');
    desenharModal();
  }

  function fecharModal() {
    const c = modalAtual;
    modalAtual = null;
    document.getElementById('modal-raiz').innerHTML = '';
    document.body.classList.remove('modal-aberto');
    if (c && c.aoFechar) c.aoFechar();
  }

  // Redesenha mantendo o campo em foco (e o cursor) — pra marcar um dia, trocar
  // de mês etc. sem o usuário perder onde estava digitando.
  function desenharModal() {
    const raiz = document.getElementById('modal-raiz');
    if (!modalAtual) { raiz.innerHTML = ''; return; }
    const ativo = document.activeElement && raiz.contains(document.activeElement) ? document.activeElement : null;
    const idAtivo = ativo && ativo.id;
    const pos = ativo && typeof ativo.selectionStart === 'number' ? ativo.selectionStart : null;
    const rolagem = raiz.querySelector('.modal-corpo') ? raiz.querySelector('.modal-corpo').scrollTop : 0;
    raiz.innerHTML = `
      <div class="modal-fundo" data-modal-fundo>
        <div class="modal" style="max-width:${modalAtual.largura || 640}px" role="dialog" aria-modal="true">
          <div class="modal-topo"><h2>${esc(modalAtual.titulo)}</h2><button class="modal-x" data-modal-fechar aria-label="Fechar">×</button></div>
          <div class="modal-corpo">${modalAtual.render()}</div>
        </div>
      </div>`;
    const corpo = raiz.querySelector('.modal-corpo');
    if (corpo) corpo.scrollTop = rolagem;
    if (idAtivo) {
      const n = raiz.querySelector(`#${CSS.escape(idAtivo)}`);
      if (n) { n.focus(); if (pos !== null) try { n.setSelectionRange(pos, pos); } catch (e) { /* tipos sem seleção */ } }
    }
    if (modalAtual.onMontar) modalAtual.onMontar(raiz);
  }

  (function ligarModal() {
    const raiz = document.getElementById('modal-raiz');
    raiz.addEventListener('click', (e) => {
      if (!modalAtual) return;
      if (e.target.closest('[data-modal-fechar]')) { fecharModal(); return; }
      const el = e.target.closest('[data-m]');
      if (el && modalAtual.onClick) { modalAtual.onClick(el, e); return; }
      if (e.target.matches('[data-modal-fundo]') && modalAtual.fecharNoFundo !== false) fecharModal();
    });
    raiz.addEventListener('input', (e) => { if (modalAtual && modalAtual.onInput) modalAtual.onInput(e.target, e); });
    raiz.addEventListener('change', (e) => { if (modalAtual && modalAtual.onMudou) modalAtual.onMudou(e.target, e); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalAtual && !dialogoAberto) fecharModal(); });
  })();

  // Cabeçalho padrão de página (igual ao do PDV): título + subtítulo à esquerda e ações à direita.
  function cabecalho(titulo, subtitulo, acoesHtml) {
    return `<div class="cabecalho-pagina"><div><h2>${esc(titulo)}</h2>${subtitulo ? `<div class="subtitulo">${esc(subtitulo)}</div>` : ''}</div>${acoesHtml ? `<div class="cabecalho-acoes">${acoesHtml}</div>` : ''}</div>`;
  }

  // ---------- render ----------
  function render() {
    document.getElementById('app').innerHTML = state.usuario ? viewApp() : viewLogin();
    attachEvents();
  }

  // Marca da ATPN: círculo verde/dourado em dois tons (inspirado no logo
  // real — sem o arquivo oficial ainda; se o Pedro mandar o PNG/SVG da
  // associação, trocamos isso por ele direto).
  function marcaAtpnSvg(tamanho) {
    return `
      <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="49" fill="var(--primaria)"/>
        <path d="M50,1 A49,49 0 0,1 50,99 A24.5,24.5 0 0,1 50,50 A24.5,24.5 0 0,0 50,1 Z" fill="var(--dourado)"/>
        <circle cx="50" cy="25.5" r="6" fill="var(--primaria)"/>
        <circle cx="50" cy="74.5" r="6" fill="var(--dourado)"/>
      </svg>`;
  }

  function viewLogin() {
    return `
      <div class="tela-login">
        <div class="cartao-login">
          <div class="marca-login">
            ${marcaAtpnSvg(56)}
            <h1>ATPN</h1>
            <p class="sub">Clube Social — Natal/RN</p>
          </div>

          <div class="campo">
            <label for="sel-cargo">Cargo / Função</label>
            <select id="sel-cargo" data-action="mudar-cargo">
              ${state.cargos.map((c) => `<option value="${c.id}" ${c.id === state.cargoSelecionado ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="campo">
            <label for="sel-pessoa">Pessoa</label>
            <select id="sel-pessoa" data-action="mudar-pessoa">
              ${state.pessoasDoCargo.map((p) => `<option value="${p.id}" ${p.id === state.pessoaSelecionada ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}
            </select>
          </div>

          <div class="pin-display">
            ${[0, 1, 2, 3].map((i) => `<span class="${i < state.pin.length ? 'preenchido' : ''}"></span>`).join('')}
          </div>
          <div class="teclado-pin">
            ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((n) => `<button data-tecla="${n}">${n}</button>`).join('')}
            <button data-tecla="clear">C</button>
            <button data-tecla="0">0</button>
            <button data-tecla="back">⌫</button>
          </div>
          <p class="erro-login">${esc(state.erroLogin)}</p>
        </div>
      </div>`;
  }

  // Tema em efeito agora: o explícito salvo, ou (sem escolha salva) o que
  // o sistema operacional está usando.
  function temaEscuroAgora() {
    const explicito = document.documentElement.getAttribute('data-theme');
    if (explicito) return explicito === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function sidebarHtml() {
    const itens = [...state.abas];
    if (state.usuario.administrador) {
      itens.push({ id: 'equipe', nome: 'Equipe' });
      itens.push({ id: 'config', nome: 'Configurações' });
      itens.push({ id: 'historico', nome: 'Histórico' });
    }

    const nav = itens.map((a) => {
      const n = badgeDaAba(a.id);
      return `<button data-nav="${a.id}" class="${state.abaAtual === a.id ? 'active' : ''}">
        ${esc(a.nome)}${n > 0 ? `<span class="tab-badge">${n > 99 ? '99+' : n}</span>` : ''}
      </button>`;
    }).join('');

    return `
      <aside class="sidebar ${state.sidebarColapsada ? 'colapsada' : ''}">
        <div class="marca">
          <strong>ATPN</strong>
          <span>Clube Social</span>
          <button data-action="toggle-sidebar">« Esconder</button>
        </div>
        <nav class="tabs">${nav}</nav>
        <div class="rodape-sidebar">
          <button data-action="atualizar">↻ Atualizar</button>
          <button data-action="toggle-tema">${temaEscuroAgora() ? '☀️ Modo claro' : '🌙 Modo escuro'}</button>
        </div>
        <div class="user-chip">
          <div class="user-linha"><span class="avatar">${esc(iniciaisDe(state.usuario.nome))}</span>
            <div><div>${esc(state.usuario.nome)}</div><div style="opacity:.7">${esc(state.usuario.cargoNome)}</div></div></div>
          <button data-action="sair">Sair</button>
        </div>
      </aside>
      ${state.sidebarColapsada
        ? `<button class="abrir-sidebar-btn" data-action="toggle-sidebar">☰</button>`
        : `<div class="sidebar-backdrop" data-action="toggle-sidebar"></div>`}`;
  }

  function viewApp() {
    return `
      ${sidebarHtml()}
      <div class="main-content ${state.sidebarColapsada ? 'sidebar-colapsada' : ''}">
        <div class="conteudo">${viewConteudo()}</div>
      </div>`;
  }

  function viewConteudo() {
    if (state.abaAtual === 'config') return viewConfiguracoes();
    if (state.abaAtual === 'equipe') return viewEquipe();
    if (state.abaAtual === 'ponto') return viewPonto();
    if (state.abaAtual === 'fluxo_caixa') return viewFluxoCaixa();
    if (state.abaAtual === 'tarefas') return viewTarefas();
    if (state.abaAtual === 'calendario') return viewCalendario();
    if (state.abaAtual === 'socios') return viewSocios();
    if (state.abaAtual === 'eventos') return viewEventos();
    if (state.abaAtual === 'inicio') return viewInicio();
    if (state.abaAtual === 'relatorios') return viewRelatorios();
    if (state.abaAtual === 'historico') return viewHistorico();
    if (state.abaAtual === 'mensalidades') return viewMensalidades();
    const nomeAba = (state.abas.find((a) => a.id === state.abaAtual) || {}).nome || '';
    return `
      <h2>${esc(nomeAba)}</h2>
      <p class="placeholder">Tela ainda não desenhada — depende do que o Pedro trouxer da visita à associação.</p>`;
  }

  // ---------- bater ponto ----------
  // Igual ao PDV: modo quiosque (escolhe a pessoa e ela digita o PIN dela), "Equipe hoje"
  // com corrigir/apagar (administrador) e aparelhos autorizados. Enquanto nenhum
  // aparelho foi autorizado, qualquer computador bate ponto.
  const CHAVE_APARELHO = 'atpn-ponto-aparelho';

  function tokenDoAparelho() {
    try {
      let t = localStorage.getItem(CHAVE_APARELHO);
      if (!/^[a-f0-9]{64}$/.test(t || '')) {
        t = [...crypto.getRandomValues(new Uint8Array(32))].map((b) => b.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(CHAVE_APARELHO, t);
      }
      return t;
    } catch (e) { return ''; } // navegador sem localStorage: o aparelho simplesmente não pode ser autorizado
  }
  const cabAparelho = () => ({ 'X-Ponto-Aparelho': tokenDoAparelho() });

  const horaDoIso = (iso) => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  function aparelhoHtml() {
    const d = state.pontoDispositivo;
    const ehAdmin = state.usuario.administrador;
    if (!d) return '';
    let msg;
    if (d.exigeAutorizacao && d.autorizado) msg = '<span class="aviso-livre">✓ Este aparelho está autorizado a bater ponto.</span>';
    else if (d.exigeAutorizacao) msg = '<div class="aviso-conflito aviso-forte">Este computador não está autorizado a bater ponto. Peça ao administrador para autorizá-lo.</div>';
    else msg = '<span class="placeholder">Nenhum aparelho foi autorizado ainda: qualquer computador pode bater ponto. O administrador pode restringir autorizando os computadores da recepção.</span>';
    const lista = ehAdmin ? `
      ${state.pontoAparelhos.length ? `<h4>Aparelhos autorizados</h4>${state.pontoAparelhos.map((a) => `
        <div class="linha-item"><div><div class="nome">${esc(a.nome)}</div><div class="desc">autorizado em ${esc(new Date(a.criadoEm).toLocaleDateString('pt-BR'))}${a.criadoPor ? ' por ' + esc(a.criadoPor) : ''}</div></div>
          <button class="botao botao-perigo botao-pq" data-pt="revogar" data-id="${a.id}">Revogar</button></div>`).join('')}` : ''}
      ${!d.autorizado ? `<div class="campo-linha" style="margin-top:10px;align-items:end;">
        <label class="campo"><span>Nome deste aparelho</span><input id="pt-nome-aparelho" maxlength="60" placeholder="Ex.: Recepção" /></label>
        <div><button class="botao botao-sec" data-pt="autorizar">Autorizar este aparelho</button></div></div>` : ''}` : '';
    return `<div class="secao">${msg}${lista}</div>`;
  }

  function viewPonto() {
    const cab = cabecalho('Bater ponto', 'Escolha a pessoa e confirme com o PIN dela, ou bata o seu próprio ponto');
    if (state.pontoErro) return `${cab}<div class="secao"><p>Não foi possível carregar o ponto (${esc(state.pontoErro)}). Isso é falha de carregamento, não "ninguém bateu ponto". <button class="botao" data-pt="recarregar">Tentar de novo</button></p></div>`;
    if (!state.pontoCarregado) return `${cab}<p class="placeholder">Carregando…</p>`;

    const ehAdmin = state.usuario.administrador;
    const d = state.pontoDispositivo || {};
    const bloqueado = d.exigeAutorizacao && !d.autorizado;
    const modo = state.pontoModo;
    const pilula = (id, rot) => `<button class="pilula ${modo === id ? 'sel' : ''}" data-pt="modo" data-valor="${id}">${rot}</button>`;

    let corpoModo;
    if (modo === 'pin') {
      const porCargo = new Map();
      state.pontoPessoas.forEach((p) => { if (!porCargo.has(p.cargoNome)) porCargo.set(p.cargoNome, []); porCargo.get(p.cargoNome).push(p); });
      const sel = state.pontoPessoas.find((p) => p.id === state.pontoPessoaId);
      const st = state.pontoStatus;
      let statusTxt = '';
      if (sel) {
        statusTxt = !st ? 'Carregando…' : (st.ultimo && st.ultimo.tipo === 'entrada'
          ? `${sel.nome} está trabalhando desde ${horaDoIso(st.ultimo.registradoEm)}`
          : (st.ultimo ? `${sel.nome} está fora do expediente — última saída às ${horaDoIso(st.ultimo.registradoEm)}` : `${sel.nome} ainda não bateu ponto`));
      }
      const vaiEntrada = !(st && st.ultimo && st.ultimo.tipo === 'entrada');
      corpoModo = `
        <div class="secao" style="max-width:460px;">
          <label class="campo"><span>Pessoa</span>
            <select id="pt-pessoa"><option value="">— escolha —</option>
              ${[...porCargo.entries()].map(([cargo, ps]) => `<optgroup label="${esc(cargo)}">${ps.map((p) => `<option value="${p.id}" ${p.id === state.pontoPessoaId ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</optgroup>`).join('')}
            </select></label>
          ${sel ? `
            <p class="placeholder">${esc(statusTxt)}</p>
            <label class="campo"><span>PIN de ${esc(sel.nome)}</span><input id="pt-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••" /></label>
            ${state.pontoErroPin ? `<p style="color:var(--perigo);font-weight:600;">${esc(state.pontoErroPin)}</p>` : ''}
            <button class="botao" data-pt="bater-pin" ${bloqueado ? 'disabled' : ''}>${vaiEntrada ? 'Bater entrada' : 'Bater saída'}</button>` : ''}
          ${state.pontoMsg ? `<p class="aviso-livre" style="margin-top:12px;">${esc(state.pontoMsg)}</p>` : ''}
        </div>`;
    } else {
      const meuUltimo = [...state.pontoRegistros].reverse().find((r) => r.pessoaId === state.usuario.pessoaId);
      const proximo = meuUltimo?.tipo === 'entrada' ? 'saída' : 'entrada';
      corpoModo = `
        <div class="secao" style="max-width:460px;">
          <p>Seu próximo registro será: <strong>${proximo}</strong></p>
          <button class="botao" data-pt="bater-meu" ${bloqueado ? 'disabled' : ''}>Bater ponto (${proximo})</button>
          ${state.pontoMsg ? `<p class="aviso-livre" style="margin-top:12px;">${esc(state.pontoMsg)}</p>` : ''}
        </div>`;
    }

    const hoje = state.pontoHoje.map((p) => `
      <div class="linha-item"><div><div class="nome">${esc(p.pessoaNome)}</div>
        <div class="desc">${p.tipo === 'entrada' ? 'Trabalhando desde' : 'Última saída às'} ${esc(horaDoIso(p.registradoEm))}${p.corrigidoPor ? ' · corrigido' : ''}${p.origem === 'quiosque' ? ' · pelo quiosque' : ''}</div></div>
        ${ehAdmin ? `<div class="cabecalho-acoes"><button class="botao botao-sec botao-pq" data-pt="corrigir" data-id="${p.id}" title="Corrigir">✎</button><button class="botao botao-perigo botao-pq" data-pt="apagar" data-id="${p.id}" title="Apagar">✕</button></div>` : ''}</div>`).join('')
      || '<div class="vazio"><h3>Ninguém bateu ponto hoje ainda</h3><p>Os registros do dia aparecem aqui.</p></div>';

    const linhas = [...state.pontoRegistros].reverse().map((r) => `
      <tr><td>${esc(r.pessoaNome)}</td><td>${r.tipo === 'entrada' ? 'Entrada' : 'Saída'}</td><td>${esc(new Date(r.registradoEm).toLocaleString('pt-BR'))}${r.corrigidoPor ? ' · corrigido' : ''}</td>
        ${ehAdmin ? `<td><button class="botao-link" data-pt="apagar" data-id="${r.id}">remover</button></td>` : ''}</tr>`).join('')
      || `<tr><td colspan="${ehAdmin ? 4 : 3}" class="placeholder">Nenhum registro nos últimos 30 dias.</td></tr>`;

    return `
      ${cab}
      ${aparelhoHtml()}
      <div class="pilulas-escolha" style="margin:0 0 14px;">${pilula('pin', '🔢 Com o PIN da pessoa')}${pilula('meu', 'Meu ponto')}</div>
      ${corpoModo}
      <h3>Equipe hoje</h3>
      <div class="secao">${hoje}</div>
      <div class="secao">
        <h3>Últimos registros ${ehAdmin ? '(de todo mundo)' : '(seus)'}</h3>
        <div style="overflow-x:auto;"><table class="tabela-lista">
          <thead><tr><th>Pessoa</th><th>Tipo</th><th>Quando</th>${ehAdmin ? '<th></th>' : ''}</tr></thead>
          <tbody>${linhas}</tbody>
        </table></div>
      </div>`;
  }

  async function carregarPonto() {
    state.pontoErro = null;
    try {
      const [registros, dispositivo, pessoas, hoje, aparelhos] = await Promise.all([
        api('/ponto'),
        api('/ponto/dispositivo', { headers: cabAparelho() }),
        api('/ponto/pessoas'),
        api('/ponto/hoje'),
        state.usuario.administrador ? api('/ponto/dispositivos') : Promise.resolve([]),
      ]);
      state.pontoRegistros = registros;
      state.pontoDispositivo = dispositivo;
      state.pontoPessoas = pessoas;
      state.pontoHoje = hoje;
      state.pontoAparelhos = aparelhos;
      if (state.pontoPessoaId && !pessoas.some((p) => p.id === state.pontoPessoaId)) state.pontoPessoaId = null;
    } catch (err) {
      state.pontoErro = err.message;
    }
  }

  async function atualizarPonto() {
    await carregarPonto();
    render();
  }

  async function carregarStatusPonto() {
    state.pontoStatus = null;
    if (!state.pontoPessoaId) return;
    try { state.pontoStatus = await api(`/ponto/status?pessoaId=${state.pontoPessoaId}`); } catch (e) { state.pontoStatus = { ultimo: null }; }
  }

  async function baterPonto(corpo, rotulo) {
    try {
      const r = await api(corpo ? '/ponto/registrar-com-pin' : '/ponto', { method: 'POST', body: corpo || undefined, headers: cabAparelho() });
      state.pontoMsg = `${rotulo || 'Registro'}: ${r.tipo === 'entrada' ? 'entrada' : 'saída'} registrada às ${horaDoIso(r.registradoEm)}.`;
      state.pontoErroPin = null;
      await carregarPonto();
      await carregarStatusPonto();
      render();
    } catch (err) {
      if (corpo) { state.pontoErroPin = err.message; state.pontoMsg = null; render(); } else avisar(err.message);
    }
  }

  function abrirCorrigirPontoModal(p) {
    const local = (iso) => { const d = new Date(iso); const z = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
    const est = { tipo: p.tipo, quando: local(p.registradoEm) };
    abrirModal({
      titulo: 'Corrigir ponto',
      fecharNoFundo: false,
      render: () => `
        <p><strong>${esc(p.pessoaNome)}</strong></p>
        <label class="campo"><span>Tipo</span><select id="cp-tipo"><option value="entrada" ${est.tipo === 'entrada' ? 'selected' : ''}>Entrada</option><option value="saida" ${est.tipo === 'saida' ? 'selected' : ''}>Saída</option></select></label>
        <label class="campo"><span>Data e hora</span><input id="cp-quando" type="datetime-local" value="${esc(est.quando)}" /></label>
        <p class="placeholder">A correção fica marcada como "corrigido" e registra quem fez.</p>
        <div class="acoes-modal"><button class="botao" data-m="salvar">Salvar</button><button class="botao botao-sec" data-m="cancelar">Cancelar</button></div>`,
      onMudou: (c) => { if (c.id === 'cp-tipo') est.tipo = c.value; if (c.id === 'cp-quando') est.quando = c.value; },
      onInput: (c) => { if (c.id === 'cp-quando') est.quando = c.value; },
      onClick: async (el) => {
        if (el.dataset.m === 'cancelar') { fecharModal(); return; }
        if (!est.quando) { avisar('Informe a data e a hora.'); return; }
        try {
          await api(`/ponto/${p.id}`, { method: 'PUT', body: { tipo: est.tipo, registradoEm: new Date(est.quando).toISOString() } });
          fecharModal();
          await atualizarPonto();
        } catch (err) { avisar(err.message); }
      },
    });
  }

  async function acaoPonto(el) {
    const a = el.dataset.pt;
    const id = Number(el.dataset.id);
    try {
      if (a === 'modo') { state.pontoModo = el.dataset.valor; state.pontoMsg = null; state.pontoErroPin = null; render(); return; }
      if (a === 'recarregar') { state.pontoCarregado = false; render(); await carregarPonto(); state.pontoCarregado = true; render(); return; }
      if (a === 'bater-meu') { await baterPonto(null, state.usuario.nome); return; }
      if (a === 'bater-pin') {
        const pin = (document.getElementById('pt-pin') || {}).value || '';
        const sel = state.pontoPessoas.find((p) => p.id === state.pontoPessoaId);
        if (!sel) return;
        if (!/^\d{4}$/.test(pin)) { state.pontoErroPin = 'O PIN tem 4 números.'; render(); return; }
        await baterPonto({ pessoaId: sel.id, pin }, sel.nome);
        return;
      }
      if (a === 'autorizar') {
        const nome = ((document.getElementById('pt-nome-aparelho') || {}).value || '').trim();
        if (!nome) { avisar('Dê um nome para este aparelho (ex.: Recepção).'); return; }
        await api('/ponto/dispositivos', { method: 'POST', body: { nome, token: tokenDoAparelho() } });
        await atualizarPonto();
        return;
      }
      if (a === 'revogar') {
        if (!await confirma('Revogar a autorização desse aparelho? Se for o último, qualquer computador volta a poder bater ponto.', { ok: 'Revogar', perigo: true })) return;
        await api(`/ponto/dispositivos/${id}`, { method: 'DELETE' });
      } else if (a === 'corrigir') {
        const p = state.pontoHoje.find((x) => x.id === id) || state.pontoRegistros.find((x) => x.id === id);
        if (p) abrirCorrigirPontoModal(p);
        return;
      } else if (a === 'apagar') {
        if (!await confirma('Apagar esse registro de ponto?', { ok: 'Apagar', perigo: true })) return;
        await api(`/ponto/${id}`, { method: 'DELETE' });
      }
      await atualizarPonto();
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---------- fluxo de caixa ----------
  function refMesAtual() {
    const hoje = new Date();
    return { ano: hoje.getFullYear(), mes: hoje.getMonth() };
  }

  function limitesMes(ref) {
    const fmt = (d) => dataLocalStr(d);
    return {
      inicio: fmt(new Date(ref.ano, ref.mes, 1)),
      fim: fmt(new Date(ref.ano, ref.mes + 1, 0)),
    };
  }

  function nomeMes(ref) {
    const texto = new Date(ref.ano, ref.mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function formatarMoeda(valor) {
    return `R$ ${Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function cartoesResumoFinanceiro(resumo) {
    const saldo = resumo.totalReceitas - resumo.totalDespesas;
    return `
      <div class="cartoes-resumo">
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Receitas do mês</span>
          <strong class="cartao-resumo-valor cor-receita">${formatarMoeda(resumo.totalReceitas)}</strong>
        </div>
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Despesas do mês</span>
          <strong class="cartao-resumo-valor cor-despesa">${formatarMoeda(resumo.totalDespesas)}</strong>
        </div>
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Saldo do mês</span>
          <strong class="cartao-resumo-valor ${saldo >= 0 ? 'cor-receita' : 'cor-despesa'}">${formatarMoeda(saldo)}</strong>
        </div>
      </div>`;
  }

  function graficoCategorias(lista, classeCor) {
    if (!lista.length) return '<p class="placeholder">Nenhum lançamento com categoria no período.</p>';
    const max = Math.max(...lista.map((l) => l.total));
    return `
      <div class="grafico-categorias">
        ${lista.map((l) => `
          <div class="linha-categoria">
            <span class="categoria-nome" title="${esc(l.categoria)}">${esc(l.categoria)}</span>
            <div class="categoria-barra-trilho">
              <div class="categoria-barra ${classeCor}" style="width:${max ? (l.total / max * 100) : 0}%"></div>
            </div>
            <span class="categoria-valor">${formatarMoeda(l.total)}</span>
          </div>`).join('')}
      </div>`;
  }

  function nomeMesCurto(chaveAnoMes) {
    const [ano, mes] = chaveAnoMes.split('-').map(Number);
    return new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  }

  function graficoTendencia(tendencia) {
    const max = Math.max(1, ...tendencia.map((t) => Math.max(t.receitas, t.despesas)));
    return `
      <div class="grafico-tendencia">
        ${tendencia.map((t) => `
          <div class="coluna-mes">
            <div class="duas-barras">
              <div class="barra-tendencia cor-receita-bg" style="height:${(t.receitas / max * 100).toFixed(1)}%" title="Receitas em ${esc(nomeMesCurto(t.mes))}: ${formatarMoeda(t.receitas)}"></div>
              <div class="barra-tendencia cor-despesa-bg" style="height:${(t.despesas / max * 100).toFixed(1)}%" title="Despesas em ${esc(nomeMesCurto(t.mes))}: ${formatarMoeda(t.despesas)}"></div>
            </div>
            <span class="mes-label">${esc(nomeMesCurto(t.mes))}</span>
          </div>`).join('')}
      </div>
      <div class="legenda-tendencia">
        <span><i class="legenda-cor cor-receita-bg"></i>Receitas</span>

  // ---------- tarefas ----------
  const ETAPAS_TAREFA = [
