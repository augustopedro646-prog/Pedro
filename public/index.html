<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATPN — Gestão</title>
<style>
  /* Paleta baseada na marca da ATPN (círculo verde/dourado, "Clube Social"):
     verde principal e dourado de apoio. Nunca cor hardcoded num componente,
     sempre var(--token) — troca de tema (claro/escuro) mexe só aqui. */
  :root {
    color-scheme: light;
    --fundo: #f3f6f3;
    --superficie: #ffffff;
    --borda: #dde6de;
    --texto: #1b241d;
    --texto-fraco: #5f6f62;
    --primaria: #1f7a3f;
    --primaria-texto: #ffffff;
    --dourado: #c99a12;
    --perigo: #b3413a;
    --sidebar-bg: #112a1b;
    --sidebar-text: #d3e6d8;
    --sidebar-active-bg: #1f7a3f;
    --sidebar-active-text: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fundo: #10140f;
      --superficie: #182019;
      --borda: #27342a;
      --texto: #e8efe9;
      --texto-fraco: #9fb0a4;
      --primaria: #3fae6a;
      --primaria-texto: #0a160d;
      --dourado: #e8c04a;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fundo: #10140f;
    --superficie: #182019;
    --borda: #27342a;
    --texto: #e8efe9;
    --texto-fraco: #9fb0a4;
    --primaria: #3fae6a;
    --primaria-texto: #0a160d;
    --dourado: #e8c04a;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fundo);
    color: var(--texto);
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- Login ---------- */
  .tela-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cartao-login {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-top: 4px solid var(--dourado);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    width: 100%;
    max-width: 360px;
  }
  .marca-login { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 18px; }
  .marca-login svg { margin-bottom: 10px; }
  .cartao-login h1 { font-size: 1.3rem; letter-spacing: .06em; margin: 0; color: var(--primaria); }
  .cartao-login .sub { color: var(--texto-fraco); font-size: .82rem; margin: 2px 0 0; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: .8rem; color: var(--texto-fraco); margin-bottom: 4px; }
  .campo select, .campo input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    background: var(--fundo);
    color: var(--texto);
  }
  .pin-display { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
  .pin-display span { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--texto-fraco); }
  .pin-display span.preenchido { background: var(--primaria); border-color: var(--primaria); }
  .teclado-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .teclado-pin button {
    padding: 14px 0; border-radius: 8px; border: 1px solid var(--borda);
    background: var(--superficie); cursor: pointer; font-size: 1.1rem;
  }
  .teclado-pin button:active { background: var(--fundo); }
  .erro-login { color: var(--perigo); font-size: .85rem; min-height: 1.2em; margin-top: 8px; text-align: center; }

  /* ---------- Sidebar / shell (mesmo padrão do PDV Jabá) ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 230px;
    background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; transition: transform .2s ease; overflow-y: auto;
    z-index: 10;
  }
  .sidebar.colapsada { transform: translateX(-100%); }
  .main-content { margin-left: 230px; transition: margin-left .2s ease; min-height: 100vh; }
  .main-content.sidebar-colapsada { margin-left: 0; }

  .sidebar .marca { padding: 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .sidebar .marca strong { display: block; }
  .sidebar .marca span { color: var(--sidebar-text); opacity: .7; font-size: .8rem; }
  .sidebar .marca button {
    margin-top: 10px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    background: transparent; color: var(--sidebar-text); cursor: pointer; font-size: .8rem;
  }

  nav.tabs { display: flex; flex-direction: column; gap: 2px; padding: .75rem; flex: 1; overflow-y: auto; }
  nav.tabs button {
    position: relative; display: flex; align-items: center; text-align: left;
    padding: 10px 12px; border-radius: 8px; border: none; background: transparent;
    color: var(--sidebar-text); cursor: pointer; font-size: .92rem;
  }
  nav.tabs button.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); }
  nav.tabs button:not(.active):hover { background: rgba(255,255,255,.08); }
  .tab-badge {
    margin-left: auto; background: var(--perigo); color: #fff; border-radius: 999px;
    font-size: .7rem; padding: 1px 7px; min-width: 18px; text-align: center;
  }

  .user-chip { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: .85rem; }
  .user-chip button {
    margin-top: 8px; background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: .8rem;
  }

  .abrir-sidebar-btn {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--borda); background: var(--superficie);
    box-shadow: var(--shadow); cursor: pointer; font-size: 1.1rem;
  }
  .sidebar-backdrop { display: none; }

  @media (max-width: 820px) {
    .sidebar { width: 78vw; max-width: 280px; box-shadow: 2px 0 16px rgba(0,0,0,.35); }
    .main-content { margin-left: 0 !important; }
    .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9; }
  }

  .conteudo { padding: 28px; }
  .conteudo h2 { margin-top: 0; }
  .placeholder { color: var(--texto-fraco); }

  /* ---------- Configurações ---------- */
  .secao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
  .secao h3 { margin-top: 0; }
  .linha-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .linha-form input, .linha-form select {
    flex: 1 1 160px; min-width: 120px; padding: 8px 10px; border: 1px solid var(--borda);
    border-radius: 6px; background: var(--fundo); color: var(--texto);
  }
  .botao { background: var(--primaria); color: var(--primaria-texto); border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  table.permissoes { border-collapse: collapse; width: 100%; }
  table.permissoes th, table.permissoes td { border: 1px solid var(--borda); padding: 8px 10px; text-align: center; font-size: .85rem; }
  table.permissoes th:first-child, table.permissoes td:first-child { text-align: left; }

  /* ---------- Bater ponto / Fluxo de caixa ---------- */
  table.tabela-lista { border-collapse: collapse; width: 100%; font-size: .88rem; }
  table.tabela-lista th, table.tabela-lista td { border-bottom: 1px solid var(--borda); padding: 8px 10px; text-align: left; }
  table.tabela-lista th { color: var(--texto-fraco); font-weight: 600; }
  .botao-link { background: none; border: none; color: var(--perigo); cursor: pointer; padding: 0; font-size: .82rem; text-decoration: underline; }
  .abas-secundarias { display: flex; gap: 6px; margin-bottom: 14px; }
  .abas-secundarias button { padding: 6px 14px; border: 1px solid var(--borda); background: var(--fundo); border-radius: 999px; cursor: pointer; font-size: .85rem; }
  .abas-secundarias button.ativa { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); }
  .navegacao-mes { display: flex; align-items: center; gap: 12px; }

  /* ---------- Cartões/gráficos do Fluxo de caixa ---------- */
  .cor-receita { color: var(--primaria); }
  .cor-despesa { color: var(--perigo); }
  .cor-receita-bg { background: var(--primaria); }
  .cor-despesa-bg { background: var(--perigo); }

  .cartoes-resumo { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .cartao-resumo { flex: 1 1 170px; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .cartao-resumo-label { display: block; color: var(--texto-fraco); font-size: .8rem; margin-bottom: 6px; }
  .cartao-resumo-valor { font-size: 1.4rem; }

  .graficos-lado-a-lado { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .graficos-lado-a-lado { grid-template-columns: 1fr; } }

  .grafico-categorias { display: flex; flex-direction: column; gap: 10px; }
  .linha-categoria { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .categoria-nome { flex: 0 0 38%; color: var(--texto-fraco); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .categoria-barra-trilho { flex: 1; background: var(--fundo); border-radius: 6px; height: 14px; overflow: hidden; }
  .categoria-barra { height: 100%; border-radius: 6px; }
  .categoria-valor { flex: 0 0 auto; text-align: right; white-space: nowrap; }

  .grafico-tendencia { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding: 10px 4px 0; overflow-x: auto; }
  .coluna-mes { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 28px; height: 100%; justify-content: flex-end; }
  .duas-barras { display: flex; align-items: flex-end; gap: 4px; height: 100%; width: 100%; justify-content: center; }
  .barra-tendencia { width: 14px; min-height: 2px; border-radius: 3px 3px 0 0; }
  .mes-label { margin-top: 6px; font-size: .75rem; color: var(--texto-fraco); text-transform: capitalize; }
  .legenda-tendencia { display: flex; gap: 16px; margin-top: 10px; font-size: .8rem; color: var(--texto-fraco); }
  .legenda-cor { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  /* ---------- Tarefas ---------- */
  .lista-tarefas { display: flex; flex-direction: column; gap: 10px; }
  .item-tarefa { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; cursor: pointer; }
  .item-tarefa input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; flex: none; }
  .item-tarefa.concluida { opacity: .6; }
  .item-tarefa.concluida .item-tarefa-titulo { text-decoration: line-through; }
  .item-tarefa-titulo { font-weight: 600; }
  .item-tarefa-descricao { color: var(--texto-fraco); font-size: .85rem; margin-top: 2px; }
  .item-tarefa-cargo { color: var(--texto-fraco); font-size: .78rem; margin-top: 4px; }
  .dias-semana-tarefa { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .dias-semana-tarefa label { display: flex; align-items: center; gap: 4px; font-size: .85rem; }

  /* ---------- Rodapé da sidebar: tema, atualizar ---------- */
  .rodape-sidebar { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 6px; }
  .rodape-sidebar button {
    background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text);
    border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: .82rem; text-align: left;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
  // ---------- Estado global (SPA "na mão", sem framework/build step) ----------
  const API_BASE = '/api';

  const state = {
    token: localStorage.getItem('token') || null,
    usuario: null,        // {pessoaId, nome, cargoId, cargoNome, administrador}

    // tela de login
    cargos: [],
    pessoasDoCargo: [],
    cargoSelecionado: null,
    pessoaSelecionada: null,
    pin: '',
    erroLogin: '',

    // shell
    sidebarColapsada: localStorage.getItem('sidebarColapsada') === '1',
    abas: [],
    abaAtual: null,

    // tema (claro/escuro): preferência salva neste aparelho. Sem escolha
    // salva, o CSS já reage sozinho a prefers-color-scheme (não força nada).
    tema: localStorage.getItem('tema'),

    // configurações
    configCarregado: false,
    configCargos: [],
    configAbas: [],
    configMatriz: [],

    // bater ponto
    pontoCarregado: false,
    pontoRegistros: [],

    // fluxo de caixa
    financeiroCarregado: false,
    financeiroMesRef: null, // {ano, mes(0-indexado)}
    financeiroAba: 'despesas', // ou 'receitas'
    financeiroDespesas: [],
    financeiroReceitas: [],
    financeiroResumo: null,

    // tarefas
    tarefasCarregado: false,
    tarefasData: null, // 'YYYY-MM-DD', padrão: hoje
    tarefasLista: [],
    tarefasCadastroCarregado: false,
    tarefasCadastro: [],
    novaTarefaFrequencia: 'diaria',

    // calendário (agenda compartilhada com o PDV Jabá)
    calendarioCarregado: false,
    calendarioConfigurado: true,
    calendarioMesRef: null,
    calendarioEventos: [],
  };

  // Aplica o tema salvo antes do primeiro render (senão a tela nasce no
  // tema errado e pisca ao corrigir). Sem escolha salva, não toca no
  // atributo — o CSS cuida da preferência do sistema por conta própria.
  if (state.tema) document.documentElement.setAttribute('data-theme', state.tema);

  const FORMAS_PAGAMENTO = ['Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Pix', 'Boleto', 'Transferência'];

  // Escapa texto livre digitado por qualquer pessoa antes de ir pro
  // innerHTML. Sem isso é XSS armazenado — usar em TODO dado de usuário.
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Padrão de campo numérico: nunca <input type="number"> puro (apaga
  // "10," e depende do locale do navegador) — type="text" inputmode="decimal" + parser.
  function parseNumero(texto) {
    const limpo = String(texto ?? '').trim().replace(/\./g, '').replace(',', '.');
    const n = parseFloat(limpo);
    return Number.isFinite(n) ? n : 0;
  }

  async function api(caminho, opts = {}) {
    const resp = await fetch(API_BASE + caminho, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
        ...(opts.headers || {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const dado = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(dado.erro || 'Erro na requisição');
    return dado;
  }

  function ehMobile() { return window.matchMedia('(max-width: 820px)').matches; }
  function badgeDaAba(_id) { return 0; } // pendências por aba entram quando as telas de negócio existirem

  // ---------- render ----------
  function render() {
    document.getElementById('app').innerHTML = state.usuario ? viewApp() : viewLogin();
    attachEvents();
  }

  // Marca da ATPN: círculo verde/dourado em dois tons (inspirado no logo
  // real — sem o arquivo oficial ainda; se o Pedro mandar o PNG/SVG da
  // associação, trocamos isso por ele direto).
  function marcaAtpnSvg(tamanho) {
    return `
      <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="49" fill="var(--primaria)"/>
        <path d="M50,1 A49,49 0 0,1 50,99 A24.5,24.5 0 0,1 50,50 A24.5,24.5 0 0,0 50,1 Z" fill="var(--dourado)"/>
        <circle cx="50" cy="25.5" r="6" fill="var(--primaria)"/>
        <circle cx="50" cy="74.5" r="6" fill="var(--dourado)"/>
      </svg>`;
  }

  function viewLogin() {
    return `
      <div class="tela-login">
        <div class="cartao-login">
          <div class="marca-login">
            ${marcaAtpnSvg(56)}
            <h1>ATPN</h1>
            <p class="sub">Clube Social — Natal/RN</p>
          </div>

          <div class="campo">
            <label for="sel-cargo">Cargo / Função</label>
            <select id="sel-cargo" data-action="mudar-cargo">
              ${state.cargos.map((c) => `<option value="${c.id}" ${c.id === state.cargoSelecionado ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="campo">
            <label for="sel-pessoa">Pessoa</label>
            <select id="sel-pessoa" data-action="mudar-pessoa">
              ${state.pessoasDoCargo.map((p) => `<option value="${p.id}" ${p.id === state.pessoaSelecionada ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}
            </select>
          </div>

          <div class="pin-display">
            ${[0, 1, 2, 3].map((i) => `<span class="${i < state.pin.length ? 'preenchido' : ''}"></span>`).join('')}
          </div>
          <div class="teclado-pin">
            ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((n) => `<button data-tecla="${n}">${n}</button>`).join('')}
            <button data-tecla="clear">C</button>
            <button data-tecla="0">0</button>
            <button data-tecla="back">⌫</button>
          </div>
          <p class="erro-login">${esc(state.erroLogin)}</p>
        </div>
      </div>`;
  }

  // Tema em efeito agora: o explícito salvo, ou (sem escolha salva) o que
  // o sistema operacional está usando.
  function temaEscuroAgora() {
    const explicito = document.documentElement.getAttribute('data-theme');
    if (explicito) return explicito === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function sidebarHtml() {
    const itens = [...state.abas];
    if (state.usuario.administrador) itens.push({ id: 'config', nome: 'Configurações' });

    const nav = itens.map((a) => {
      const n = badgeDaAba(a.id);
      return `<button data-nav="${a.id}" class="${state.abaAtual === a.id ? 'active' : ''}">
        ${esc(a.nome)}${n > 0 ? `<span class="tab-badge">${n > 99 ? '99+' : n}</span>` : ''}
      </button>`;
    }).join('');

    return `
      <aside class="sidebar ${state.sidebarColapsada ? 'colapsada' : ''}">
        <div class="marca">
          <strong>ATPN</strong>
          <span>Clube Social</span>
          <button data-action="toggle-sidebar">« Esconder</button>
        </div>
        <nav class="tabs">${nav}</nav>
        <div class="rodape-sidebar">
          <button data-action="atualizar">↻ Atualizar</button>
          <button data-action="toggle-tema">${temaEscuroAgora() ? '☀️ Modo claro' : '🌙 Modo escuro'}</button>
        </div>
        <div class="user-chip">
          <div>${esc(state.usuario.nome)}</div>
          <div style="opacity:.7">${esc(state.usuario.cargoNome)}</div>
          <button data-action="sair">Sair</button>
        </div>
      </aside>
      ${state.sidebarColapsada
        ? `<button class="abrir-sidebar-btn" data-action="toggle-sidebar">☰</button>`
        : `<div class="sidebar-backdrop" data-action="toggle-sidebar"></div>`}`;
  }

  function viewApp() {
    return `
      ${sidebarHtml()}
      <div class="main-content ${state.sidebarColapsada ? 'sidebar-colapsada' : ''}">
        <div class="conteudo">${viewConteudo()}</div>
      </div>`;
  }

  function viewConteudo() {
    if (state.abaAtual === 'config') return viewConfiguracoes();
    if (state.abaAtual === 'ponto') return viewPonto();
    if (state.abaAtual === 'fluxo_caixa') return viewFluxoCaixa();
    if (state.abaAtual === 'tarefas') return viewTarefas();
    if (state.abaAtual === 'calendario') return viewCalendario();
    const nomeAba = (state.abas.find((a) => a.id === state.abaAtual) || {}).nome || '';
    return `
      <h2>${esc(nomeAba)}</h2>
      <p class="placeholder">Tela ainda não desenhada — depende do que o Pedro trouxer da visita à associação.</p>`;
  }

  // ---------- bater ponto ----------
  function viewPonto() {
    if (!state.pontoCarregado) return '<h2>Bater ponto</h2><p class="placeholder">Carregando…</p>';

    const meuUltimo = [...state.pontoRegistros].reverse().find((r) => r.pessoaId === state.usuario.pessoaId);
    const proximoTipo = meuUltimo?.tipo === 'entrada' ? 'saída' : 'entrada';

    const linhas = [...state.pontoRegistros].reverse().map((r) => `
      <tr>
        <td>${esc(r.pessoaNome)}</td>
        <td>${r.tipo === 'entrada' ? 'Entrada' : 'Saída'}</td>
        <td>${new Date(r.registradoEm).toLocaleString('pt-BR')}</td>
        ${state.usuario.administrador ? `<td><button class="botao-link" data-action="remover-ponto" data-id="${r.id}">remover</button></td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${state.usuario.administrador ? 4 : 3}" class="placeholder">Nenhum registro nos últimos 30 dias.</td></tr>`;

    return `
      <h2>Bater ponto</h2>
      <div class="secao">
        <p>Seu próximo registro será: <strong>${proximoTipo}</strong></p>
        <button class="botao" data-action="bater-ponto">Bater ponto (${proximoTipo})</button>
      </div>
      <div class="secao">
        <h3>Últimos registros ${state.usuario.administrador ? '(de todo mundo)' : '(seus)'}</h3>
        <table class="tabela-lista">
          <thead><tr><th>Pessoa</th><th>Tipo</th><th>Quando</th>${state.usuario.administrador ? '<th></th>' : ''}</tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }

  // ---------- fluxo de caixa ----------
  function refMesAtual() {
    const hoje = new Date();
    return { ano: hoje.getFullYear(), mes: hoje.getMonth() };
  }

  function limitesMes(ref) {
    const fmt = (d) => d.toISOString().slice(0, 10);
    return {
      inicio: fmt(new Date(ref.ano, ref.mes, 1)),
      fim: fmt(new Date(ref.ano, ref.mes + 1, 0)),
    };
  }

  function nomeMes(ref) {
    const texto = new Date(ref.ano, ref.mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function formatarMoeda(valor) {
    return `R$ ${Number(valor).toFixed(2).replace('.', ',')}`;
  }

  function cartoesResumoFinanceiro(resumo) {
    const saldo = resumo.totalReceitas - resumo.totalDespesas;
    return `
      <div class="cartoes-resumo">
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Receitas do mês</span>
          <strong class="cartao-resumo-valor cor-receita">${formatarMoeda(resumo.totalReceitas)}</strong>
        </div>
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Despesas do mês</span>
          <strong class="cartao-resumo-valor cor-despesa">${formatarMoeda(resumo.totalDespesas)}</strong>
        </div>
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Saldo do mês</span>
          <strong class="cartao-resumo-valor ${saldo >= 0 ? 'cor-receita' : 'cor-despesa'}">${formatarMoeda(saldo)}</strong>
        </div>
      </div>`;
  }

  function graficoCategorias(lista, classeCor) {
    if (!lista.length) return '<p class="placeholder">Nenhum lançamento com categoria no período.</p>';
    const max = Math.max(...lista.map((l) => l.total));
    return `
      <div class="grafico-categorias">
        ${lista.map((l) => `
          <div class="linha-categoria">
            <span class="categoria-nome" title="${esc(l.categoria)}">${esc(l.categoria)}</span>
            <div class="categoria-barra-trilho">
              <div class="categoria-barra ${classeCor}" style="width:${max ? (l.total / max * 100) : 0}%"></div>
            </div>
            <span class="categoria-valor">${formatarMoeda(l.total)}</span>
          </div>`).join('')}
      </div>`;
  }

  function nomeMesCurto(chaveAnoMes) {
    const [ano, mes] = chaveAnoMes.split('-').map(Number);
    return new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  }

  function graficoTendencia(tendencia) {
    const max = Math.max(1, ...tendencia.map((t) => Math.max(t.receitas, t.despesas)));
    return `
      <div class="grafico-tendencia">
        ${tendencia.map((t) => `
          <div class="coluna-mes">
            <div class="duas-barras">
              <div class="barra-tendencia cor-receita-bg" style="height:${(t.receitas / max * 100).toFixed(1)}%" title="Receitas em ${esc(nomeMesCurto(t.mes))}: ${formatarMoeda(t.receitas)}"></div>
              <div class="barra-tendencia cor-despesa-bg" style="height:${(t.despesas / max * 100).toFixed(1)}%" title="Despesas em ${esc(nomeMesCurto(t.mes))}: ${formatarMoeda(t.despesas)}"></div>
            </div>
            <span class="mes-label">${esc(nomeMesCurto(t.mes))}</span>
          </div>`).join('')}
      </div>
      <div class="legenda-tendencia">
        <span><i class="legenda-cor cor-receita-bg"></i>Receitas</span>
        <span><i class="legenda-cor cor-despesa-bg"></i>Despesas</span>
      </div>`;
  }

  function viewFluxoCaixa() {
    if (!state.financeiroCarregado) return '<h2>Fluxo de caixa</h2><p class="placeholder">Carregando…</p>';

    const resumo = state.financeiroResumo;
    const lista = state.financeiroAba === 'despesas' ? state.financeiroDespesas : state.financeiroReceitas;
    const total = lista.reduce((soma, l) => soma + Number(l.valor), 0);

    const linhas = lista.map((l) => `
      <tr>
        <td>${esc(l.data.split('-').reverse().join('/'))}</td>
        <td>${esc(l.descricao)}</td>
        <td>${esc(l.categoria || '—')}</td>
        <td>${esc(l.formaPagamento || '—')}</td>
        <td>${formatarMoeda(l.valor)}</td>
        <td><button class="botao-link" data-action="remover-lancamento" data-id="${l.id}">remover</button></td>
      </tr>`).join('') || `<tr><td colspan="6" class="placeholder">Nenhum lançamento no mês.</td></tr>`;

    return `
      <h2>Fluxo de caixa</h2>
      <div class="secao">
        <div class="navegacao-mes">
          <button class="botao" data-action="mes-anterior">‹</button>
          <strong>${nomeMes(state.financeiroMesRef)}</strong>
          <button class="botao" data-action="mes-seguinte">›</button>
        </div>
      </div>

      ${cartoesResumoFinanceiro(resumo)}

      <div class="secao">
        <h3>Tendência (últimos 6 meses)</h3>
        ${graficoTendencia(resumo.tendencia)}
      </div>

      <div class="graficos-lado-a-lado">
        <div class="secao">
          <h3>Despesas por categoria</h3>
          ${graficoCategorias(resumo.categoriasDespesas, 'cor-despesa-bg')}
        </div>
        <div class="secao">
          <h3>Receitas por categoria</h3>
          ${graficoCategorias(resumo.categoriasReceitas, 'cor-receita-bg')}
        </div>
      </div>

      <div class="secao">
        <h3>Lançamentos</h3>
        <div class="abas-secundarias">
          <button class="${state.financeiroAba === 'despesas' ? 'ativa' : ''}" data-action="financeiro-aba" data-aba="despesas">Despesas</button>
          <button class="${state.financeiroAba === 'receitas' ? 'ativa' : ''}" data-action="financeiro-aba" data-aba="receitas">Receitas</button>
        </div>
        <table class="tabela-lista">
          <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma de pagamento</th><th>Valor</th><th></th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
        <p><strong>Total: ${formatarMoeda(total)}</strong></p>
        <div class="linha-form">
          <input type="date" id="novo-lancamento-data" value="${new Date().toISOString().slice(0, 10)}" />
          <input type="text" id="novo-lancamento-descricao" placeholder="Descrição" />
          <input type="text" id="novo-lancamento-categoria" placeholder="Categoria (opcional)" />
          <select id="novo-lancamento-forma">
            <option value="">Forma de pagamento…</option>
            ${FORMAS_PAGAMENTO.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join('')}
          </select>
          <input type="text" inputmode="decimal" id="novo-lancamento-valor" placeholder="Valor" />
          <button class="botao" data-action="add-lancamento">Adicionar</button>
        </div>
      </div>`;
  }

  // ---------- tarefas ----------
  const ETAPAS_TAREFA = [
    { id: 'abertura', nome: 'Abertura' },
    { id: 'durante_dia', nome: 'Durante o dia' },
    { id: 'fechamento', nome: 'Fechamento' },
  ];
  const DIAS_SEMANA_NOMES = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function hojeStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatarDataExibicao(dataStr) {
    return dataStr.split('-').reverse().join('/');
  }

  function descricaoFrequenciaTarefa(t) {
    if (t.frequencia === 'diaria') return 'Todo dia';
    if (t.frequencia === 'dias_semana') return (t.diasSemana || []).map((d) => DIAS_SEMANA_NOMES[d]).join(', ');
    if (t.frequencia === 'intervalo') return `A cada ${t.intervaloDias} dias`;
    return '';
  }

  function viewCadastroTarefas() {
    if (!state.tarefasCadastroCarregado) return '<div class="secao"><h3>Cadastro de tarefas</h3><p class="placeholder">Carregando…</p></div>';

    const linhas = state.tarefasCadastro.map((t) => `
      <tr>
        <td>${esc(t.titulo)}${t.ativo ? '' : ' <span class="placeholder">(inativa)</span>'}</td>
        <td>${esc(t.cargoNome)}</td>
        <td>${esc(ETAPAS_TAREFA.find((e) => e.id === t.etapa)?.nome || t.etapa)}</td>
        <td>${esc(descricaoFrequenciaTarefa(t))}</td>
        <td><button class="botao-link" data-action="remover-tarefa" data-id="${t.id}">remover</button></td>
      </tr>`).join('') || `<tr><td colspan="5" class="placeholder">Nenhuma tarefa cadastrada.</td></tr>`;

    return `
      <div class="secao">
        <h3>Cadastro de tarefas</h3>
        <table class="tabela-lista">
          <thead><tr><th>Título</th><th>Cargo</th><th>Etapa</th><th>Frequência</th><th></th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>

        <h3 style="margin-top:20px;">Nova tarefa</h3>
        <div class="linha-form">
          <input type="text" id="nova-tarefa-titulo" placeholder="Título" />
          <input type="text" id="nova-tarefa-descricao" placeholder="Descrição (opcional)" />
        </div>
        <div class="linha-form">
          <select id="nova-tarefa-cargo">
            ${state.configCargos.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}
          </select>
          <select id="nova-tarefa-etapa">
            ${ETAPAS_TAREFA.map((e) => `<option value="${e.id}">${esc(e.nome)}</option>`).join('')}
          </select>
          <select id="nova-tarefa-frequencia" data-action="mudar-frequencia-tarefa">
            <option value="diaria" ${state.novaTarefaFrequencia === 'diaria' ? 'selected' : ''}>Todo dia</option>
            <option value="dias_semana" ${state.novaTarefaFrequencia === 'dias_semana' ? 'selected' : ''}>Dias da semana</option>
            <option value="intervalo" ${state.novaTarefaFrequencia === 'intervalo' ? 'selected' : ''}>A cada N dias</option>
          </select>
        </div>
        <div class="dias-semana-tarefa" id="campo-dias-semana" style="${state.novaTarefaFrequencia === 'dias_semana' ? '' : 'display:none;'}">
          ${DIAS_SEMANA_NOMES.map((nome, i) => `
            <label><input type="checkbox" class="dia-semana-tarefa" value="${i}"> ${esc(nome)}</label>`).join('')}
        </div>
        <div class="linha-form" id="campo-intervalo" style="${state.novaTarefaFrequencia === 'intervalo' ? '' : 'display:none;'}">
          <input type="text" inputmode="numeric" id="nova-tarefa-intervalo" placeholder="A cada quantos dias" />
        </div>
        <div class="linha-form">
          <button class="botao" data-action="add-tarefa">Adicionar tarefa</button>
        </div>
      </div>`;
  }

  function viewTarefas() {
    if (!state.tarefasCarregado) return '<h2>Tarefas</h2><p class="placeholder">Carregando…</p>';

    const listaEtapa = (etapaId, nome) => {
      const itens = state.tarefasLista.filter((t) => t.etapa === etapaId);
      if (!itens.length) return '';
      return `
        <div class="secao">
          <h3>${esc(nome)}</h3>
          <div class="lista-tarefas">
            ${itens.map((t) => `
              <label class="item-tarefa ${t.concluida ? 'concluida' : ''}">
                <input type="checkbox" data-action="toggle-tarefa" data-id="${t.id}" ${t.concluida ? 'checked' : ''}>
                <div>
                  <div class="item-tarefa-titulo">${esc(t.titulo)}</div>
                  ${t.descricao ? `<div class="item-tarefa-descricao">${esc(t.descricao)}</div>` : ''}
                  ${state.usuario.administrador ? `<div class="item-tarefa-cargo">${esc(t.cargoNome)}</div>` : ''}
                </div>
              </label>`).join('')}
          </div>
        </div>`;
    };

    return `
      <h2>Tarefas</h2>
      <div class="secao">
        <div class="navegacao-mes">
          <button class="botao" data-action="tarefa-dia-anterior">‹</button>
          <strong>${esc(formatarDataExibicao(state.tarefasData))}${state.tarefasData === hojeStr() ? ' (hoje)' : ''}</strong>
          <button class="botao" data-action="tarefa-dia-seguinte">›</button>
        </div>
      </div>

      ${!state.tarefasLista.length ? '<p class="placeholder">Nenhuma tarefa pro seu cargo nesse dia.</p>' : ''}
      ${ETAPAS_TAREFA.map((e) => listaEtapa(e.id, e.nome)).join('')}

      ${state.usuario.administrador ? viewCadastroTarefas() : ''}`;
  }

  // ---------- calendário (agenda compartilhada com o PDV Jabá) ----------
  function viewCalendario() {
    if (!state.calendarioCarregado) return '<h2>Calendário</h2><p class="placeholder">Carregando…</p>';

    if (!state.calendarioConfigurado) {
      return `
        <h2>Calendário</h2>
        <div class="secao">
          <p class="placeholder">A integração com o PDV Jabá ainda não foi configurada nesse servidor
          (falta rodar <code>scripts/configurar-integracao-jaba.js</code> uma vez e preencher
          <code>JABA_DATABASE_URL</code>/<code>JABA_LOJA_ID</code> no <code>.env</code>). Sem isso essa
          aba não tem onde guardar os eventos — reservas e eventos são a mesma agenda do PDV Jabá.</p>
        </div>`;
    }

    const linhas = state.calendarioEventos.map((e) => `
      <tr>
        <td>${esc(e.data.split('-').reverse().join('/'))}</td>
        <td>${e.horaInicio ? esc(e.horaInicio) + (e.horaFim ? '–' + esc(e.horaFim) : '') : '—'}</td>
        <td>${e.tipo === 'escala' ? 'Escala' : 'Evento'}</td>
        <td>${esc(e.titulo)}${e.usuarioNome ? ` <span class="placeholder">(${esc(e.usuarioNome)})</span>` : ''}</td>
        <td>${esc(e.observacao || '—')}</td>
        ${state.usuario.administrador ? `<td><button class="botao-link" data-action="remover-evento" data-id="${e.id}">remover</button></td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${state.usuario.administrador ? 6 : 5}" class="placeholder">Nenhum evento no mês.</td></tr>`;

    return `
      <h2>Calendário</h2>
      <div class="secao">
        <div class="navegacao-mes">
          <button class="botao" data-action="calendario-mes-anterior">‹</button>
          <strong>${nomeMes(state.calendarioMesRef)}</strong>
          <button class="botao" data-action="calendario-mes-seguinte">›</button>
        </div>
      </div>
      <div class="secao">
        <table class="tabela-lista">
          <thead><tr><th>Data</th><th>Horário</th><th>Tipo</th><th>Título</th><th>Observação</th>${state.usuario.administrador ? '<th></th>' : ''}</tr></thead>
          <tbody>${linhas}</tbody>
        </table>
        ${state.usuario.administrador ? `
          <div class="linha-form">
            <input type="date" id="novo-evento-data" value="${new Date().toISOString().slice(0, 10)}" />
            <input type="text" id="novo-evento-hora-inicio" placeholder="Hora início (opcional)" />
            <input type="text" id="novo-evento-hora-fim" placeholder="Hora fim (opcional)" />
            <select id="novo-evento-tipo">
              <option value="evento">Evento</option>
              <option value="escala">Escala</option>
            </select>
          </div>
          <div class="linha-form">
            <input type="text" id="novo-evento-titulo" placeholder="Título" />
            <input type="text" id="novo-evento-observacao" placeholder="Observação (opcional)" />
            <button class="botao" data-action="add-evento">Adicionar</button>
          </div>` : ''}
      </div>`;
  }

  function viewConfiguracoes() {
    if (!state.configCarregado) return '<h2>Configurações</h2><p class="placeholder">Carregando…</p>';

    const linhasCargos = state.configCargos.map((c) => `<div>${esc(c.nome)}${c.administrador ? ' (irrestrito)' : ''}</div>`).join('');

    const tabelaPermissoes = `
      <table class="permissoes">
        <thead><tr><th>Cargo</th>${state.configAbas.map((a) => `<th>${esc(a.nome)}</th>`).join('')}</tr></thead>
        <tbody>
          ${state.configMatriz.map((linha) => `
            <tr data-cargo="${linha.cargoId}">
              <td>${esc(linha.cargoNome)}</td>
              ${linha.abas.map((a) => `
                <td><input type="checkbox" data-action="toggle-permissao" data-cargo="${linha.cargoId}" data-aba="${a.aba}" ${a.permitido ? 'checked' : ''}></td>
              `).join('')}
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="linha-form"><button class="botao" data-action="salvar-permissoes">Salvar permissões</button></div>`;

    return `
      <h2>Configurações</h2>
      <div class="secao">
        <h3>Cargos</h3>
        <div>${linhasCargos}</div>
        <div class="linha-form">
          <input id="novo-cargo-nome" placeholder="Nome do cargo" />
          <button class="botao" data-action="add-cargo">Adicionar</button>
        </div>
      </div>
      <div class="secao">
        <h3>Permissões por cargo</h3>
        ${tabelaPermissoes}
      </div>`;
  }

  // ---------- eventos (religados depois de cada render, sem duplicar
  // listener porque o innerHTML anterior já foi descartado) ----------
  function attachEvents() {
    document.querySelectorAll('[data-tecla]').forEach((el) => {
      el.addEventListener('click', () => pressLoginKey(el.dataset.tecla));
    });

    const selCargo = document.getElementById('sel-cargo');
    if (selCargo) selCargo.addEventListener('change', (e) => mudarCargo(Number(e.target.value)));

    const selPessoa = document.getElementById('sel-pessoa');
    if (selPessoa) selPessoa.addEventListener('change', (e) => { state.pessoaSelecionada = Number(e.target.value); });

    document.querySelectorAll('[data-nav]').forEach((el) => {
      el.addEventListener('click', () => abrirAba(el.dataset.nav));
    });

    document.querySelectorAll('[data-action="toggle-sidebar"]').forEach((el) => {
      el.addEventListener('click', toggleSidebar);
    });

    const btnSair = document.querySelector('[data-action="sair"]');
    if (btnSair) btnSair.addEventListener('click', sair);

    const btnAtualizar = document.querySelector('[data-action="atualizar"]');
    if (btnAtualizar) btnAtualizar.addEventListener('click', () => window.location.reload());

    const btnToggleTema = document.querySelector('[data-action="toggle-tema"]');
    if (btnToggleTema) btnToggleTema.addEventListener('click', toggleTema);

    const btnAddCargo = document.querySelector('[data-action="add-cargo"]');
    if (btnAddCargo) btnAddCargo.addEventListener('click', adicionarCargo);

    document.querySelectorAll('[data-action="toggle-permissao"]').forEach((el) => {
      el.addEventListener('change', () => {
        const linha = state.configMatriz.find((l) => l.cargoId === Number(el.dataset.cargo));
        const aba = linha?.abas.find((a) => a.aba === el.dataset.aba);
        if (aba) aba.permitido = el.checked;
      });
    });

    const btnSalvarPermissoes = document.querySelector('[data-action="salvar-permissoes"]');
    if (btnSalvarPermissoes) btnSalvarPermissoes.addEventListener('click', salvarPermissoes);

    const btnBaterPonto = document.querySelector('[data-action="bater-ponto"]');
    if (btnBaterPonto) btnBaterPonto.addEventListener('click', baterPonto);

    document.querySelectorAll('[data-action="remover-ponto"]').forEach((el) => {
      el.addEventListener('click', () => removerPonto(Number(el.dataset.id)));
    });

    document.querySelectorAll('[data-action="financeiro-aba"]').forEach((el) => {
      el.addEventListener('click', () => { state.financeiroAba = el.dataset.aba; render(); });
    });

    const btnMesAnterior = document.querySelector('[data-action="mes-anterior"]');
    if (btnMesAnterior) btnMesAnterior.addEventListener('click', () => mudarMesFinanceiro(-1));

    const btnMesSeguinte = document.querySelector('[data-action="mes-seguinte"]');
    if (btnMesSeguinte) btnMesSeguinte.addEventListener('click', () => mudarMesFinanceiro(1));

    const btnAddLancamento = document.querySelector('[data-action="add-lancamento"]');
    if (btnAddLancamento) btnAddLancamento.addEventListener('click', adicionarLancamento);

    document.querySelectorAll('[data-action="remover-lancamento"]').forEach((el) => {
      el.addEventListener('click', () => removerLancamento(Number(el.dataset.id)));
    });

    document.querySelectorAll('[data-action="toggle-tarefa"]').forEach((el) => {
      el.addEventListener('change', () => toggleTarefa(Number(el.dataset.id), el.checked));
    });

    const btnTarefaDiaAnterior = document.querySelector('[data-action="tarefa-dia-anterior"]');
    if (btnTarefaDiaAnterior) btnTarefaDiaAnterior.addEventListener('click', () => mudarDiaTarefas(-1));

    const btnTarefaDiaSeguinte = document.querySelector('[data-action="tarefa-dia-seguinte"]');
    if (btnTarefaDiaSeguinte) btnTarefaDiaSeguinte.addEventListener('click', () => mudarDiaTarefas(1));

    // Não chama render() aqui de propósito: um render inteiro reconstruiria o
    // formulário e apagaria título/descrição/cargo/etapa já preenchidos antes
    // de mexer na frequência — só alterna os dois blocos condicionais.
    const selFrequenciaTarefa = document.getElementById('nova-tarefa-frequencia');
    if (selFrequenciaTarefa) selFrequenciaTarefa.addEventListener('change', (e) => {
      state.novaTarefaFrequencia = e.target.value;
      const campoDias = document.getElementById('campo-dias-semana');
      const campoIntervalo = document.getElementById('campo-intervalo');
      if (campoDias) campoDias.style.display = state.novaTarefaFrequencia === 'dias_semana' ? '' : 'none';
      if (campoIntervalo) campoIntervalo.style.display = state.novaTarefaFrequencia === 'intervalo' ? '' : 'none';
    });

    const btnAddTarefa = document.querySelector('[data-action="add-tarefa"]');
    if (btnAddTarefa) btnAddTarefa.addEventListener('click', adicionarTarefa);

    document.querySelectorAll('[data-action="remover-tarefa"]').forEach((el) => {
      el.addEventListener('click', () => removerTarefa(Number(el.dataset.id)));
    });

    const btnCalendarioMesAnterior = document.querySelector('[data-action="calendario-mes-anterior"]');
    if (btnCalendarioMesAnterior) btnCalendarioMesAnterior.addEventListener('click', () => mudarMesCalendario(-1));

    const btnCalendarioMesSeguinte = document.querySelector('[data-action="calendario-mes-seguinte"]');
    if (btnCalendarioMesSeguinte) btnCalendarioMesSeguinte.addEventListener('click', () => mudarMesCalendario(1));

    const btnAddEvento = document.querySelector('[data-action="add-evento"]');
    if (btnAddEvento) btnAddEvento.addEventListener('click', adicionarEvento);

    document.querySelectorAll('[data-action="remover-evento"]').forEach((el) => {
      el.addEventListener('click', () => removerEvento(el.dataset.id));
    });
  }

  // ---------- login ----------
  function pressLoginKey(k) {
    if (k === 'clear') state.pin = '';
    else if (k === 'back') state.pin = state.pin.slice(0, -1);
    else if (state.pin.length < 4) state.pin += k;

    if (state.pin.length === 4) { tryLogin(); return; }
    render();
  }

  async function mudarCargo(cargoId) {
    state.cargoSelecionado = cargoId;
    state.pessoaSelecionada = null;
    await carregarPessoasDoCargo();
    render();
  }

  async function carregarCargos() {
    state.cargos = await api('/auth/cargos');
    const lembrado = Number(localStorage.getItem('ultimoCargoId'));
    state.cargoSelecionado = state.cargos.some((c) => c.id === lembrado) ? lembrado : state.cargos[0]?.id ?? null;
    await carregarPessoasDoCargo();
  }

  async function carregarPessoasDoCargo() {
    if (!state.cargoSelecionado) { state.pessoasDoCargo = []; return; }
    state.pessoasDoCargo = await api(`/auth/pessoas?cargoId=${state.cargoSelecionado}`);
    const lembrada = Number(localStorage.getItem('ultimaPessoaId'));
    state.pessoaSelecionada = state.pessoasDoCargo.some((p) => p.id === lembrada)
      ? lembrada
      : state.pessoasDoCargo[0]?.id ?? null;
  }

  async function tryLogin() {
    if (!state.pessoaSelecionada) { state.pin = ''; render(); return; }
    try {
      const body = { pessoaId: state.pessoaSelecionada, pin: state.pin };
      const resposta = await api('/auth/login', { method: 'POST', body });

      localStorage.setItem('token', resposta.token);
      localStorage.setItem('ultimoCargoId', String(state.cargoSelecionado));
      localStorage.setItem('ultimaPessoaId', String(state.pessoaSelecionada));
      state.token = resposta.token;
      state.usuario = resposta.usuario;
      await entrarNoApp();
    } catch (err) {
      state.erroLogin = err.message;
      state.pin = '';
      render();
    }
  }

  function sair() {
    localStorage.removeItem('token');
    Object.assign(state, {
      token: null, usuario: null, pin: '', erroLogin: '',
      abas: [], abaAtual: null, configCarregado: false,
      pontoCarregado: false, pontoRegistros: [],
      financeiroCarregado: false, financeiroMesRef: null, financeiroAba: 'despesas',
      financeiroDespesas: [], financeiroReceitas: [], financeiroResumo: null,
      tarefasCarregado: false, tarefasData: null, tarefasLista: [],
      tarefasCadastroCarregado: false, tarefasCadastro: [], novaTarefaFrequencia: 'diaria',
      calendarioCarregado: false, calendarioConfigurado: true, calendarioMesRef: null, calendarioEventos: [],
    });
    carregarCargos().then(render);
  }

  // ---------- shell ----------
  function toggleSidebar() {
    state.sidebarColapsada = !state.sidebarColapsada;
    localStorage.setItem('sidebarColapsada', state.sidebarColapsada ? '1' : '0');
    render();
  }

  function toggleTema() {
    const novo = temaEscuroAgora() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', novo);
    localStorage.setItem('tema', novo);
    state.tema = novo;
    render();
  }

  async function entrarNoApp() {
    if (localStorage.getItem('sidebarColapsada') === null) {
      state.sidebarColapsada = ehMobile();
    }
    state.abas = await api('/auth/me/abas');
    const primeira = state.abas[0]?.id ?? (state.usuario.administrador ? 'config' : null);
    await abrirAba(primeira);
  }

  async function abrirAba(id) {
    if (!id) return;
    state.abaAtual = id;
    if (id === 'config' && !state.configCarregado) {
      render();
      await carregarConfiguracoes();
      state.configCarregado = true;
    }
    if (id === 'ponto' && !state.pontoCarregado) {
      render();
      await carregarPonto();
      state.pontoCarregado = true;
    }
    if (id === 'fluxo_caixa' && !state.financeiroCarregado) {
      render();
      if (!state.financeiroMesRef) state.financeiroMesRef = refMesAtual();
      await carregarFinanceiro();
      state.financeiroCarregado = true;
    }
    if (id === 'tarefas' && !state.tarefasCarregado) {
      render();
      if (!state.tarefasData) state.tarefasData = hojeStr();
      const pendentes = [carregarTarefas()];
      if (state.usuario.administrador) pendentes.push(carregarTarefasCadastro());
      await Promise.all(pendentes);
      state.tarefasCarregado = true;
      if (state.usuario.administrador) state.tarefasCadastroCarregado = true;
    }
    if (id === 'calendario' && !state.calendarioCarregado) {
      render();
      if (!state.calendarioMesRef) state.calendarioMesRef = refMesAtual();
      await carregarCalendario();
      state.calendarioCarregado = true;
    }
    render();
  }

  // ---------- configurações ----------
  async function carregarConfiguracoes() {
    const [cargos, permissoes] = await Promise.all([
      api('/config/cargos'),
      api('/config/permissoes'),
    ]);
    state.configCargos = cargos;
    state.configAbas = permissoes.abas;
    state.configMatriz = permissoes.matriz;
  }

  async function adicionarCargo() {
    const campo = document.getElementById('novo-cargo-nome');
    if (!campo.value.trim()) return;
    await api('/config/cargos', { method: 'POST', body: { nome: campo.value.trim() } });
    const permissoes = await api('/config/permissoes');
    state.configCargos = await api('/config/cargos');
    state.configMatriz = permissoes.matriz;
    render();
  }

  async function salvarPermissoes() {
    const itens = [];
    state.configMatriz.forEach((linha) => {
      linha.abas.forEach((a) => itens.push({ cargoId: linha.cargoId, aba: a.aba, permitido: a.permitido }));
    });
    await api('/config/permissoes', { method: 'PUT', body: { itens } });
  }

  // ---------- bater ponto ----------
  async function carregarPonto() {
    state.pontoRegistros = await api('/ponto');
  }

  async function baterPonto() {
    try {
      await api('/ponto', { method: 'POST' });
      await carregarPonto();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerPonto(id) {
    if (!confirm('Remover esse registro de ponto?')) return;
    await api(`/ponto/${id}`, { method: 'DELETE' });
    await carregarPonto();
    render();
  }

  // ---------- fluxo de caixa ----------
  async function carregarFinanceiro() {
    const { inicio, fim } = limitesMes(state.financeiroMesRef);
    const qs = `?inicio=${inicio}&fim=${fim}`;
    const [despesas, receitas, resumo] = await Promise.all([
      api(`/financeiro/despesas${qs}`),
      api(`/financeiro/receitas${qs}`),
      api(`/financeiro/resumo${qs}`),
    ]);
    state.financeiroDespesas = despesas;
    state.financeiroReceitas = receitas;
    state.financeiroResumo = resumo;
  }

  async function mudarMesFinanceiro(delta) {
    let { ano, mes } = state.financeiroMesRef;
    mes += delta;
    if (mes < 0) { mes = 11; ano -= 1; } else if (mes > 11) { mes = 0; ano += 1; }
    state.financeiroMesRef = { ano, mes };
    await carregarFinanceiro();
    render();
  }

  async function adicionarLancamento() {
    const data = document.getElementById('novo-lancamento-data').value;
    const descricao = document.getElementById('novo-lancamento-descricao').value.trim();
    const categoria = document.getElementById('novo-lancamento-categoria').value.trim();
    const formaPagamento = document.getElementById('novo-lancamento-forma').value;
    const valor = parseNumero(document.getElementById('novo-lancamento-valor').value);
    if (!data || !descricao || !(valor > 0)) {
      alert('Preencha data, descrição e um valor maior que zero.');
      return;
    }
    try {
      await api(`/financeiro/${state.financeiroAba}`, {
        method: 'POST',
        body: { data, descricao, categoria: categoria || null, formaPagamento: formaPagamento || null, valor },
      });
      await carregarFinanceiro();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerLancamento(id) {
    if (!confirm('Remover esse lançamento?')) return;
    await api(`/financeiro/${state.financeiroAba}/${id}`, { method: 'DELETE' });
    await carregarFinanceiro();
    render();
  }

  // ---------- tarefas ----------
  async function carregarTarefas() {
    state.tarefasLista = await api(`/tarefas?data=${state.tarefasData}`);
  }

  async function carregarTarefasCadastro() {
    const [tarefas, cargos] = await Promise.all([
      api('/tarefas/cadastro'),
      state.configCargos.length ? Promise.resolve(state.configCargos) : api('/config/cargos'),
    ]);
    state.tarefasCadastro = tarefas;
    if (!state.configCargos.length) state.configCargos = cargos;
  }

  async function toggleTarefa(id, concluida) {
    try {
      if (concluida) {
        await api(`/tarefas/${id}/concluir`, { method: 'POST', body: { data: state.tarefasData } });
      } else {
        await api(`/tarefas/${id}/concluir?data=${state.tarefasData}`, { method: 'DELETE' });
      }
      await carregarTarefas();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function mudarDiaTarefas(delta) {
    const d = new Date(`${state.tarefasData}T00:00:00`);
    d.setDate(d.getDate() + delta);
    state.tarefasData = d.toISOString().slice(0, 10);
    await carregarTarefas();
    render();
  }

  async function adicionarTarefa() {
    const titulo = document.getElementById('nova-tarefa-titulo').value.trim();
    const descricao = document.getElementById('nova-tarefa-descricao').value.trim();
    const cargoId = Number(document.getElementById('nova-tarefa-cargo').value);
    const etapa = document.getElementById('nova-tarefa-etapa').value;
    const frequencia = document.getElementById('nova-tarefa-frequencia').value;
    if (!titulo || !cargoId) { alert('Preencha pelo menos o título e o cargo.'); return; }

    const body = { titulo, descricao: descricao || null, cargoId, etapa, frequencia };
    if (frequencia === 'dias_semana') {
      body.diasSemana = [...document.querySelectorAll('.dia-semana-tarefa:checked')].map((el) => Number(el.value));
      if (!body.diasSemana.length) { alert('Escolha pelo menos um dia da semana.'); return; }
    }
    if (frequencia === 'intervalo') {
      body.intervaloDias = parseInt(document.getElementById('nova-tarefa-intervalo').value, 10);
      if (!(body.intervaloDias > 0)) { alert('Informe a cada quantos dias a tarefa se repete.'); return; }
    }

    try {
      await api('/tarefas', { method: 'POST', body });
      state.novaTarefaFrequencia = 'diaria';
      await Promise.all([carregarTarefas(), carregarTarefasCadastro()]);
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerTarefa(id) {
    if (!confirm('Remover essa tarefa? O histórico de conclusões dela também será apagado.')) return;
    await api(`/tarefas/${id}`, { method: 'DELETE' });
    await Promise.all([carregarTarefas(), carregarTarefasCadastro()]);
    render();
  }

  // ---------- calendário ----------
  function uid() { return Math.random().toString(36).slice(2, 9); } // mesmo padrão de id do PDV Jabá

  async function carregarCalendario() {
    const { inicio, fim } = limitesMes(state.calendarioMesRef);
    const resposta = await api(`/calendario?inicio=${inicio}&fim=${fim}`);
    state.calendarioConfigurado = resposta.configurado;
    state.calendarioEventos = resposta.eventos;
  }

  async function mudarMesCalendario(delta) {
    let { ano, mes } = state.calendarioMesRef;
    mes += delta;
    if (mes < 0) { mes = 11; ano -= 1; } else if (mes > 11) { mes = 0; ano += 1; }
    state.calendarioMesRef = { ano, mes };
    await carregarCalendario();
    render();
  }

  async function adicionarEvento() {
    const data = document.getElementById('novo-evento-data').value;
    const horaInicio = document.getElementById('novo-evento-hora-inicio').value.trim();
    const horaFim = document.getElementById('novo-evento-hora-fim').value.trim();
    const tipo = document.getElementById('novo-evento-tipo').value;
    const titulo = document.getElementById('novo-evento-titulo').value.trim();
    const observacao = document.getElementById('novo-evento-observacao').value.trim();
    if (!data || !titulo) { alert('Preencha pelo menos data e título.'); return; }
    try {
      await api('/calendario', {
        method: 'POST',
        body: { id: uid(), tipo, data, horaInicio: horaInicio || null, horaFim: horaFim || null, titulo, observacao: observacao || null },
      });
      await carregarCalendario();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerEvento(id) {
    if (!confirm('Remover esse evento?')) return;
    await api(`/calendario/${id}`, { method: 'DELETE' });
    await carregarCalendario();
    render();
  }

  // teclado físico só ativo enquanto não logado
  document.onkeydown = (e) => {
    if (state.usuario) return;
    if (e.key >= '0' && e.key <= '9') pressLoginKey(e.key);
    else if (e.key === 'Backspace') pressLoginKey('back');
    else if (e.key === 'Escape') pressLoginKey('clear');
  };

  window.addEventListener('resize', () => {
    if (state.usuario) render();
  });

  // ---------- boot ----------
  (async function iniciar() {
    await carregarCargos();
    if (state.token) {
      try {
        state.usuario = await api('/auth/me');
        await entrarNoApp();
        return;
      } catch {
        localStorage.removeItem('token');
        state.token = null;
      }
    }
    render();
  })();
})();
</script>
</body>
</html>
