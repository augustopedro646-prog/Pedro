<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ATPN — Gestão</title>
<style>
  /* Paleta baseada na marca da ATPN (círculo verde/dourado, "Clube Social"):
     verde principal e dourado de apoio. Nunca cor hardcoded num componente,
     sempre var(--token) — troca de tema (claro/escuro) mexe só aqui. */
  :root {
    color-scheme: light;
    --fundo: #f3f6f3;
    --superficie: #ffffff;
    --borda: #dde6de;
    --texto: #1b241d;
    --texto-fraco: #5f6f62;
    --primaria: #1f7a3f;
    --primaria-texto: #ffffff;
    --dourado: #c99a12;
    --perigo: #b3413a;
    --sidebar-bg: #112a1b;
    --sidebar-text: #d3e6d8;
    --sidebar-active-bg: #1f7a3f;
    --sidebar-active-text: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --radius: 10px;
    --ev-bg: #f9dca0; --ev-fg: #6b4a05;
    --fer-bg: #f9c9dc; --fer-soft: #fde9f1; --fer-fg: #8f1d4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --fundo: #10140f;
      --superficie: #182019;
      --borda: #27342a;
      --texto: #e8efe9;
      --texto-fraco: #9fb0a4;
      --primaria: #3fae6a;
      --primaria-texto: #0a160d;
      --dourado: #e8c04a;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
      --ev-bg: #54421a; --ev-fg: #f2d68a;
      --fer-bg: #5a2038; --fer-soft: #3a1a29; --fer-fg: #f6b3cf;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fundo: #10140f;
    --superficie: #182019;
    --borda: #27342a;
    --texto: #e8efe9;
    --texto-fraco: #9fb0a4;
    --primaria: #3fae6a;
    --primaria-texto: #0a160d;
    --dourado: #e8c04a;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --ev-bg: #54421a; --ev-fg: #f2d68a;
    --fer-bg: #5a2038; --fer-soft: #3a1a29; --fer-fg: #f6b3cf;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--fundo);
    color: var(--texto);
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- Login ---------- */
  .tela-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .cartao-login {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-top: 4px solid var(--dourado);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    width: 100%;
    max-width: 360px;
  }
  .marca-login { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 18px; }
  .marca-login svg { margin-bottom: 10px; }
  .cartao-login h1 { font-size: 1.3rem; letter-spacing: .06em; margin: 0; color: var(--primaria); }
  .cartao-login .sub { color: var(--texto-fraco); font-size: .82rem; margin: 2px 0 0; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: .8rem; color: var(--texto-fraco); margin-bottom: 4px; }
  .campo select, .campo input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--borda);
    border-radius: 8px;
    background: var(--fundo);
    color: var(--texto);
  }
  .pin-display { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
  .pin-display span { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--texto-fraco); }
  .pin-display span.preenchido { background: var(--primaria); border-color: var(--primaria); }
  .teclado-pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .teclado-pin button {
    padding: 14px 0; border-radius: 8px; border: 1px solid var(--borda);
    background: var(--superficie); cursor: pointer; font-size: 1.1rem;
  }
  .teclado-pin button:active { background: var(--fundo); }
  .erro-login { color: var(--perigo); font-size: .85rem; min-height: 1.2em; margin-top: 8px; text-align: center; }

  /* ---------- Sidebar / shell (mesmo padrão do PDV Jabá) ---------- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 230px;
    background: var(--sidebar-bg); color: var(--sidebar-text);
    display: flex; flex-direction: column; transition: transform .2s ease; overflow-y: auto;
    z-index: 10;
  }
  .sidebar.colapsada { transform: translateX(-100%); }
  .main-content { margin-left: 230px; transition: margin-left .2s ease; min-height: 100vh; }
  .main-content.sidebar-colapsada { margin-left: 0; }

  .sidebar .marca { padding: 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .sidebar .marca strong { display: block; }
  .sidebar .marca span { color: var(--sidebar-text); opacity: .7; font-size: .8rem; }
  .sidebar .marca button {
    margin-top: 10px; padding: 6px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
    background: transparent; color: var(--sidebar-text); cursor: pointer; font-size: .8rem;
  }

  nav.tabs { display: flex; flex-direction: column; gap: 2px; padding: .75rem; flex: 1; overflow-y: auto; }
  nav.tabs button {
    position: relative; display: flex; align-items: center; text-align: left;
    padding: 10px 12px; border-radius: 8px; border: none; background: transparent;
    color: var(--sidebar-text); cursor: pointer; font-size: .92rem;
  }
  nav.tabs button.active { background: var(--sidebar-active-bg); color: var(--sidebar-active-text); }
  nav.tabs button:not(.active):hover { background: rgba(255,255,255,.08); }
  .tab-badge {
    margin-left: auto; background: var(--perigo); color: #fff; border-radius: 999px;
    font-size: .7rem; padding: 1px 7px; min-width: 18px; text-align: center;
  }

  .user-chip { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: .85rem; }
  .user-chip button {
    margin-top: 8px; background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: .8rem;
  }

  .abrir-sidebar-btn {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--borda); background: var(--superficie);
    box-shadow: var(--shadow); cursor: pointer; font-size: 1.1rem;
  }
  .sidebar-backdrop { display: none; }

  @media (max-width: 820px) {
    .sidebar { width: 78vw; max-width: 280px; box-shadow: 2px 0 16px rgba(0,0,0,.35); }
    .main-content { margin-left: 0 !important; }
    .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9; }
  }

  .conteudo { padding: 28px; }
  .conteudo h2 { margin-top: 0; }
  .placeholder { color: var(--texto-fraco); }

  /* ---------- Configurações ---------- */
  .secao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
  .secao h3 { margin-top: 0; }
  .linha-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .linha-form input, .linha-form select {
    flex: 1 1 160px; min-width: 120px; padding: 8px 10px; border: 1px solid var(--borda);
    border-radius: 6px; background: var(--fundo); color: var(--texto);
  }
  .botao { background: var(--primaria); color: var(--primaria-texto); border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  table.permissoes { border-collapse: collapse; width: 100%; }
  table.permissoes th, table.permissoes td { border: 1px solid var(--borda); padding: 8px 10px; text-align: center; font-size: .85rem; }
  table.permissoes th:first-child, table.permissoes td:first-child { text-align: left; }

  /* ---------- Bater ponto / Fluxo de caixa ---------- */
  table.tabela-lista { border-collapse: collapse; width: 100%; font-size: .88rem; }
  table.tabela-lista th, table.tabela-lista td { border-bottom: 1px solid var(--borda); padding: 8px 10px; text-align: left; }
  table.tabela-lista th { color: var(--texto-fraco); font-weight: 600; }
  .botao-ir { background: none; border: none; color: var(--primaria); cursor: pointer; padding: 0; font-size: .85rem; font-weight: 600; }
  .botao-link { background: none; border: none; color: var(--perigo); cursor: pointer; padding: 0; font-size: .82rem; text-decoration: underline; }
  .abas-secundarias { display: flex; gap: 6px; margin-bottom: 14px; }
  .abas-secundarias button { padding: 6px 14px; border: 1px solid var(--borda); background: var(--fundo); border-radius: 999px; cursor: pointer; font-size: .85rem; }
  .abas-secundarias button.ativa { background: var(--primaria); color: var(--primaria-texto); border-color: var(--primaria); }
  .navegacao-mes { display: flex; align-items: center; gap: 12px; }

  /* ---------- Despesas por foto ---------- */
  .tag-tipo { font-size: .68rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--borda); color: var(--texto-fraco); white-space: nowrap; }
  .form-despesa { border-color: var(--primaria); }
  .fotos-despesa { margin: 10px 0; }
  .miniaturas { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .miniatura { display: inline-flex; align-items: flex-start; gap: 4px; }
  .miniatura img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--borda); }
  .pdf-icone { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 96px; border: 1px solid var(--borda); border-radius: 8px; font-weight: 700; }
  .aviso-ia { padding: 8px 12px; border-radius: 8px; background: var(--ev-bg); color: var(--ev-fg); font-size: .85rem; }
  .painel-anexos { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

  /* ---------- Eventos / Reservas ---------- */
  .cartao-reserva { border: 1px solid var(--borda); border-left-width: 4px; border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; background: var(--superficie); }
  .cartao-reserva.status-novo { border-left-color: var(--dourado); }
  .cartao-reserva.status-negociando { border-left-color: var(--dourado); }
  .cartao-reserva.status-confirmado { border-left-color: var(--primaria); }
  .cartao-reserva.status-recusado, .cartao-reserva.status-concluido { border-left-color: var(--borda); opacity: .85; }
  .topo-reserva { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .tag-status { align-self: flex-start; font-size: .75rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--borda); }
  .tag-confirmado { color: var(--primaria); border-color: var(--primaria); }
  .tag-novo, .tag-negociando { color: var(--dourado); border-color: var(--dourado); }
  .acoes-reserva { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .aviso-conflito { margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-size: .82rem; background: var(--fer-soft); color: var(--fer-fg); }
  .aviso-forte { background: var(--fer-bg); font-weight: 700; }
  .aviso-incerto { background: var(--ev-bg); color: var(--ev-fg); }
  .aviso-livre { margin-top: 8px; font-size: .82rem; color: var(--primaria); font-weight: 600; }

  /* ---------- Configurações / Histórico ---------- */
  .grade-assoc { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .campo-assoc { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; color: var(--texto-fraco); }
  .campo-assoc input, .linha-horario input[type="time"] { font-size: 16px; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 8px; background: var(--fundo); }
  .linha-horario { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 0; border-bottom: 1px solid var(--borda); }
  .linha-horario .h-dia { width: 170px; font-weight: 600; font-size: .9rem; }
  .linha-horario .h-turno { display: inline-flex; align-items: center; gap: 6px; }
  .item-historico { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--borda); }

  /* ---------- Relatórios ---------- */
  .rel-barras { display: flex; align-items: flex-end; gap: 6px; height: 160px; margin: 12px 0 4px; }
  .rel-barra { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .rel-barra-fill { width: 100%; background: var(--primaria); border-radius: 4px 4px 0 0; min-height: 2px; }
  .rel-barra.parcial .rel-barra-fill { background: repeating-linear-gradient(45deg, var(--dourado), var(--dourado) 4px, transparent 4px, transparent 8px); border: 1px solid var(--dourado); }
  .rel-barra-rot { display: flex; gap: 6px; font-size: .68rem; color: var(--texto-fraco); }
  .rel-barra-rot span { flex: 1; text-align: center; min-width: 0; }
  .rel-delta-pos { color: var(--primaria); font-weight: 600; }
  .rel-delta-neg { color: var(--perigo); font-weight: 600; }
  .rel-hbar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: .85rem; }
  .rel-hbar-nome { width: 170px; flex: none; }
  .rel-hbar-trilho { flex: 1; background: var(--borda); border-radius: 4px; height: 10px; overflow: hidden; }
  .rel-hbar-fill { height: 100%; background: var(--primaria); }

  /* ---------- Calendário (grade do mês) ---------- */
  .cal-grid-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .cal-grid-head { margin-bottom: 6px; text-align: center; font-size: .72rem; text-transform: uppercase; color: var(--texto-fraco); }
  .cal-cell { min-height: 84px; border: 1px solid var(--borda); border-radius: 8px; background: var(--superficie); padding: 5px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .cal-cell-vazia { border: none; background: transparent; }
  .cal-cell-hoje { border-color: var(--primaria); border-width: 2px; }
  .cal-cell-num { font-weight: 700; font-size: .8rem; }
  .cal-cell-evento { background: var(--ev-bg); }
  .cal-cell-evento .cal-cell-num { color: var(--ev-fg); }
  .cal-cell-facultativo { background: var(--fer-soft); }
  .cal-cell-feriado { background: var(--fer-bg); }
  .cal-cell-feriado .cal-cell-num, .cal-cell-facultativo .cal-cell-num { color: var(--fer-fg); }
  .cal-chip { font-size: .66rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
  .cal-chip-evento { color: var(--ev-fg); font-weight: 700; }
  .cal-chip-feriado { color: var(--fer-fg); font-weight: 700; }
  .cal-chip-facultativo { color: var(--fer-fg); }
  .cal-legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .78rem; color: var(--texto-fraco); margin-bottom: 10px; }
  .cal-legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; }
  @media (max-width: 680px) { .cal-cell { min-height: 56px; padding: 3px; } .cal-chip { font-size: .58rem; } }

  /* ---------- Cartões/gráficos do Fluxo de caixa ---------- */
  .cor-receita { color: var(--primaria); }
  .cor-despesa { color: var(--perigo); }
  .cor-receita-bg { background: var(--primaria); }
  .cor-despesa-bg { background: var(--perigo); }

  .cartoes-resumo { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .cartao-resumo { flex: 1 1 170px; background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .cartao-resumo-label { display: block; color: var(--texto-fraco); font-size: .8rem; margin-bottom: 6px; }
  .cartao-resumo-valor { font-size: 1.4rem; }

  .graficos-lado-a-lado { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .graficos-lado-a-lado { grid-template-columns: 1fr; } }

  .grafico-categorias { display: flex; flex-direction: column; gap: 10px; }
  .linha-categoria { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .categoria-nome { flex: 0 0 38%; color: var(--texto-fraco); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .categoria-barra-trilho { flex: 1; background: var(--fundo); border-radius: 6px; height: 14px; overflow: hidden; }
  .categoria-barra { height: 100%; border-radius: 6px; }
  .categoria-valor { flex: 0 0 auto; text-align: right; white-space: nowrap; }

  .grafico-tendencia { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding: 10px 4px 0; overflow-x: auto; }
  .coluna-mes { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 28px; height: 100%; justify-content: flex-end; }
  .duas-barras { display: flex; align-items: flex-end; gap: 4px; height: 100%; width: 100%; justify-content: center; }
  .barra-tendencia { width: 14px; min-height: 2px; border-radius: 3px 3px 0 0; }
  .mes-label { margin-top: 6px; font-size: .75rem; color: var(--texto-fraco); text-transform: capitalize; }
  .legenda-tendencia { display: flex; gap: 16px; margin-top: 10px; font-size: .8rem; color: var(--texto-fraco); }
  .legenda-cor { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }

  /* ---------- Tarefas ---------- */
  .lista-tarefas { display: flex; flex-direction: column; gap: 10px; }
  .item-tarefa { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border: 1px solid var(--borda); border-radius: 8px; cursor: pointer; }
  .item-tarefa input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; flex: none; }
  .item-tarefa.concluida { opacity: .6; }
  .item-tarefa.concluida .item-tarefa-titulo { text-decoration: line-through; }
  .item-tarefa-titulo { font-weight: 600; }
  .item-tarefa-descricao { color: var(--texto-fraco); font-size: .85rem; margin-top: 2px; }
  .item-tarefa-cargo { color: var(--texto-fraco); font-size: .78rem; margin-top: 4px; }
  .dias-semana-tarefa { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .dias-semana-tarefa label { display: flex; align-items: center; gap: 4px; font-size: .85rem; }

  /* ---------- Sócios ---------- */
  .busca-socios-grande {
    width: 100%; padding: 14px 16px; font-size: 1.05rem; border: 2px solid var(--borda);
    border-radius: var(--radius); background: var(--superficie); color: var(--texto);
  }
  .busca-socios-grande:focus { outline: none; border-color: var(--primaria); }
  tr.linha-socio { cursor: pointer; }
  tr.linha-socio:hover { background: var(--fundo); }
  .cor-atraso { color: var(--perigo); }

  /* ---------- Rodapé da sidebar: tema, atualizar ---------- */
  .rodape-sidebar { padding: 10px 16px; border-top: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; gap: 6px; }
  .rodape-sidebar button {
    background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--sidebar-text);
    border-radius: 6px; padding: 7px 10px; cursor: pointer; font-size: .82rem; text-align: left;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
  // ---------- Estado global (SPA "na mão", sem framework/build step) ----------
  const API_BASE = '/api';
  let timerBuscaSocios = null;

  const state = {
    token: localStorage.getItem('token') || null,
    usuario: null,        // {pessoaId, nome, cargoId, cargoNome, administrador}

    // tela de login
    cargos: [],
    pessoasDoCargo: [],
    cargoSelecionado: null,
    pessoaSelecionada: null,
    pin: '',
    erroLogin: '',

    // shell
    sidebarColapsada: localStorage.getItem('sidebarColapsada') === '1',
    abas: [],
    abaAtual: null,

    // tema (claro/escuro): preferência salva neste aparelho. Sem escolha
    // salva, o CSS já reage sozinho a prefers-color-scheme (não força nada).
    tema: localStorage.getItem('tema'),

    // configurações
    configCarregado: false,
    configCargos: [],
    configEquipe: [],
    despForm: null,
    despAnexos: null,
    financeiroAPagar: null,
    leituraNotaConfigurada: false,
    mensBusca: '',
    mensResultados: [],
    mensFicha: null,
    mensForm: null,
    mensHoje: null,
    mensErro: null,
    eventosAba: 'reservas',
    reservas: null,
    reservasErro: null,
    reservasFiltro: 'abertas',
    reservaEditando: null,
    configAssoc: null,
    historicoTipo: 'associacao',
    historicoVersoes: null,
    historicoErro: null,
    rel: null,
    relErro: null,
    relAba: 'mensalidades',
    relPeriodo: '3m',
    relInadFaixa: 'todas',
    inicio: null,
    inicioCarregado: false,
    inicioErro: null,
    configAbas: [],
    configMatriz: [],

    // bater ponto
    pontoCarregado: false,
    pontoRegistros: [],

    // fluxo de caixa
    financeiroCarregado: false,
    financeiroMesRef: null, // {ano, mes(0-indexado)}
    financeiroAba: 'despesas', // ou 'receitas'
    financeiroDespesas: [],
    financeiroReceitas: [],
    financeiroResumo: null,

    // tarefas
    tarefasCarregado: false,
    tarefasData: null, // 'YYYY-MM-DD', padrão: hoje
    tarefasLista: [],
    tarefasCadastroCarregado: false,
    tarefasCadastro: [],
    novaTarefaFrequencia: 'diaria',

    // calendário (agenda compartilhada com o PDV Jabá)
    calendarioCarregado: false,
    calendarioConfigurado: true,
    calendarioMesRef: null,
    calendarioEventos: [],
    eventosProximos: [],
    eventosCarregado: false,

    // sócios (importado de planilha — ver scripts/importar-socios.js)
    sociosCarregado: false,
    sociosBusca: '',
    sociosFiltroClube: 'todos',
    sociosFiltroStatus: 'todos',
    sociosLista: [],
    sociosTotal: 0,
    sociosResumo: [],
    sociosExpandidoId: null,
    sociosDetalhe: null,
  };

  // Aplica o tema salvo antes do primeiro render (senão a tela nasce no
  // tema errado e pisca ao corrigir). Sem escolha salva, não toca no
  // atributo — o CSS cuida da preferência do sistema por conta própria.
  if (state.tema) document.documentElement.setAttribute('data-theme', state.tema);

  const FORMAS_PAGAMENTO = ['Dinheiro', 'Cartão de crédito', 'Cartão de débito', 'Pix', 'Boleto', 'Transferência'];

  // Escapa texto livre digitado por qualquer pessoa antes de ir pro
  // innerHTML. Sem isso é XSS armazenado — usar em TODO dado de usuário.
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Padrão de campo numérico: nunca <input type="number"> puro (apaga
  // "10," e depende do locale do navegador) — type="text" inputmode="decimal" + parser.
  function parseNumero(texto) {
    const limpo = String(texto ?? '').trim().replace(/\./g, '').replace(',', '.');
    const n = parseFloat(limpo);
    return Number.isFinite(n) ? n : 0;
  }

  async function api(caminho, opts = {}) {
    const resp = await fetch(API_BASE + caminho, {
      ...opts,
      headers: {
        'Content-Type': 'application/json',
        ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}),
        ...(opts.headers || {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const dado = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      const erro = new Error(dado.erro || 'Erro na requisição');
      if (dado.conflitos) erro.conflitos = dado.conflitos; // reservas: conflito de espaço (409)
      if (dado.precisaConfirmar) erro.precisaConfirmar = true; // mensalidades: mês já tem pagamento registrado
      throw erro;
    }
    return dado;
  }

  function ehMobile() { return window.matchMedia('(max-width: 820px)').matches; }
  function badgeDaAba(_id) { return 0; } // pendências por aba entram quando as telas de negócio existirem

  // ---------- render ----------
  function render() {
    document.getElementById('app').innerHTML = state.usuario ? viewApp() : viewLogin();
    attachEvents();
  }

  // Marca da ATPN: círculo verde/dourado em dois tons (inspirado no logo
  // real — sem o arquivo oficial ainda; se o Pedro mandar o PNG/SVG da
  // associação, trocamos isso por ele direto).
  function marcaAtpnSvg(tamanho) {
    return `
      <svg width="${tamanho}" height="${tamanho}" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="49" fill="var(--primaria)"/>
        <path d="M50,1 A49,49 0 0,1 50,99 A24.5,24.5 0 0,1 50,50 A24.5,24.5 0 0,0 50,1 Z" fill="var(--dourado)"/>
        <circle cx="50" cy="25.5" r="6" fill="var(--primaria)"/>
        <circle cx="50" cy="74.5" r="6" fill="var(--dourado)"/>
      </svg>`;
  }

  function viewLogin() {
    return `
      <div class="tela-login">
        <div class="cartao-login">
          <div class="marca-login">
            ${marcaAtpnSvg(56)}
            <h1>ATPN</h1>

          <div class="campo">

            <select id="sel-cargo" data-action="mudar-cargo">

            </select>
          </div>
          <div class="campo">
            <label for="sel-pessoa">Pessoa</label>
            <select id="sel-pessoa" data-action="mudar-pessoa">
              ${state.pessoasDoCargo.map((p) => `<option value="${p.id}" ${p.id === state.pessoaSelecionada ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}
            </select>
          </div>

          <div class="pin-display">
            ${[0, 1, 2, 3].map((i) => `<span class="${i < state.pin.length ? 'preenchido' : ''}"></span>`).join('')}
          </div>
          <div class="teclado-pin">
            ${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((n) => `<button data-tecla="${n}">${n}</button>`).join('')}
            <button data-tecla="clear">C</button>
            <button data-tecla="0">0</button>
            <button data-tecla="back">⌫</button>
          </div>
          <p class="erro-login">${esc(state.erroLogin)}</p>
        </div>
      </div>`;
  }

  // Tema em efeito agora: o explícito salvo, ou (sem escolha salva) o que
  // o sistema operacional está usando.
  function temaEscuroAgora() {
    const explicito = document.documentElement.getAttribute('data-theme');
    if (explicito) return explicito === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function sidebarHtml() {
    const itens = [...state.abas];
    if (state.usuario.administrador) {
      itens.push({ id: 'config', nome: 'Configurações' });
      itens.push({ id: 'historico', nome: 'Histórico' });
    }

    const nav = itens.map((a) => {
      const n = badgeDaAba(a.id);
      return `<button data-nav="${a.id}" class="${state.abaAtual === a.id ? 'active' : ''}">
        ${esc(a.nome)}${n > 0 ? `<span class="tab-badge">${n > 99 ? '99+' : n}</span>` : ''}
      </button>`;
    }).join('');

    return `
      <aside class="sidebar ${state.sidebarColapsada ? 'colapsada' : ''}">
        <div class="marca">
          <strong>ATPN</strong>
          <span>Clube Social</span>
          <button data-action="toggle-sidebar">« Esconder</button>
        </div>
        <nav class="tabs">${nav}</nav>
        <div class="rodape-sidebar">
          <button data-action="atualizar">↻ Atualizar</button>
          <button data-action="toggle-tema">${temaEscuroAgora() ? '☀️ Modo claro' : '🌙 Modo escuro'}</button>
        </div>
        <div class="user-chip">
          <div>${esc(state.usuario.nome)}</div>
          <div style="opacity:.7">${esc(state.usuario.cargoNome)}</div>
          <button data-action="sair">Sair</button>
        </div>
      </aside>
      ${state.sidebarColapsada
        ? `<button class="abrir-sidebar-btn" data-action="toggle-sidebar">☰</button>`
        : `<div class="sidebar-backdrop" data-action="toggle-sidebar"></div>`}`;
  }

  function viewApp() {
    return `
      ${sidebarHtml()}
      <div class="main-content ${state.sidebarColapsada ? 'sidebar-colapsada' : ''}">
        <div class="conteudo">${viewConteudo()}</div>
      </div>`;
  }

  function viewConteudo() {
    if (state.abaAtual === 'config') return viewConfiguracoes();
    if (state.abaAtual === 'ponto') return viewPonto();
    if (state.abaAtual === 'fluxo_caixa') return viewFluxoCaixa();
    if (state.abaAtual === 'tarefas') return viewTarefas();
    if (state.abaAtual === 'calendario') return viewCalendario();
    if (state.abaAtual === 'socios') return viewSocios();
    if (state.abaAtual === 'eventos') return viewEventos();
    if (state.abaAtual === 'inicio') return viewInicio();
    if (state.abaAtual === 'relatorios') return viewRelatorios();
    if (state.abaAtual === 'historico') return viewHistorico();
    if (state.abaAtual === 'mensalidades') return viewMensalidades();
    const nomeAba = (state.abas.find((a) => a.id === state.abaAtual) || {}).nome || '';
    return `
      <h2>${esc(nomeAba)}</h2>
      <p class="placeholder">Tela ainda não desenhada — depende do que o Pedro trouxer da visita à associação.</p>`;
  }

  // ---------- bater ponto ----------
  function viewPonto() {
    if (!state.pontoCarregado) return '<h2>Bater ponto</h2><p class="placeholder">Carregando…</p>';

    const meuUltimo = [...state.pontoRegistros].reverse().find((r) => r.pessoaId === state.usuario.pessoaId);
    const proximoTipo = meuUltimo?.tipo === 'entrada' ? 'saída' : 'entrada';

    const linhas = [...state.pontoRegistros].reverse().map((r) => `
      <tr>
        <td>${esc(r.pessoaNome)}</td>
        <td>${r.tipo === 'entrada' ? 'Entrada' : 'Saída'}</td>
        <td>${new Date(r.registradoEm).toLocaleString('pt-BR')}</td>
        ${state.usuario.administrador ? `<td><button class="botao-link" data-action="remover-ponto" data-id="${r.id}">remover</button></td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${state.usuario.administrador ? 4 : 3}" class="placeholder">Nenhum registro nos últimos 30 dias.</td></tr>`;

    return `
      <h2>Bater ponto</h2>
      <div class="secao">
        <p>Seu próximo registro será: <strong>${proximoTipo}</strong></p>
        <button class="botao" data-action="bater-ponto">Bater ponto (${proximoTipo})</button>
      </div>
      <div class="secao">
        <h3>Últimos registros ${state.usuario.administrador ? '(de todo mundo)' : '(seus)'}</h3>
        <table class="tabela-lista">
          <thead><tr><th>Pessoa</th><th>Tipo</th><th>Quando</th>${state.usuario.administrador ? '<th></th>' : ''}</tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }

  // ---------- fluxo de caixa ----------
  function refMesAtual() {
    const hoje = new Date();
    return { ano: hoje.getFullYear(), mes: hoje.getMonth() };
  }

  function limitesMes(ref) {
    const fmt = (d) => dataLocalStr(d);
    return {
      inicio: fmt(new Date(ref.ano, ref.mes, 1)),
      fim: fmt(new Date(ref.ano, ref.mes + 1, 0)),
    };
  }

  function nomeMes(ref) {
    const texto = new Date(ref.ano, ref.mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function formatarMoeda(valor) {
    return `R$ ${Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function cartoesResumoFinanceiro(resumo) {
    const saldo = resumo.totalReceitas - resumo.totalDespesas;
    return `
      <div class="cartoes-resumo">
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Receitas do mês</span>
          <strong class="cartao-resumo-valor cor-receita">${formatarMoeda(resumo.totalReceitas)}</strong>
        </div>
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Despesas do mês</span>
          <strong class="cartao-resumo-valor cor-despesa">${formatarMoeda(resumo.totalDespesas)}</strong>
        </div>
        <div class="cartao-resumo">
          <span class="cartao-resumo-label">Saldo do mês</span>
          <strong class="cartao-resumo-valor ${saldo >= 0 ? 'cor-receita' : 'cor-despesa'}">${formatarMoeda(saldo)}</strong>
        </div>
      </div>`;
  }

  function graficoCategorias(lista, classeCor) {
    if (!lista.length) return '<p class="placeholder">Nenhum lançamento com categoria no período.</p>';
    const max = Math.max(...lista.map((l) => l.total));
    return `
      <div class="grafico-categorias">
        ${lista.map((l) => `
          <div class="linha-categoria">
            <span class="categoria-nome" title="${esc(l.categoria)}">${esc(l.categoria)}</span>
            <div class="categoria-barra-trilho">
              <div class="categoria-barra ${classeCor}" style="width:${max ? (l.total / max * 100) : 0}%"></div>
            </div>
            <span class="categoria-valor">${formatarMoeda(l.total)}</span>
          </div>`).join('')}
      </div>`;
  }

  function nomeMesCurto(chaveAnoMes) {
    const [ano, mes] = chaveAnoMes.split('-').map(Number);
    return new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  }

  function graficoTendencia(tendencia) {
    const max = Math.max(1, ...tendencia.map((t) => Math.max(t.receitas, t.despesas)));
    return `
      <div class="grafico-tendencia">
        ${tendencia.map((t) => `
          <div class="coluna-mes">
            <div class="duas-barras">
              <div class="barra-tendencia cor-receita-bg" style="height:${(t.receitas / max * 100).toFixed(1)}%" title="Receitas em ${esc(nomeMesCurto(t.mes))}: ${formatarMoeda(t.receitas)}"></div>
              <div class="barra-tendencia cor-despesa-bg" style="height:${(t.despesas / max * 100).toFixed(1)}%" title="Despesas em ${esc(nomeMesCurto(t.mes))}: ${formatarMoeda(t.despesas)}"></div>
            </div>
            <span class="mes-label">${esc(nomeMesCurto(t.mes))}</span>
          </div>`).join('')}
      </div>
      <div class="legenda-tendencia">
        <span><i class="legenda-cor cor-receita-bg"></i>Receitas</span>
        <span><i class="legenda-cor cor-despesa-bg"></i>Despesas</span>
      </div>`;
  }

  function viewFluxoCaixa() {
    if (!state.financeiroCarregado) return '<h2>Fluxo de caixa</h2><p class="placeholder">Carregando…</p>';

    const resumo = state.financeiroResumo;
    const lista = state.financeiroAba === 'despesas' ? state.financeiroDespesas : state.financeiroReceitas;
    const total = lista.reduce((soma, l) => soma + Number(l.valor), 0);

    const ehDespesa = state.financeiroAba === 'despesas';
    const linhas = lista.map((l) => ehDespesa ? `
      <tr>
        <td>${esc(l.data.split('-').reverse().join('/'))}</td>
        <td>${esc(l.descricao)}${l.fornecedor ? ` <span class="placeholder">· ${esc(l.fornecedor)}</span>` : ''} <span class="tag-tipo">${esc(rotuloTipoDespesa(l.tipo))}</span></td>
        <td>${esc(l.categoria || '—')}</td>
        <td>${esc(l.formaPagamento || '—')}</td>
        <td>${formatarMoeda(l.valor)}</td>
        <td style="white-space:nowrap;">
          ${l.anexos ? `<button class="botao-ir" data-desp="anexos" data-id="${l.id}" title="Ver foto/PDF anexado">📎 ${l.anexos}</button>` : ''}
          <button class="botao-ir" data-desp="editar" data-id="${l.id}">editar</button>
          <button class="botao-link" data-action="remover-lancamento" data-id="${l.id}">remover</button>
        </td>
      </tr>` : `
      <tr>
        <td>${esc(l.data.split('-').reverse().join('/'))}</td>
        <td>${esc(l.descricao)}</td>
        <td>${esc(l.categoria || '—')}</td>
        <td>${esc(l.formaPagamento || '—')}</td>
        <td>${formatarMoeda(l.valor)}</td>
        <td><button class="botao-link" data-action="remover-lancamento" data-id="${l.id}">remover</button></td>
      </tr>`).join('') || `<tr><td colspan="6" class="placeholder">Nenhum lançamento no mês.</td></tr>`;
    const cabecalho = ehDespesa
      ? '<thead><tr><th>Pago em</th><th>Descrição</th><th>Categoria</th><th>Forma de pagamento</th><th>Valor</th><th></th></tr></thead>'
      : '<thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Forma de pagamento</th><th>Valor</th><th></th></tr></thead>';
    const formSimples = `
        <div class="linha-form">
          <input type="date" id="novo-lancamento-data" value="${new Date().toISOString().slice(0, 10)}" />
          <input type="text" id="novo-lancamento-descricao" placeholder="Descrição" />
          <input type="text" id="novo-lancamento-categoria" placeholder="Categoria (opcional)" />
          <select id="novo-lancamento-forma">
            <option value="">Forma de pagamento…</option>
            ${FORMAS_PAGAMENTO.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join('')}
          </select>
          <input type="text" inputmode="decimal" id="novo-lancamento-valor" placeholder="Valor" />
          <button class="botao" data-action="add-lancamento">Adicionar</button>
        </div>`;
    const formHtml = ehDespesa ? formDespesaHtml() : formSimples;

    return `
      <h2>Fluxo de caixa</h2>
      <div class="secao">
        <div class="navegacao-mes">
          <button class="botao" data-action="mes-anterior">‹</button>
          <strong>${nomeMes(state.financeiroMesRef)}</strong>
          <button class="botao" data-action="mes-seguinte">›</button>
        </div>
      </div>

      ${cartoesResumoFinanceiro(resumo)}
      ${resumo.mensalidades && resumo.mensalidades.total > 0 ? `
        <p class="placeholder">As receitas incluem <strong>${formatarMoeda(resumo.mensalidades.total)}</strong> de mensalidades dos <strong>sócios ATPN</strong> (planilha atualizada em ${esc(formatarDataExibicao(resumo.mensalidades.planilhaAtualizadaEm))} + o que a recepção registrou na aba Mensalidades). Entram sozinhas — não aparecem na lista de lançamentos abaixo. Sócios do CEPE não entram no financeiro.
        ${resumo.mensalidades.parcial ? '<strong>Mês parcial:</strong> a planilha ainda não cobre o mês inteiro, o valor sobe quando ela for atualizada.' : ''}</p>`
        : resumo.mensalidades && resumo.mensalidades.semCobertura ? '<p class="placeholder">Antes de 2026 a planilha não cobre o quadro inteiro de sócios, então não há receita de mensalidade nesse período.</p>' : ''}

      ${contasAPagarHtml()}

      <div class="secao">
        <h3>Tendência (últimos 6 meses)</h3>
        ${graficoTendencia(resumo.tendencia)}
      </div>

      <div class="graficos-lado-a-lado">
        <div class="secao">
          <h3>Despesas por categoria</h3>
          ${graficoCategorias(resumo.categoriasDespesas, 'cor-despesa-bg')}
        </div>
        <div class="secao">
          <h3>Receitas por categoria</h3>
          ${graficoCategorias(resumo.categoriasReceitas, 'cor-receita-bg')}
        </div>
      </div>

      <div class="secao">
        <h3>Lançamentos</h3>
        <div class="abas-secundarias">
          <button class="${state.financeiroAba === 'despesas' ? 'ativa' : ''}" data-action="financeiro-aba" data-aba="despesas">Despesas</button>
          <button class="${state.financeiroAba === 'receitas' ? 'ativa' : ''}" data-action="financeiro-aba" data-aba="receitas">Receitas</button>
        </div>
        <div style="overflow-x:auto;"><table class="tabela-lista">
          ${cabecalho}
          <tbody>${linhas}</tbody>
        </table></div>
        <p><strong>Total${ehDespesa ? ' pago' : ''}: ${formatarMoeda(total)}</strong></p>
        ${painelAnexosHtml()}
        ${formHtml}
      </div>`;
  }

  // ---------- tarefas ----------
  const ETAPAS_TAREFA = [
    { id: 'abertura', nome: 'Abertura' },
    { id: 'durante_dia', nome: 'Durante o dia' },
    { id: 'fechamento', nome: 'Fechamento' },
  ];
  const DIAS_SEMANA_NOMES = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

  function hojeStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatarDataExibicao(dataStr) {
    return dataStr.split('-').reverse().join('/');
  }

  function descricaoFrequenciaTarefa(t) {
    if (t.frequencia === 'diaria') return 'Todo dia';
    if (t.frequencia === 'dias_semana') return (t.diasSemana || []).map((d) => DIAS_SEMANA_NOMES[d]).join(', ');
    if (t.frequencia === 'intervalo') return `A cada ${t.intervaloDias} dias`;
    return '';
  }

  function viewCadastroTarefas() {
    if (!state.tarefasCadastroCarregado) return '<div class="secao"><h3>Cadastro de tarefas</h3><p class="placeholder">Carregando…</p></div>';

    const linhas = state.tarefasCadastro.map((t) => `
      <tr>
        <td>${esc(t.titulo)}${t.ativo ? '' : ' <span class="placeholder">(inativa)</span>'}</td>
        <td>${esc(t.cargoNome)}</td>
        <td>${esc(ETAPAS_TAREFA.find((e) => e.id === t.etapa)?.nome || t.etapa)}</td>
        <td>${esc(descricaoFrequenciaTarefa(t))}</td>
        <td><button class="botao-link" data-action="remover-tarefa" data-id="${t.id}">remover</button></td>
      </tr>`).join('') || `<tr><td colspan="5" class="placeholder">Nenhuma tarefa cadastrada.</td></tr>`;

    return `
      <div class="secao">
        <h3>Cadastro de tarefas</h3>
        <table class="tabela-lista">
          <thead><tr><th>Título</th><th>Cargo</th><th>Etapa</th><th>Frequência</th><th></th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>

        <h3 style="margin-top:20px;">Nova tarefa</h3>
        <div class="linha-form">
          <input type="text" id="nova-tarefa-titulo" placeholder="Título" />
          <input type="text" id="nova-tarefa-descricao" placeholder="Descrição (opcional)" />
        </div>

  // ---------- feriados ----------
  // Mesma regra do PDV Jabá (calculados por ano, nada gravado): nacionais, RN e
  // Natal — a ATPN fica em Natal, então os de Parnamirim não entram. Páscoa pelo
  // cálculo gregoriano; Carnaval, Cinzas, Sexta-feira Santa e Corpus Christi
  // derivam dela.
  const ROTULO_FERIADO = { nacional: 'Feriado nacional', estadual: 'Feriado estadual (RN)', municipal: 'Feriado municipal (Natal)', facultativo: 'Ponto facultativo' };
  const _feriadosCache = {};
  function pascoaDoAno(ano) {
    const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
      m = Math.floor((a + 11 * h + 22 * l) / 451), mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(ano, mes - 1, dia);
  }
  function dataLocalStr(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function feriadosDoAno(ano) {
    if (_feriadosCache[ano]) return _feriadosCache[ano];
    const out = {};
    const add = (data, nome, tipo) => { (out[data] = out[data] || []).push({ nome, tipo }); };
    const fixo = (mm, dd, nome, tipo) => add(`${ano}-${mm}-${dd}`, nome, tipo);
    const rel = (dias, nome, tipo) => { const p = pascoaDoAno(ano); p.setDate(p.getDate() + dias); add(dataLocalStr(p), nome, tipo); };
    fixo('01', '01', 'Confraternização Universal', 'nacional');
    fixo('01', '06', 'Santos Reis (Natal)', 'municipal');
    rel(-48, 'Carnaval', 'facultativo'); rel(-47, 'Carnaval', 'facultativo'); rel(-46, 'Quarta-feira de Cinzas (até 14h)', 'facultativo');
    rel(-2, 'Sexta-feira Santa', 'nacional');
    fixo('04', '21', 'Tiradentes', 'nacional');
    fixo('05', '01', 'Dia do Trabalho', 'nacional');
    rel(60, 'Corpus Christi', 'facultativo');
    fixo('09', '07', 'Independência do Brasil', 'nacional');
    fixo('10', '03', 'Mártires de Cunhaú e Uruaçu (RN)', 'estadual');
    fixo('10', '12', 'Nossa Senhora Aparecida', 'nacional');
    fixo('11', '02', 'Finados', 'nacional');
    fixo('11', '15', 'Proclamação da República', 'nacional');
    fixo('11', '20', 'Consciência Negra', 'nacional');
    fixo('11', '21', 'N. Sra. da Apresentação (Natal)', 'municipal');
    fixo('12', '24', 'Véspera de Natal (tarde)', 'facultativo');
    fixo('12', '25', 'Natal', 'nacional');
    fixo('12', '31', 'Véspera de Ano-Novo (tarde)', 'facultativo');
    return (_feriadosCache[ano] = out);
  }
  function feriadosDoDia(dataStr) { return feriadosDoAno(Number(dataStr.slice(0, 4)))[dataStr] || []; }

  // ---------- relatórios ----------
  const REL_CLUBE = { cepe_atpn: 'ATPN', cepe: 'CEPE' };
  const REL_STATUS = { em_dia: 'Em dia', ate_2_meses: 'Até 2 meses', '3_a_5_meses': '3 a 5 meses', '6_meses_ou_mais': '6 meses ou mais', desligado: 'Desligado' };
  const REL_CATEGORIA = { efetivo: 'Efetivo', contribuinte: 'Contribuinte', nao_identificada: 'Não identificada' };
  const NOMES_MES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const idxMes = (ano, mes) => ano * 12 + (mes - 1);

  // Meses da série e quais já "fecharam": a planilha é um retrato de uma data
  // (ex.: 10/11), então o mês dela e os seguintes são PARCIAIS, e o mês logo
  // antes ainda pode estar em cobrança. Totais e comparações só usam meses
  // anteriores ao mês da planilha.
  function relMeses() {
    const m = state.rel.mensal;
    const ref = new Date(`${m.planilhaAtualizadaEm}T12:00:00`);
    const idxRef = idxMes(ref.getFullYear(), ref.getMonth() + 1);
    const vistos = new Map();
    m.serie.forEach((r) => {
      const k = idxMes(r.ano, r.mes);
      if (!vistos.has(k)) vistos.set(k, { ano: r.ano, mes: r.mes, idx: k, arrecadado: 0, pagantes: 0, naoPagaram: 0, especiais: 0 });
      const v = vistos.get(k);
      v.arrecadado += r.arrecadado; v.pagantes += r.pagantes; v.naoPagaram += r.naoPagaram; v.especiais += r.especiais;
    });
    const todos = [...vistos.values()].sort((a, b) => a.idx - b.idx).map((v) => ({ ...v, parcial: v.idx >= idxRef, emCobranca: v.idx === idxRef - 1 }));
    return { todos, fechados: todos.filter((v) => !v.parcial) };
  }

  function relSoma(meses) {
    const s = { arrecadado: 0, pagantes: 0, naoPagaram: 0, n: meses.length };
    meses.forEach((m) => { s.arrecadado += m.arrecadado; s.pagantes += m.pagantes; s.naoPagaram += m.naoPagaram; });
    s.ticket = s.pagantes ? s.arrecadado / s.pagantes : 0;
    s.taxaInad = (s.pagantes + s.naoPagaram) ? s.naoPagaram / (s.pagantes + s.naoPagaram) * 100 : 0;
    return s;
  }

  function relDelta(atual, anterior, inverso) {
    if (anterior == null || !anterior) return '';
    const pct = (atual - anterior) / anterior * 100;
    if (Math.abs(pct) < 0.05) return '<span class="placeholder">= igual ao período anterior</span>';
    const bom = inverso ? pct < 0 : pct > 0;
    return `<span class="${bom ? 'rel-delta-pos' : 'rel-delta-neg'}">${pct > 0 ? '▲' : '▼'} ${Math.abs(pct).toFixed(1).replace('.', ',')}%</span> <span class="placeholder">vs. período anterior</span>`;
  }

  function relPeriodo(meses) {
    const fech = meses.fechados;
    const preset = state.relPeriodo;
    let atual;
    if (preset === 'ano') atual = fech;
    else if (preset === '3m') atual = fech.slice(-3);
    else atual = fech.slice(-1);
    let anterior = null;
    if (preset !== 'ano' && atual.length) {
      const ini = atual[0].idx;
      const ant = fech.filter((m) => m.idx >= ini - atual.length && m.idx < ini);
      if (ant.length === atual.length) anterior = ant;
    }
    return { atual, anterior };
  }

  function relRotuloPeriodo(lista) {
    if (!lista.length) return '—';
    const f = (m) => `${NOMES_MES_CURTO[m.mes - 1]}/${String(m.ano).slice(2)}`;
    return lista.length === 1 ? f(lista[0]) : `${f(lista[0])} a ${f(lista[lista.length - 1])}`;
  }

  function relAbaMensalidades() {
    const meses = relMeses();
    if (!meses.fechados.length) return '<p class="placeholder">Ainda não há mês fechado na planilha.</p>';
    const { atual, anterior } = relPeriodo(meses);
    const S = relSoma(atual);
    const P = anterior ? relSoma(anterior) : null;
    const cartao = (rotulo, valor, sub, classe) => `<div class="cartao-resumo"><span class="cartao-resumo-label">${rotulo}</span><strong class="cartao-resumo-valor ${classe || ''}">${valor}</strong><span class="cartao-resumo-label">${sub || ''}</span></div>`;
    const mediaPag = S.n ? Math.round(S.pagantes / S.n) : 0;
    const maxArr = Math.max(...meses.todos.map((m) => m.arrecadado), 1);
    const barras = meses.todos.map((m) => `
      <div class="rel-barra ${m.parcial ? 'parcial' : ''}" title="${NOMES_MES_CURTO[m.mes - 1]}/${m.ano}: ${formatarMoeda(m.arrecadado)} · ${m.pagantes} pagantes${m.parcial ? ' · mês parcial (planilha de ' + state.rel.mensal.planilhaAtualizadaEm.split('-').reverse().join('/') + ')' : m.emCobranca ? ' · ainda em cobrança' : ''}">
        <div class="rel-barra-fill" style="height:${(m.arrecadado / maxArr * 100).toFixed(1)}%"></div>
      </div>`).join('');
    const rotulos = meses.todos.map((m) => `<span>${NOMES_MES_CURTO[m.mes - 1]}${m.emCobranca ? '*' : ''}</span>`).join('');
    const presetBtn = (id, rot) => `<button class="${state.relPeriodo === id ? 'ativa' : ''}" data-rel="periodo" data-valor="${id}">${rot}</button>`;
    return `
      <div class="abas-secundarias">${presetBtn('ultimo', 'Último mês')}${presetBtn('3m', 'Últimos 3 meses')}${presetBtn('ano', 'Ano 2026')}</div>
      <p class="placeholder">Período: <strong>${esc(relRotuloPeriodo(atual))}</strong>${anterior ? ` · comparado com ${esc(relRotuloPeriodo(anterior))}` : ''}${atual.some((m) => m.emCobranca) ? ' · <strong>inclui um mês ainda em cobrança</strong> (pagamentos podem subir e a inadimplência cair)' : ''}</p>
      <div class="cartoes-resumo">
        ${cartao('Arrecadado (sócios ATPN)', formatarMoeda(S.arrecadado), relDelta(S.arrecadado, P && P.arrecadado), 'cor-receita')}
        ${cartao('Pagantes por mês (média)', mediaPag, P ? relDelta(S.pagantes / S.n, P.pagantes / P.n) : '')}
        ${cartao('Ticket médio', formatarMoeda(S.ticket), P ? relDelta(S.ticket, P.ticket) : '')}
        ${cartao('Inadimplência', S.taxaInad.toFixed(1).replace('.', ',') + '%', P ? relDelta(S.taxaInad, P.taxaInad, true) : 'não pagaram ÷ (pagaram + não pagaram)', S.taxaInad > 8 ? 'cor-atraso' : '')}
      </div>
      <h3>Arrecadação mês a mês — 2026</h3>
      <div class="rel-barras">${barras}</div>
      <div class="rel-barra-rot">${rotulos}</div>
      <p class="placeholder">Barras listradas = mês parcial (a planilha é de ${esc(state.rel.mensal.planilhaAtualizadaEm.split('-').reverse().join('/'))}). * = mês ainda em cobrança, pode subir. Passe o mouse para ver os valores.</p>
      <p class="placeholder">Só sócios da ATPN (os do CEPE ficam apenas na aba Sócios). O valor de cada mês é o da planilha e, quando a planilha não tem o pagamento, o que foi registrado na aba Mensalidades — o mesmo dinheiro nunca conta duas vezes. É por mês de referência da mensalidade. Só 2026: os meses de 2024/2025 existem apenas para quem já saiu e dariam um total falso.</p>`;
  }

  function relBarraH(rotulo, n, max) {
    return `<div class="rel-hbar"><span class="rel-hbar-nome">${esc(rotulo)}</span><div class="rel-hbar-trilho"><div class="rel-hbar-fill" style="width:${max ? (n / max * 100).toFixed(1) : 0}%"></div></div><strong>${n}</strong></div>`;
  }

  function relAbaSocios() {
    const d = state.rel.socios;
    // só ATPN (o servidor já manda só ATPN): dado de sócio do CEPE fica na aba Sócios
    const n = (status) => (d.porStatus.find((r) => r.status === status) || { n: 0 }).n;
    const ativos = ['em_dia', 'ate_2_meses', '3_a_5_meses', '6_meses_ou_mais'].reduce((s, st) => s + n(st), 0);
    const cat = (c) => (d.porCategoria.find((r) => r.categoria === c) || { n: 0 }).n;
    const maxMot = Math.max(...d.motivosDesligamento.map((m) => m.n), 1);
    const maxEsp = Math.max(...d.situacoesEspeciais.map((m) => m.n), 1);
    return `
      <p class="placeholder">Sócios da ATPN — retrato da planilha de ${esc(d.atualizadoEm.split('-').reverse().join('/'))}, mais o que foi recebido na aba Mensalidades.</p>
      <h3>Situação dos sócios</h3>
      <div class="cartoes-resumo">
        <div class="cartao-resumo"><span class="cartao-resumo-label">Ativos</span><strong class="cartao-resumo-valor">${ativos}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Em dia</span><strong class="cartao-resumo-valor cor-receita">${n('em_dia')}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Até 2 meses</span><strong class="cartao-resumo-valor">${n('ate_2_meses')}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">3 a 5 meses</span><strong class="cartao-resumo-valor">${n('3_a_5_meses')}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">6 meses ou mais</span><strong class="cartao-resumo-valor cor-atraso">${n('6_meses_ou_mais')}</strong></div>
        <div class="cartao-resumo"><span class="cartao-resumo-label">Desligados</span><strong class="cartao-resumo-valor">${n('desligado')}</strong></div>
      </div>
      <h3>Ativos por categoria</h3>
      <div style="overflow-x:auto;"><table class="tabela-lista">
        <thead><tr>${Object.values(REL_CATEGORIA).map((c) => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody><tr>${Object.keys(REL_CATEGORIA).map((c) => `<td>${cat(c)}</td>`).join('')}</tr></tbody>
      </table></div>
      <p class="placeholder">"Não identificada" = categoria da planilha que não é efetivo nem contribuinte (alunos, funcionários, convidados etc.).</p>
      ${d.situacoesEspeciais.length ? `<h3>Situações especiais (ativos)</h3>${d.situacoesEspeciais.map((s) => relBarraH(s.situacao, s.n, maxEsp)).join('')}` : ''}
      <h3>Por que saíram (desligados)</h3>
      ${d.motivosDesligamento.map((m) => relBarraH(m.motivo, m.n, maxMot)).join('')}`;
  }

  function relAbaInadimplentes() {
    const l = state.rel.inad;
    const faixaBtn = (v, r) => `<button class="${state.relInadFaixa === v ? 'ativa' : ''}" data-rel="inad-faixa" data-valor="${v}">${r}</button>`;

        <tbody>${linhas}</tbody>
      </table></div>
      <p class="placeholder">Meses em aberto = meses seguidos com valor zero, contando de trás pra frente (mesma regra da planilha). Quem tem "sem margem", INSS, abonado etc. não entra como atraso.</p>`;

  function viewRelatorios() {
    const cab = '<h2>Relatórios</h2>';
    if (state.relErro) return `${cab}<div class="secao"><p>Não foi possível carregar (${esc(state.relErro)}). Isso é falha de carregamento, não "zero". <button class="botao" data-rel="recarregar">Tentar de novo</button></p></div>`;
    if (!state.rel) return `${cab}<p class="placeholder">Carregando…</p>`;

    const corpo = state.relAba === 'socios' ? relAbaSocios() : state.relAba === 'inadimplentes' ? relAbaInadimplentes() : relAbaMensalidades();

  async function carregarInadimplentes() {
    const p = new URLSearchParams();
    if (state.relInadFaixa !== 'todas') p.set('status', state.relInadFaixa);
    state.rel.inad = await api(`/relatorios/inadimplentes?${p.toString()}`);
  }

  async function carregarRelatorios() {
    state.relErro = null;
    try {
      const [socios, mensal] = await Promise.all([api('/relatorios/socios'), api('/relatorios/mensalidades')]);
      state.rel = { socios, mensal, inad: { total: 0, socios: [] } };
      await carregarInadimplentes();
    } catch (err) {
      state.rel = null;
      state.relErro = err.message;
    }
  }

  async function baixarInadimplentesCsv() {
    const p = new URLSearchParams();
    if (state.relInadFaixa !== 'todas') p.set('status', state.relInadFaixa);
    try {
      const resp = await fetch(`${API_BASE}/relatorios/inadimplentes.csv?${p.toString()}`, { headers: { Authorization: `Bearer ${state.token}` } });
      if (!resp.ok) throw new Error('Não foi possível gerar o CSV');
      const url = URL.createObjectURL(await resp.blob());
      const a = document.createElement('a');
      a.href = url; a.download = 'inadimplentes-atpn.csv';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      alert(err.message);
    }
  }

  async function acaoRelatorio(el) {
    const tipo = el.dataset.rel;
    const v = el.dataset.valor;
    if (tipo === 'aba') state.relAba = v;
    else if (tipo === 'periodo') state.relPeriodo = v;
    else if (tipo === 'inad-faixa') { state.relInadFaixa = v; await carregarInadimplentes(); }
    else if (tipo === 'csv') { await baixarInadimplentesCsv(); return; }
    else if (tipo === 'recarregar') { state.rel = null; render(); await carregarRelatorios(); }
    render();
  }

  // ---------- dados da associação e horário ----------
  const NOMES_DIA_LONGO = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  function secaoAssociacaoHtml() {
    const a = state.configAssoc;
    if (!a) return '<div class="secao"><h3>Dados da associação</h3><p>Não foi possível carregar os dados da associação. Isso é falha de carregamento, não "vazio" — recarregue a página antes de salvar.</p></div>';
    const v = a.valor;
    const campo = (id, rotulo, valor, extra) => `<label class="campo-assoc"><span>${rotulo}</span><input id="${id}" value="${esc(valor)}" ${extra || ''} /></label>`;
    const horas = (i, t) => {
      const x = (v.horario.dias[i].turnos || [])[t] || { abre: '', fecha: '' };
      const dis = v.horario.dias[i].fechado ? 'disabled' : '';
      return `<span class="h-turno">
          <input type="time" class="as-h" data-dia="${i}" data-turno="${t}" data-campo="abre" value="${esc(x.abre)}" ${dis} aria-label="Abre ${t + 1}" />
          <span>às</span>
          <input type="time" class="as-h" data-dia="${i}" data-turno="${t}" data-campo="fecha" value="${esc(x.fecha)}" ${dis} aria-label="Fecha ${t + 1}" />
        </span>`;
    };
    const linhasHorario = NOMES_DIA_LONGO.map((nome, i) => `
      <div class="linha-horario">
        <label class="h-dia"><input type="checkbox" class="as-h-fechado" data-dia="${i}" ${v.horario.dias[i].fechado ? 'checked' : ''} /> ${nome} — fechado</label>
        ${horas(i, 0)}${horas(i, 1)}
      </div>`).join('');
    return `
      <div class="secao">
        <h3>Dados da associação</h3>
        <p class="placeholder">${a.configurado ? `Última alteração em ${esc(new Date(a.atualizadoEm).toLocaleString('pt-BR'))}. Versões anteriores ficam no Histórico.` : 'Ainda não preenchido — os campos abaixo são só o ponto de partida.'}</p>
        <div class="grade-assoc">
          ${campo('as-nome', 'Nome da associação', v.nome, 'maxlength="120"')}
          ${campo('as-telefone', 'Telefone', v.telefone, 'maxlength="30" inputmode="tel"')}
          ${campo('as-whatsapp', 'WhatsApp (só números, com DDI+DDD)', v.whatsapp, 'maxlength="20" inputmode="numeric" placeholder="5584999999999"')}
          ${campo('as-email', 'E-mail', v.email, 'maxlength="120" inputmode="email"')}
          ${campo('as-instagram', 'Instagram (link completo)', v.instagram, 'maxlength="200" placeholder="https://www.instagram.com/..."')}
          ${campo('as-endereco', 'Endereço', v.endereco, 'maxlength="250"')}
        </div>
        <h3>Horário de funcionamento</h3>
        <p class="placeholder">Até dois turnos por dia (por exemplo, manhã e noite). Deixe o segundo em branco se só tem um.</p>
        ${linhasHorario}
        <div class="linha-form"><button class="botao" data-assoc="salvar">Salvar dados e horário</button></div>
      </div>`;
  }

  function lerAssociacaoDaTela() {
    const val = (id) => document.getElementById(id).value;
    const dias = NOMES_DIA_LONGO.map((_, i) => {
      const fechado = document.querySelector(`.as-h-fechado[data-dia="${i}"]`).checked;
      const turnos = [0, 1].map((t) => ({
        abre: document.querySelector(`.as-h[data-dia="${i}"][data-turno="${t}"][data-campo="abre"]`).value,
        fecha: document.querySelector(`.as-h[data-dia="${i}"][data-turno="${t}"][data-campo="fecha"]`).value,
      }));
      return { fechado, turnos };
    });
    return {
      nome: val('as-nome'), telefone: val('as-telefone'), whatsapp: val('as-whatsapp'),
      email: val('as-email'), instagram: val('as-instagram'), endereco: val('as-endereco'),
      horario: { dias },
    };
  }

  async function salvarAssociacaoTela() {
    try {
      state.configAssoc = await api('/config/associacao', { method: 'PUT', body: lerAssociacaoDaTela() });
      state.historicoVersoes = null;
      render();
      alert('Dados e horário salvos.');
    } catch (err) {
      alert(err.message);
    }
  }

  // ---------- histórico de versões (só Administrador) ----------
  const HIST_TIPOS = [
    { id: 'associacao', rotulo: 'Dados da associação' },
    { id: 'permissoes', rotulo: 'Permissões por cargo' },
    { id: 'pessoas', rotulo: 'Equipe' },
  ];

  async function carregarHistorico() {
    state.historicoErro = null;
    try {
      state.historicoVersoes = await api(`/historico?tipo=${state.historicoTipo}`);
    } catch (err) {
      state.historicoVersoes = null;
      state.historicoErro = err.message;
    }
    render();
  }

  function viewHistorico() {
    const chips = HIST_TIPOS.map((t) => `<button class="${state.historicoTipo === t.id ? 'ativa' : ''}" data-hist="tipo" data-valor="${t.id}">${t.rotulo}</button>`).join('');
    let corpo;
    if (state.historicoErro) corpo = `<p>Não foi possível carregar (${esc(state.historicoErro)}). Isso é falha de carregamento, não "sem versões". <button class="botao" data-hist="recarregar">Tentar de novo</button></p>`;
    else if (!state.historicoVersoes) corpo = '<p class="placeholder">Carregando…</p>';
    else if (!state.historicoVersoes.length) corpo = '<p class="placeholder">Nenhuma versão guardada ainda. Toda vez que isso for alterado, a versão anterior aparece aqui.</p>';
    else {
      corpo = state.historicoVersoes.map((v, i) => `
        <div class="item-historico">
          <div>
            <strong>${esc(new Date(v.alteradoEm).toLocaleString('pt-BR'))}</strong> <span class="placeholder">por ${esc(v.alteradoPor)}${i === 0 ? ' · alteração mais recente' : ''}</span>
            <div class="placeholder">${esc(v.resumo)}</div>
          </div>
          <button class="botao" data-hist="restaurar" data-valor="${v.id}">Restaurar esta versão</button>
        </div>`).join('');
    }
    return `
      <h2>Histórico de versões</h2>
      <div class="secao">
        <p class="placeholder">Guarda as últimas 50 versões anteriores. "Restaurar" volta ao estado que a pessoa tinha <em>antes</em> daquela alteração, e o estado de agora também fica guardado — dá pra desfazer a restauração. PIN nunca é guardado.</p>
        <div class="abas-secundarias">${chips}</div>
        ${corpo}
      </div>`;
  }

  async function acaoHistorico(el) {
    const tipo = el.dataset.hist;
    if (tipo === 'tipo') {
      state.historicoTipo = el.dataset.valor;
      state.historicoVersoes = null;
      render();
      await carregarHistorico();
    } else if (tipo === 'recarregar') {
      state.historicoVersoes = null;
      render();
      await carregarHistorico();
    } else if (tipo === 'restaurar') {
      if (!confirm('Restaurar esta versão? O estado de agora fica guardado no histórico.')) return;
      try {
        await api(`/historico/${el.dataset.valor}/restaurar`, { method: 'POST' });
        // o que foi restaurado pode mudar a tela de Configurações e as abas do menu
        state.configCarregado = false;
        state.configAssoc = null;
        state.abas = await api('/auth/me/abas');
        await carregarHistorico();
        alert('Versão restaurada.');
      } catch (err) {
        alert(err.message);
      }
    }
  }

  // ---------- mensalidades (recepção: receber, comprovante, estorno) ----------
  const MENS_SITUACAO = {
    pago_planilha: ['Pago', 'cor-receita'], pago_atpn: ['Pago (recebido aqui)', 'cor-receita'],
    aberto: ['Em aberto', 'cor-atraso'], especial: ['Situação especial', ''], sem_lancamento: ['Sem lançamento', 'placeholder'],
  };

  function mensFormValoresIniciais(f) {
    // mês mais antigo em aberto; senão o mês atual
    const aberto = f.meses.find((m) => m.situacao === 'aberto');
    const hoje = new Date();
    const alvo = aberto || f.meses.find((m) => m.ano === hoje.getFullYear() && m.mes === hoje.getMonth() + 1) || f.meses[f.meses.length - 1];
    return { mes: `${alvo.ano}-${alvo.mes}`, valor: f.valorSugerido != null ? String(f.valorSugerido).replace('.', ',') : '', forma: 'Dinheiro', data: dataLocalStr(hoje), obs: '' };
  }

    const f = state.mensFicha;
    if (!f) return '';
    const s = f.socio;
    const ehAdmin = state.usuario.administrador;
    const frm = state.mensForm;
    const abertos = f.meses.filter((m) => m.situacao === 'aberto').length;
    const linhasMeses = f.meses.map((m) => {
      const [rot, cls] = MENS_SITUACAO[m.situacao];

        <td>${esc(p.dataPagamento.split('-').reverse().join('/'))}</td><td>${esc(p.registradoPor || '—')}</td>
        <td style="text-decoration:none;">${p.canceladoEm ? `<span class="placeholder">estornado: ${esc(p.motivoCancelamento || '')}</span>`
          : `<button class="botao-ir" data-mens="comprovante" data-id="${p.id}">comprovante</button>${ehAdmin ? ` <button class="botao-link" data-mens="estornar" data-id="${p.id}">estornar</button>` : ''}`}</td>
      </tr>`).join('') || '<tr><td colspan="6" class="placeholder">Nenhum pagamento registrado aqui para esse sócio.</td></tr>';
    const opcoesMes = f.meses.map((m) => `<option value="${m.ano}-${m.mes}" ${frm.mes === `${m.ano}-${m.mes}` ? 'selected' : ''}>${String(m.mes).padStart(2, '0')}/${m.ano} — ${MENS_SITUACAO[m.situacao][0]}</option>`).join('');
    const opcoesForma = f.formas.map((x) => `<option ${frm.forma === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
    return `
      <div class="secao">
        <h3>${esc(s.nome)}</h3>
        <p class="placeholder">Matrícula ${esc(s.matricula || '—')} · ${esc(s.categoria || 'categoria não identificada')} · ${esc(s.telefone || 'sem telefone')} ·
          situação: <strong>${esc(REL_STATUS[s.status] || s.status)}</strong> · <strong>${abertos}</strong> ${abertos === 1 ? 'mês' : 'meses'} em aberto em 2026</p>

        <div class="grade-assoc">
          <label class="campo-assoc"><span>Mês de referência</span><select id="mf-mes">${opcoesMes}</select></label>
          <label class="campo-assoc"><span>Valor (R$)</span><input id="mf-valor" inputmode="decimal" autocomplete="off" value="${esc(frm.valor)}" /></label>
          <label class="campo-assoc"><span>Forma de pagamento</span><select id="mf-forma">${opcoesForma}</select></label>
          <label class="campo-assoc"><span>Data do pagamento</span><input id="mf-data" type="date" value="${esc(frm.data)}" /></label>
          <label class="campo-assoc"><span>Observação (opcional)</span><input id="mf-obs" maxlength="300" value="${esc(frm.obs)}" /></label>
        </div>
        <div class="linha-form"><button class="botao" data-mens="receber">Registrar recebimento</button></div>
        <h3>Meses de 2026</h3>
        <div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Mês</th><th>Situação</th><th>Valor</th></tr></thead><tbody>${linhasMeses}</tbody></table></div>
        <h3>Pagamentos registrados aqui</h3>
        <div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Mês ref.</th><th>Valor</th><th>Forma</th><th>Pago em</th><th>Por</th><th></th></tr></thead><tbody>${linhasPag}</tbody></table></div>
      </div>`;

  function viewMensalidades() {
    if (state.mensErro) return `<h2>Mensalidades</h2><div class="secao"><p>Não foi possível carregar (${esc(state.mensErro)}). Isso é falha de carregamento, não "nenhum recebimento". <button class="botao" data-mens="recarregar">Tentar de novo</button></p></div>`;
    const res = state.mensResultados.map((s) => `
      <tr class="linha-socio" data-mens="abrir" data-id="${s.id}">
        <td>${esc(s.nome)}</td><td>${esc(s.matricula || '—')}</td><td>${esc(REL_STATUS[s.status] || s.status)}</td><td>${esc(s.telefone || '—')}</td>
      </tr>`).join('');
    const h = state.mensHoje;
    const formasHoje = h ? Object.entries(h.porForma).map(([k, v]) => `${esc(k)}: ${formatarMoeda(v)}`).join(' · ') : '';
    const linhasHoje = h ? h.pagamentos.map((p) => `
      <tr style="${p.canceladoEm ? 'opacity:.55;text-decoration:line-through;' : ''}">
        <td>${esc(p.socioNome)}</td><td>${String(p.mes).padStart(2, '0')}/${p.ano}</td><td>${formatarMoeda(p.valor)}</td><td>${esc(p.forma)}</td><td>${esc(p.registradoPor || '—')}</td>
      </tr>`).join('') : '';
    return `
      <h2>Mensalidades</h2>
      <div class="secao">
        <p class="placeholder">Recepção da ATPN: procure o sócio, confira o que está em aberto e registre o recebimento. Só sócios da <strong>ATPN</strong> (os do CEPE ficam apenas na aba Sócios). O valor entra no fluxo de caixa e no relatório, e a reimportação da planilha não apaga o que foi registrado aqui.</p>
        <input type="text" id="mens-busca" class="busca-socios-grande" placeholder="Nome, matrícula, telefone ou CPF do sócio…" value="${esc(state.mensBusca)}" autocomplete="off" />
        ${state.mensBusca.trim().length >= 2 ? (state.mensResultados.length
          ? `<div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Nome</th><th>Matrícula</th><th>Situação</th><th>Telefone</th></tr></thead><tbody>${res}</tbody></table></div>`
          : '<p class="placeholder">Nenhum sócio ATPN ativo encontrado.</p>') : ''}
      </div>
      ${mensFichaHtml()}

        <h3>Recebido hoje</h3>
        ${!h ? '<p class="placeholder">Carregando…</p>' : `
          <p><strong>${formatarMoeda(h.total)}</strong> <span class="placeholder">${formasHoje ? '· ' + formasHoje : '· nada recebido hoje ainda'}</span></p>
          ${h.pagamentos.length ? `<div style="overflow-x:auto;"><table class="tabela-lista"><thead><tr><th>Sócio</th><th>Mês ref.</th><th>Valor</th><th>Forma</th><th>Por</th></tr></thead><tbody>${linhasHoje}</tbody></table></div>` : ''}`}
      </div>`;

    try { state.mensHoje = await api('/mensalidades/hoje'); state.mensErro = null; } catch (err) { state.mensErro = err.message; }
  }

  let timerBuscaMens = null;
  async function abrirFichaMens(id) {

    state.mensForm = mensFormValoresIniciais(state.mensFicha);

  function lerFormMens() {
    return {
      mes: document.getElementById('mf-mes').value,
      valor: document.getElementById('mf-valor').value,
      forma: document.getElementById('mf-forma').value,
      data: document.getElementById('mf-data').value,

  function imprimirComprovante(c) {
    const brl = (v) => `R$ ${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const dt = (s) => String(s).split('-').reverse().join('/');
    const w = window.open('', '_blank', 'width=520,height=680');
    if (!w) { alert('O navegador bloqueou a janela do comprovante. Permita pop-ups para este site.'); return; }
    w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Comprovante ${c.id}</title>
      <style>body{font-family:system-ui,sans-serif;padding:24px;color:#111} h1{font-size:18px;margin:0 0 2px} .sub{color:#555;font-size:12px;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;font-size:14px} td{padding:6px 0;border-bottom:1px solid #ddd} td:first-child{color:#555;width:42%}
      .v{font-size:22px;font-weight:700;margin:14px 0} .rod{margin-top:22px;font-size:11px;color:#666} .canc{color:#b00;font-weight:700}
      @media print{button{display:none}}</style></head><body>
      <h1>${esc(c.associacao.nome)}</h1>
      <div class="sub">${esc([c.associacao.endereco, c.associacao.telefone].filter(Boolean).join(' · '))}</div>
      <h1>Comprovante de pagamento — mensalidade</h1>
      ${c.canceladoEm ? '<div class="canc">PAGAMENTO ESTORNADO</div>' : ''}
      <div class="v">${esc(brl(c.valor))}</div>
      <table>
        <tr><td>Sócio</td><td>${esc(c.socioNome)}</td></tr>
        <tr><td>Matrícula</td><td>${esc(c.matricula || '—')}</td></tr>
        <tr><td>Mês de referência</td><td>${esc(String(c.mes).padStart(2, '0'))}/${c.ano}</td></tr>
        <tr><td>Forma de pagamento</td><td>${esc(c.forma)}</td></tr>
        <tr><td>Data do pagamento</td><td>${esc(dt(c.dataPagamento))}</td></tr>
        <tr><td>Recebido por</td><td>${esc(c.registradoPor || '—')}</td></tr>
        <tr><td>Nº do registro</td><td>${c.id}</td></tr>
        ${c.observacao ? `<tr><td>Observação</td><td>${esc(c.observacao)}</td></tr>` : ''}
      </table>
      <div class="rod">Este comprovante não é documento fiscal. Emitido em ${esc(new Date().toLocaleString('pt-BR'))}.</div>
      <p><button onclick="window.print()">Imprimir</button></p></body></html>`);
    w.document.close();
  }

  async function acaoMens(el) {
    const tipo = el.dataset.mens;
    try {
      if (tipo === 'recarregar') { state.mensHoje = null; render(); await carregarMensHoje(); render(); return; }
      if (tipo === 'abrir') {
        await abrirFichaMens(Number(el.dataset.id));
        render();
        const campo = document.getElementById('mf-valor');
        if (campo) campo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (tipo === 'comprovante') {
        imprimirComprovante(await api(`/mensalidades/comprovante/${el.dataset.id}`));
        return;
      }
      if (tipo === 'estornar') {
        const motivo = prompt('Motivo do estorno (obrigatório):');
        if (!motivo || motivo.trim().length < 3) { if (motivo !== null) alert('Informe o motivo (pelo menos 3 letras).'); return; }
        await api(`/mensalidades/pagamentos/${el.dataset.id}/estornar`, { method: 'POST', body: { motivo: motivo.trim() } });
      } else if (tipo === 'receber') {
        const f = lerFormMens();
        state.mensForm = f;
        const [ano, mes] = f.mes.split('-').map(Number);
        const valor = parseNumero(f.valor);
        if (!(valor > 0)) { alert('Informe o valor.'); return; }
        const corpo = { socioId: state.mensFicha.socio.id, ano, mes, valor, forma: f.forma, dataPagamento: f.data, observacao: f.obs };
        let pagamento;
        try {
          pagamento = await api('/mensalidades/pagamentos', { method: 'POST', body: corpo });
        } catch (err) {
          if (!err.precisaConfirmar) throw err;
          if (!confirm(err.message)) return;
          pagamento = await api('/mensalidades/pagamentos', { method: 'POST', body: { ...corpo, confirmarParcial: true } });
        }
        state.mensForm = null;
        await abrirFichaMens(state.mensFicha.socio.id);
        await carregarMensHoje();
        render();
        if (confirm('Recebimento registrado. Abrir o comprovante para imprimir?')) imprimirComprovante(await api(`/mensalidades/comprovante/${pagamento.id}`));
        return;
      }
      await abrirFichaMens(state.mensFicha.socio.id);
      await carregarMensHoje();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  // ---------- início ----------
  const ETAPA_LABEL = { abertura: 'Abertura', durante_dia: 'Durante o dia', fechamento: 'Fechamento' };

  function viewInicio() {
    const nome = (state.usuario.nome || '').split(' ')[0];
    const cab = `<h2>Início</h2><p class="placeholder">Olá, ${esc(nome)} — ${esc(new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }))}</p>`;
