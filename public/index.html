  // ---- modal do dia ----
  function diaModalHtml(dataStr) {
    const ehAdmin = state.usuario.administrador;
    const fers = feriadosDoDia(dataStr);
    const eventos = state.calendarioEventos.filter((e) => e.data === dataStr);
    const escs = state.calEscalas.filter((e) => e.data === dataStr);
    const escalaNormal = escs.filter((e) => !e.reservaId);
    const escalaEventos = escs.filter((e) => e.reservaId);
    const reservas = state.calReservas.filter((r) => r.data === dataStr && r.status !== 'recusado');
    const pontos = pontosDoDia(dataStr);
    const escaladas = new Set(escs.map((e) => e.pessoaId));
    const semEscala = [...pontos.entries()].filter(([id]) => !escaladas.has(id));

    const linhaEscala = (e) => {
      const real = e.reservaId && escalaNormal.some((x) => x.pessoaId === e.pessoaId) ? null : pontos.get(e.pessoaId);
      const planejado = faixaHora(e.horaInicio, e.horaFim);
      const pontoTxt = real && real.horas.length ? real.horas.join('–') : null;
      const horarioTxt = planejado || pontoTxt || '?';
      const extra = planejado && pontoTxt ? ` (ponto: ${pontoTxt})` : '';
      return `
        <div class="linha-item"><div><div class="nome">${esc(e.pessoaNome)} <span class="desc">· ${esc(e.cargoNome)}</span></div>
          <div class="desc">Horário: ${esc(horarioTxt)}${esc(extra)}${e.observacao && !e.reservaId ? ' · ' + esc(e.observacao) : ''}</div></div>
          ${ehAdmin ? `<div class="cabecalho-acoes"><button class="botao botao-sec botao-pq" data-m="escala-editar" data-id="${e.id}" title="Editar horário">✎</button><button class="botao botao-perigo botao-pq" data-m="escala-rm" data-id="${e.id}" title="Tirar da escala">✕</button></div>` : ''}</div>`;
    };

    const gruposEvento = new Map();
    escalaEventos.forEach((e) => { if (!gruposEvento.has(e.reservaId)) gruposEvento.set(e.reservaId, []); gruposEvento.get(e.reservaId).push(e); });

    return `
      ${fers.length ? fers.map((f) => `<div class="linha-item"><div><div class="nome">${f.tipo === 'facultativo' ? '' : '🇧🇷 '}${esc(f.nome)}</div><div class="desc">${esc(ROTULO_FERIADO[f.tipo])}</div></div></div>`).join('') : ''}

      <h4>Eventos</h4>
      ${eventos.length ? eventos.map((e) => {
        const daReserva = String(e.id).startsWith('atpn-res-');
        const editavel = ehAdmin && e.proprio && !daReserva;
        return `<div class="linha-item"><div><div class="nome">${esc(e.titulo)} <span class="tag-tipo">${esc(e.origem || '')}</span></div>
          ${e.horaInicio ? `<div class="desc">${esc(faixaHora(e.horaInicio, e.horaFim))}</div>` : ''}
          ${e.observacao ? `<div class="desc">${esc(e.observacao)}</div>` : ''}
          ${daReserva ? '<div class="desc">Vem de uma reserva — edite na aba Eventos.</div>' : ''}</div>
          ${editavel ? `<div class="cabecalho-acoes"><button class="botao botao-sec botao-pq" data-m="evento-editar" data-id="${esc(e.id)}" title="Editar">✎</button><button class="botao botao-perigo botao-pq" data-m="evento-rm" data-id="${esc(e.id)}" title="Apagar">✕</button></div>` : ''}</div>`;
      }).join('') : '<div class="desc">Nenhum evento.</div>'}

      <h4>Escala da equipe</h4>
      ${escalaNormal.length ? escalaNormal.map(linhaEscala).join('') : '<div class="desc">Ninguém escalado.</div>'}

      ${gruposEvento.size ? `<h4>Equipe dos eventos</h4>${[...gruposEvento.entries()].map(([rid, membros]) => `
        <div class="linha-item" style="display:block;"><div class="nome">🎉 ${esc(membros[0].reservaTitulo || 'Evento')}</div>${membros.map(linhaEscala).join('')}</div>`).join('')}` : ''}

      ${reservas.length ? `<h4>Reservas e eventos da ATPN no dia</h4>${reservas.map((r) => `
        <div class="linha-item"><div><div class="nome">${esc(r.titulo)} <span class="tag-tipo">${esc(STATUS_RESERVA[r.status] || r.status)}</span></div>
          <div class="desc">${r.horaInicio ? esc(faixaHora(r.horaInicio, r.horaFim)) + ' · ' : ''}${r.numConvidados ? r.numConvidados + ' pessoas · ' : ''}${(r.equipe || []).length ? 'Equipe: ' + esc(r.equipe.map((p) => p.nome).join(', ')) : 'sem equipe escalada'}</div></div>
          ${ehAdmin ? `<button class="botao botao-sec botao-pq" data-m="equipe" data-id="${r.id}">👥 ${(r.equipe || []).length ? 'Equipe' : 'Escalar equipe'}</button>` : ''}</div>`).join('')}` : ''}

      ${semEscala.length ? `<h4>Bateu ponto sem estar escalado</h4>${semEscala.map(([, p]) => `<div class="linha-item"><div class="nome">${esc(p.nome)}</div><div class="desc">${esc(p.horas.join(', '))}</div></div>`).join('')}` : ''}

      ${ehAdmin ? `<div class="acoes-modal"><button class="botao botao-sec" data-m="novo-evento">+ Evento</button><button class="botao botao-sec" data-m="escalar">+ Escalar</button></div>` : ''}`;
  }

  function abrirDiaModal(dataStr) {
    abrirModal({
      titulo: `${fmtDataBr(dataStr)} — ${new Date(`${dataStr}T12:00:00`).toLocaleDateString('pt-BR', { weekday: 'long' })}`,
      render: () => diaModalHtml(dataStr),
      onClick: (el) => acaoDia(el, dataStr),
    });
  }

  async function acaoDia(el, dataStr) {
    const m = el.dataset.m;
    const id = el.dataset.id;
    try {
      if (m === 'novo-evento') { abrirEventoModal({ data: dataStr }, dataStr); return; }
      if (m === 'escalar') { await abrirEscalarModal(dataStr); return; }
      if (m === 'evento-editar') { abrirEventoModal(state.calendarioEventos.find((e) => e.id === id), dataStr); return; }
      if (m === 'escala-editar') { abrirEscalaEditModal(state.calEscalas.find((e) => String(e.id) === id), dataStr); return; }
      if (m === 'equipe') { await abrirEquipeModal(state.calReservas.find((r) => String(r.id) === id), dataStr); return; }
      if (m === 'evento-rm') {
        if (!await confirma('Apagar esse evento do calendário?', { ok: 'Apagar', perigo: true })) return;
        await api(`/calendario/${encodeURIComponent(id)}`, { method: 'DELETE' });
      } else if (m === 'escala-rm') {
        if (!await confirma('Tirar essa pessoa da escala?', { ok: 'Tirar', perigo: true })) return;
        await api(`/escalas/${id}`, { method: 'DELETE' });
      }
      await recarregarCalendario();
      desenharModal();
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---- evento (novo / editar) ----
  function abrirEventoModal(ev, voltarPara) {
    const e = ev || {};
    const est = { id: e.id || null, data: e.data || dataLocalStr(new Date()), titulo: e.titulo || '', ini: e.horaInicio || '', fim: e.horaFim || '', obs: e.observacao || '' };
    abrirModal({
      titulo: est.id ? 'Editar evento' : 'Novo evento',
      fecharNoFundo: false,
      render: () => `
        <label class="campo"><span>Data</span><input id="ev-data" type="date" value="${esc(est.data)}" /></label>
        <label class="campo"><span>Título</span><input id="ev-titulo" maxlength="120" value="${esc(est.titulo)}" placeholder="Ex.: Assembleia geral" /></label>
        <div class="campo-linha">
          <label class="campo"><span>Hora início (opcional)</span><input id="ev-ini" type="time" value="${esc(est.ini)}" /></label>
          <label class="campo"><span>Hora fim (opcional)</span><input id="ev-fim" type="time" value="${esc(est.fim)}" /></label>
        </div>
        <label class="campo"><span>Observação (opcional)</span><input id="ev-obs" maxlength="300" value="${esc(est.obs)}" /></label>
        <div class="acoes-modal"><button class="botao" data-m="salvar">Salvar</button><button class="botao botao-sec" data-m="cancelar">Cancelar</button></div>`,
      onInput: (c) => {
        const mapa = { 'ev-data': 'data', 'ev-titulo': 'titulo', 'ev-ini': 'ini', 'ev-fim': 'fim', 'ev-obs': 'obs' };
        if (mapa[c.id]) est[mapa[c.id]] = c.value;
      },
      onClick: async (el) => {
        if (el.dataset.m === 'cancelar') { voltarPara ? abrirDiaModal(voltarPara) : fecharModal(); return; }
        if (!est.data || !est.titulo.trim()) { avisar('Preencha pelo menos a data e o título.'); return; }
        if (est.ini && est.fim && est.fim < est.ini) { avisar('A hora fim precisa ser depois da hora início.'); return; }
        try {
          const corpo = { data: est.data, titulo: est.titulo.trim(), horaInicio: est.ini || null, horaFim: est.fim || null, observacao: est.obs.trim() || null };
          if (est.id) await api(`/calendario/${encodeURIComponent(est.id)}`, { method: 'PUT', body: corpo });
          else await api('/calendario', { method: 'POST', body: { id: uid(), tipo: 'evento', ...corpo } });
          await recarregarCalendario();
          voltarPara ? abrirDiaModal(est.data) : fecharModal();
        } catch (err) { avisar(err.message); }
      },
    });
  }

  // ---- escalar alguém (vários dias de uma vez) ----
  async function abrirEscalarModal(dataInicial) {
    const pessoas = await api('/escalas/pessoas');
    const d0 = dataInicial || dataLocalStr(new Date());
    const est = { datas: new Set(dataInicial ? [dataInicial] : []), mes: d0.slice(0, 7), pessoaId: '', ini: '', fim: '' };
    const hoje = dataLocalStr(new Date());
    const grade = () => {
      const [a, m] = est.mes.split('-').map(Number);
      const dias = new Date(a, m, 0).getDate();
      const vazias = new Date(a, m - 1, 1).getDay();
      let h = '<div></div>'.repeat(vazias);
      for (let d = 1; d <= dias; d++) {
        const ds = `${est.mes}-${String(d).padStart(2, '0')}`;
        h += `<button type="button" class="esc-dia ${est.datas.has(ds) ? 'sel' : ''} ${ds === hoje ? 'hoje' : ''}" data-m="dia" data-data="${ds}">${d}</button>`;
      }
      return h;
    };
    const rotuloMes = () => { const [a, m] = est.mes.split('-').map(Number); const t = new Date(a, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };
    const mudarMes = (delta) => { const [a, m] = est.mes.split('-').map(Number); const d = new Date(a, m - 1 + delta, 1); est.mes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
    abrirModal({
      titulo: 'Escalar alguém',
      fecharNoFundo: false,
      render: () => {
        const ord = [...est.datas].sort();
        return `
          <div class="campo"><span>Dias (clique para marcar vários)</span>
            <div class="nav-mes" style="justify-content:center;margin-bottom:6px;">
              <button type="button" class="botao botao-sec botao-pq" data-m="mes-ant" aria-label="Mês anterior">←</button>
              <span class="mes-rotulo">${esc(rotuloMes())}</span>
              <button type="button" class="botao botao-sec botao-pq" data-m="mes-seg" aria-label="Próximo mês">→</button>
            </div>
            <div class="esc-grid esc-grid-head">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((x) => `<div>${x}</div>`).join('')}</div>
            <div class="esc-grid">${grade()}</div>
            <div style="margin-top:6px;font-size:.85rem;color:var(--texto);">${ord.length
              ? `<strong>${ord.length} dia${ord.length > 1 ? 's' : ''}:</strong> ${esc(ord.map((d) => d.slice(8, 10) + '/' + d.slice(5, 7)).join(', '))} <button type="button" class="botao botao-sec botao-pq" data-m="limpar">Limpar</button>`
              : '<span class="placeholder">Clique nos dias para marcar.</span>'}</div>
          </div>
          <label class="campo"><span>Funcionário</span>
            <select id="esc-pessoa"><option value="">— selecione —</option>${pessoas.map((p) => `<option value="${p.id}" ${String(p.id) === String(est.pessoaId) ? 'selected' : ''}>${esc(p.nome)} (${esc(p.cargoNome)})</option>`).join('')}</select></label>
          <div class="campo-linha">
            <label class="campo"><span>Hora início (opcional)</span><input id="esc-ini" type="time" value="${esc(est.ini)}" /></label>
            <label class="campo"><span>Hora fim (opcional)</span><input id="esc-fim" type="time" value="${esc(est.fim)}" /></label>
          </div>
          <div class="acoes-modal"><button class="botao" data-m="salvar">Salvar</button><button class="botao botao-sec" data-m="cancelar">Cancelar</button></div>`;
      },
      onInput: (c) => { if (c.id === 'esc-ini') est.ini = c.value; if (c.id === 'esc-fim') est.fim = c.value; },
      onMudou: (c) => { if (c.id === 'esc-pessoa') est.pessoaId = c.value; },
      onClick: async (el) => {
        const m = el.dataset.m;
        if (m === 'dia') { const d = el.dataset.data; if (est.datas.has(d)) est.datas.delete(d); else est.datas.add(d); desenharModal(); return; }
        if (m === 'mes-ant') { mudarMes(-1); desenharModal(); return; }
        if (m === 'mes-seg') { mudarMes(1); desenharModal(); return; }
        if (m === 'limpar') { est.datas.clear(); desenharModal(); return; }
        if (m === 'cancelar') { dataInicial ? abrirDiaModal(dataInicial) : fecharModal(); return; }
        if (!est.datas.size || !est.pessoaId) { avisar('Marque pelo menos um dia e escolha o funcionário.'); return; }
        if (est.ini && est.fim && est.fim < est.ini) { avisar('A hora fim precisa ser depois da hora início.'); return; }
        try {
          const r = await api('/escalas/lote', { method: 'POST', body: { pessoaId: Number(est.pessoaId), datas: [...est.datas].sort(), horaInicio: est.ini || null, horaFim: est.fim || null } });
          const nome = (pessoas.find((p) => String(p.id) === String(est.pessoaId)) || {}).nome || 'Pessoa';
          await recarregarCalendario();
          dataInicial ? abrirDiaModal(dataInicial) : fecharModal();
          if (r.puladas.length) await avisar(`${nome} escalado(a) em ${r.criadas.length} dia(s). ${r.puladas.length} já estava(m) na escala e foi(ram) pulado(s): ${r.puladas.map((d) => d.slice(8, 10) + '/' + d.slice(5, 7)).join(', ')}.`);
        } catch (err) { avisar(err.message); }
      },
    });
  }

        <div class="campo-linha">
          <label class="campo"><span>Entrada</span><input id="ee-ini" type="time" value="${esc(est.ini)}" /></label>
          <label class="campo"><span>Saída</span><input id="ee-fim" type="time" value="${esc(est.fim)}" /></label>
        </div>
        <label class="campo"><span>Observação (opcional)</span><input id="ee-obs" maxlength="300" value="${esc(est.obs)}" /></label>

      onClick: async (el) => {
        if (el.dataset.m === 'cancelar') { abrirDiaModal(voltarPara); return; }

        try {

          await recarregarCalendario();
          abrirDiaModal(voltarPara);
        } catch (err) { avisar(err.message); }

  // ---- equipe de um evento/reserva ----
  async function abrirEquipeModal(reserva, voltarPara) {
    if (!reserva) return;
    const pessoas = await api('/escalas/pessoas');
    const sel = new Set((reserva.equipe || []).map((p) => p.pessoaId));
    abrirModal({
      titulo: 'Escalar equipe',
      fecharNoFundo: false,
      render: () => `
        <p><strong>${esc(reserva.titulo)}</strong><br><span class="placeholder">📅 ${esc(fmtDataBr(reserva.data))}${reserva.horaInicio ? ' às ' + esc(reserva.horaInicio) : ''}${reserva.numConvidados ? ' · 👥 ' + reserva.numConvidados + ' pessoas' : ''}</span></p>
        <p class="placeholder">Quem trabalha nesse evento. Cada pessoa aparece na escala do calendário nesse dia.</p>
        <div class="pilulas-escolha">${pessoas.map((p) => `<button type="button" class="pilula ${sel.has(p.id) ? 'sel' : ''}" data-m="pessoa" data-id="${p.id}">${esc(p.nome)}</button>`).join('') || '<span class="placeholder">Ninguém na equipe ainda.</span>'}</div>
        <div class="acoes-modal"><button class="botao" data-m="salvar">Salvar equipe</button><button class="botao botao-sec" data-m="cancelar">Cancelar</button></div>`,
      onClick: async (el) => {
        const m = el.dataset.m;
        if (m === 'pessoa') { const id = Number(el.dataset.id); if (sel.has(id)) sel.delete(id); else sel.add(id); desenharModal(); return; }
        if (m === 'cancelar') { voltarPara ? abrirDiaModal(voltarPara) : fecharModal(); return; }
        try {
          await api(`/escalas/reserva/${reserva.id}`, { method: 'PUT', body: { pessoaIds: [...sel] } });
          await recarregarCalendario();
          if (state.reservas) { await carregarReservas(); render(); } // a aba Eventos mostra a equipe de cada reserva
          voltarPara ? abrirDiaModal(voltarPara) : fecharModal();
        } catch (err) { avisar(err.message); }
      },
    });
  }

  // ---- carregar / navegar ----
  async function carregarCalendario() {
    state.calendarioErro = null;
    // pode ser chamado de outra aba (ex.: salvar equipe de uma reserva) antes de o calendário ser aberto
    if (!state.calendarioMesRef) state.calendarioMesRef = refMesAtual();
    const { inicio, fim } = limitesMes(state.calendarioMesRef);
    try {
      const [cal, escalas, pontos, reservas] = await Promise.all([
        api(`/calendario?inicio=${inicio}&fim=${fim}`),
        api(`/escalas?inicio=${inicio}&fim=${fim}`),
        api(`/ponto?inicio=${inicio}&fim=${fim}`).catch(() => []), // sem a aba Ponto, só não mostra o ponto
        api('/reservas?filtro=todas&semConflitos=1').then((r) => r.reservas).catch(() => []),
      ]);
      state.calendarioConfigurado = cal.configurado;
      state.calendarioEventos = cal.eventos;
      state.calEscalas = escalas;
      state.calPontos = pontos;
      state.calReservas = reservas;
    } catch (err) {
      state.calendarioErro = err.message;
    }
  }

  async function recarregarCalendario() {
    await carregarCalendario();
    render();
  }

  async function mudarMesCalendario(delta) {
    let { ano, mes } = state.calendarioMesRef;
    mes += delta;
    if (mes < 0) { mes = 11; ano -= 1; } else if (mes > 11) { mes = 0; ano += 1; }
    state.calendarioMesRef = { ano, mes };
    await recarregarCalendario();
  }

  async function acaoCalendario(el) {
    const a = el.dataset.cal;
    try {
      if (a === 'mes-ant') await mudarMesCalendario(-1);
      else if (a === 'mes-seg') await mudarMesCalendario(1);
      else if (a === 'recarregar') await recarregarCalendario();
      else if (a === 'dia') abrirDiaModal(el.dataset.data);
      else if (a === 'novo-evento') abrirEventoModal({ data: dataLocalStr(new Date()) }, null);
      else if (a === 'escalar') await abrirEscalarModal(null);
    } catch (err) { avisar(err.message); }
  }

  function resumoAgregadoSocios(resumo) {
    // Total = aba ATIVO GERAL (é o que a planilha conta: 403 na ATPN, com os desativados/rosa dentro).
    // Quem está na aba DESLIGADOS já saiu e vem separado.
    const soma = { total: 0, emDia: 0, atrasados: 0, desligados: 0, saiu: 0, ate2: 0, de3a5: 0, seis: 0 };
    resumo.forEach((r) => {
      if (r.origem === 'desligados') { soma.saiu += r.total; return; }
      soma.total += r.total;
      if (r.status === 'em_dia') soma.emDia += r.total;
      else if (r.status === 'desligado') soma.desligados += r.total;
      else {
        soma.atrasados += r.total;
        if (r.status === 'ate_2_meses') soma.ate2 += r.total;
        else if (r.status === '3_a_5_meses') soma.de3a5 += r.total;
        else if (r.status === '6_meses_ou_mais') soma.seis += r.total;
      }
    });
    return soma;
  }

        if (aba) aba.permitido = el.checked;

    document.querySelectorAll('[data-rel]').forEach((el) => {

    document.querySelectorAll('[data-action="remover-tarefa"]').forEach((el) => {
      el.addEventListener('click', () => removerTarefa(Number(el.dataset.id)));
    });

    document.querySelectorAll('[data-cal]').forEach((el) => {
      el.addEventListener('click', () => acaoCalendario(el));
      // célula do dia é role="button": Enter/Espaço também abrem
      if (el.dataset.cal === 'dia') el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); acaoCalendario(el); } });
    });

    const campoBuscaSocios = document.getElementById('busca-socios');
    if (campoBuscaSocios) campoBuscaSocios.addEventListener('input', (e) => {
      const cursor = e.target.selectionStart;
      state.sociosBusca = e.target.value;
      clearTimeout(timerBuscaSocios);
      timerBuscaSocios = setTimeout(async () => {
        await carregarSocios();
        render();
        const campoNovo = document.getElementById('busca-socios');
        if (campoNovo) { campoNovo.focus(); campoNovo.setSelectionRange(cursor, cursor); }
      }, 300);
    });

    document.querySelectorAll('[data-action="filtro-socio-clube"]').forEach((el) => {
      el.addEventListener('click', () => filtrarSociosClube(el.dataset.clube));
    });

    document.querySelectorAll('[data-action="filtro-socio-status"]').forEach((el) => {
      el.addEventListener('click', () => filtrarSociosStatus(el.dataset.status));
    });

    document.querySelectorAll('[data-action="toggle-socio"]').forEach((el) => {
      el.addEventListener('click', () => toggleSocio(Number(el.dataset.id)));
    });
  }

  // ---------- login ----------
  function pressLoginKey(k) {
    if (k === 'clear') state.pin = '';
    else if (k === 'back') state.pin = state.pin.slice(0, -1);
    else if (state.pin.length < 4) state.pin += k;

    if (state.pin.length === 4) { tryLogin(); return; }
    render();
  }

  async function mudarCargo(cargoId) {
    state.cargoSelecionado = cargoId;
    state.pessoaSelecionada = null;
    await carregarPessoasDoCargo();
    render();
  }

  async function carregarCargos() {
    state.cargos = await api('/auth/cargos');
    const lembrado = Number(localStorage.getItem('ultimoCargoId'));
    state.cargoSelecionado = state.cargos.some((c) => c.id === lembrado) ? lembrado : state.cargos[0]?.id ?? null;
    await carregarPessoasDoCargo();
  }

  async function carregarPessoasDoCargo() {
    if (!state.cargoSelecionado) { state.pessoasDoCargo = []; return; }
    state.pessoasDoCargo = await api(`/auth/pessoas?cargoId=${state.cargoSelecionado}`);
    const lembrada = Number(localStorage.getItem('ultimaPessoaId'));
    state.pessoaSelecionada = state.pessoasDoCargo.some((p) => p.id === lembrada)
      ? lembrada
      : state.pessoasDoCargo[0]?.id ?? null;
  }

  async function tryLogin() {
    if (!state.pessoaSelecionada) { state.pin = ''; render(); return; }
    try {
      const body = { pessoaId: state.pessoaSelecionada, pin: state.pin };
      const resposta = await api('/auth/login', { method: 'POST', body });

      localStorage.setItem('token', resposta.token);
      localStorage.setItem('ultimoCargoId', String(state.cargoSelecionado));
      localStorage.setItem('ultimaPessoaId', String(state.pessoaSelecionada));
      state.token = resposta.token;
      state.usuario = resposta.usuario;
      await entrarNoApp();
    } catch (err) {
      state.erroLogin = err.message;
      state.pin = '';
      render();
    }
  }

    localStorage.removeItem('token');

  // ---------- shell ----------
  function toggleSidebar() {
    state.sidebarColapsada = !state.sidebarColapsada;
    localStorage.setItem('sidebarColapsada', state.sidebarColapsada ? '1' : '0');
    render();
  }

  function toggleTema() {
    const novo = temaEscuroAgora() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', novo);
    localStorage.setItem('tema', novo);
    state.tema = novo;
    render();

  async function entrarNoApp() {
    if (localStorage.getItem('sidebarColapsada') === null) {
      state.sidebarColapsada = ehMobile();
    }
    state.abas = await api('/auth/me/abas');
    const primeira = state.abas[0]?.id ?? (state.usuario.administrador ? 'config' : null);
    await abrirAba(primeira);
    carregarBadges();
    clearInterval(state.timerBadges);
    state.timerBadges = setInterval(() => { if (state.usuario && !document.hidden) carregarBadges(); }, 120000);
  }

  async function abrirAba(id) {
    if (!id) return;
    state.abaAtual = id;
    if (id === 'inicio') {
      // sempre recarrega: o Início é o retrato do momento
      state.inicioErro = null;
      state.iniMsg = null;
      render();
      await carregarInicio();
    }
    if (id === 'mensalidades') {
      state.mensHoje = null;
      state.mensFicha = null;
      state.mensBusca = '';
      state.mensResultados = [];
      render();
      await carregarMensHoje();
      render();
      const campo = document.getElementById('mens-busca');
      if (campo) campo.focus();
    }
    if (id === 'historico') {
      state.historicoVersoes = null;
      state.historicoErro = null;
      render();
      await carregarHistorico();
    }
    if (id === 'relatorios') {
      // sempre recarrega: relatório é o retrato do momento
      state.rel = null;
      render();
      await carregarRelatorios();
    }
    if (id === 'equipe') {
      state.equipeLista = null;
      render();
      await carregarEquipeAba();
    }
    if (id === 'config' && !state.configCarregado) {
      render();
      await carregarConfiguracoes();
      state.configCarregado = true;
    }
    if (id === 'ponto') {
      // sempre recarrega: o ponto é o retrato do momento
      state.pontoCarregado = false;
      state.pontoMsg = null;
      render();
      await carregarPonto();
      await carregarStatusPonto();
      state.pontoCarregado = true;
    }
    if (id === 'fluxo_caixa' && !state.financeiroCarregado) {
      render();
      if (!state.financeiroMesRef) state.financeiroMesRef = refMesAtual();
      await carregarFinanceiro();
      state.financeiroCarregado = true;
    }
    if (id === 'tarefas' && !state.tarefasCarregado) {
      render();
      if (!state.tarefasData) state.tarefasData = hojeStr();
      const pendentes = [carregarTarefas()];
      if (state.usuario.administrador) pendentes.push(carregarTarefasCadastro());
      await Promise.all(pendentes);
      state.tarefasCarregado = true;
      if (state.usuario.administrador) state.tarefasCadastroCarregado = true;
    }
    if (id === 'calendario') {
      // sempre recarrega: outra pessoa pode ter escalado/criado evento desde a última visita
      state.calendarioCarregado = false;
      render();
      if (!state.calendarioMesRef) state.calendarioMesRef = refMesAtual();
      await carregarCalendario();
      state.calendarioCarregado = true;
    }
    if (id === 'eventos') {
      state.reservas = null;
      state.eventosCarregado = false;
      render();
      await Promise.all([carregarReservas(), carregarAgenda90()]);
    }
    if (id === 'socios' && !state.sociosCarregado) {
      render();
      await Promise.all([carregarSocios(), carregarResumoSocios()]);
      state.sociosCarregado = true;
    }
    render();
    if (id === 'socios') {
      const campo = document.getElementById('busca-socios');
      if (campo) campo.focus();
    }
  }

  // ---------- equipe (igual à aba Equipe do PDV: cartões, papel, PIN oculto, editar) ----------

      state.configCargos = cargos;

  function abrirPessoaModal(pessoa) {
    const e = pessoa || {};
    const est = { nome: e.nome || '', cargoId: e.cargoId || (state.configCargos.find((c) => !c.administrador) || state.configCargos[0] || {}).id, pin: '' };
    abrirModal({
      titulo: e.id ? 'Editar pessoa' : 'Nova pessoa',
      fecharNoFundo: false,
      render: () => `
        <label class="campo"><span>Nome (aparece na tela de login)</span><input id="eqm-nome" maxlength="80" value="${esc(est.nome)}" placeholder="Ex.: João" /></label>
        <label class="campo"><span>Cargo</span><select id="eqm-cargo">${state.configCargos.map((c) => `<option value="${c.id}" ${c.id === est.cargoId ? 'selected' : ''}>${esc(c.nome)}${c.administrador ? ' (irrestrito)' : ''}</option>`).join('')}</select></label>
        <label class="campo"><span>${e.id ? 'Novo PIN (deixe vazio para manter)' : 'PIN (4 números)'}</span><input id="eqm-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="0000" value="${esc(est.pin)}" /></label>
        ${e.id ? '<p class="placeholder">Mudança de cargo ou desativação vale na hora, mesmo para quem já está logado.</p>' : ''}
        <div class="acoes-modal"><button class="botao" data-m="salvar">Salvar</button><button class="botao botao-sec" data-m="cancelar">Cancelar</button></div>`,
      onInput: (c) => { if (c.id === 'eqm-nome') est.nome = c.value; else if (c.id === 'eqm-pin') est.pin = c.value; },
      onMudou: (c) => { if (c.id === 'eqm-cargo') est.cargoId = Number(c.value); },
      onClick: async (el) => {
        if (el.dataset.m === 'cancelar') { fecharModal(); return; }
        const nome = est.nome.trim();
        if (!nome) { avisar('Digite o nome.'); return; }
        if (est.pin && !/^\d{4}$/.test(est.pin)) { avisar('O PIN precisa ter exatamente 4 números.'); return; }
        try {
          if (e.id) {
            await api(`/config/equipe/${e.id}`, { method: 'PUT', body: { nome, cargoId: est.cargoId } });
            if (est.pin) await api(`/config/equipe/${e.id}/pin`, { method: 'PUT', body: { pin: est.pin } });
          } else {
            if (!est.pin) { avisar('Defina um PIN de 4 números.'); return; }
            await api('/config/equipe', { method: 'POST', body: { nome, cargoId: est.cargoId, pin: est.pin } });
          }
          fecharModal();
          state.configCarregado = false; // a tela Configurações relê a equipe
          await carregarEquipeAba();
        } catch (err) { avisar(err.message); }
      },
    });
  }

  async function acaoEquipeAba(el) {
    const tipo = el.dataset.eq;
    const id = Number(el.dataset.id);
    try {
      if (tipo === 'nova') { abrirPessoaModal(null); return; }
      if (tipo === 'recarregar') { state.equipeLista = null; render(); await carregarEquipeAba(); return; }
      const p = (state.equipeLista || []).find((x) => x.id === id);
      if (tipo === 'editar') { abrirPessoaModal(p); return; }
      if (tipo === 'ativo') {
        const desativando = el.dataset.ativo === '0';
        if (desativando && !await confirma(`Desativar ${p ? p.nome : 'essa pessoa'}? Ela perde o acesso na hora (o histórico fica).`, { ok: 'Desativar', perigo: true })) return;
        await api(`/config/equipe/${id}`, { method: 'PUT', body: { ativo: !desativando } });
        state.configCarregado = false;
        await carregarEquipeAba();
      }
    } catch (err) { avisar(err.message); }
  }

  // ---------- configurações ----------
  async function acaoEquipe(btn) {
    const tipo = btn.dataset.equipe;
    const linha = btn.closest('tr');
    try {
      if (tipo === 'novo') {
        const nome = document.getElementById('eq-novo-nome').value.trim();
        const cargoId = Number(document.getElementById('eq-novo-cargo').value);
        const pin = document.getElementById('eq-novo-pin').value;
        if (!nome) { avisar('Digite o nome.'); return; }
        if (!/^\d{4}$/.test(pin)) { avisar('O PIN precisa ter exatamente 4 números.'); return; }
        await api('/config/equipe', { method: 'POST', body: { nome, cargoId, pin } });
      } else if (tipo === 'salvar') {
        await api(`/config/equipe/${btn.dataset.id}`, { method: 'PUT', body: {
          nome: linha.querySelector('.eq-nome').value.trim(),
          cargoId: Number(linha.querySelector('.eq-cargo').value),
        } });
      } else if (tipo === 'ativo') {
        const desativando = btn.dataset.ativo === '0';
        if (desativando && !await confirma('Desativar essa pessoa? Ela perde o acesso na hora (o histórico fica).')) return;
        await api(`/config/equipe/${btn.dataset.id}`, { method: 'PUT', body: { ativo: !desativando } });
      } else if (tipo === 'pin') {
        const pin = linha.querySelector('.eq-pin').value;
        if (!/^\d{4}$/.test(pin)) { avisar('O PIN precisa ter exatamente 4 números.'); return; }
        await api(`/config/equipe/${btn.dataset.id}/pin`, { method: 'PUT', body: { pin } });
        avisar('PIN trocado.');
      }
      state.configEquipe = await api('/config/equipe');
      render();
    } catch (err) {
      avisar(err.message);
    }
  }

    const [cargos, permissoes, equipe, assoc] = await Promise.all([
      api('/config/cargos'),
      api('/config/permissoes'),
      api('/config/equipe'),
      api('/config/associacao').catch(() => null), // falha NÃO vira formulário vazio: a tela avisa e não deixa salvar
    ]);
    state.configAssoc = assoc;
    state.configEquipe = equipe;
    state.configCargos = cargos;

  async function adicionarCargo() {
    const campo = document.getElementById('novo-cargo-nome');
    if (!campo.value.trim()) return;
    await api('/config/cargos', { method: 'POST', body: { nome: campo.value.trim() } });

    state.configCargos = await api('/config/cargos');
    state.configMatriz = permissoes.matriz;

  async function salvarPermissoes() {
    const itens = [];
    state.configMatriz.forEach((linha) => {

    await api('/config/permissoes', { method: 'PUT', body: { itens } });
  }

  // Reduz foto de celular (4–8 MB) para ~1600px/JPEG antes de enviar: menos
  // dado trafegando e guardado, e a leitura da nota continua nítida.
  async function reduzirImagem(file) {
    if (file.type === 'application/pdf') return { blob: file, mime: 'application/pdf' };
    try {
      const url = URL.createObjectURL(file);
      const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
      const maxLado = 1600;
      const escala = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * escala); c.height = Math.round(img.naturalHeight * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.82));
      if (blob) return { blob, mime: 'image/jpeg' };
    } catch (e) { /* cai pro arquivo original */ }
    if (['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return { blob: file, mime: file.type };
    throw new Error('Formato não suportado — use foto (JPG/PNG/WEBP) ou PDF');
  }

  async function adicionarArquivosDespesa(files, autoLer) {
    if (!files.length) return;
    if (!state.despForm) state.despForm = novaDespForm();
    lerDespFormDoDom();
    const f = state.despForm;
    for (const file of files) {
      if (f.arquivos.length >= MAX_ARQUIVOS) { avisar(`Máximo de ${MAX_ARQUIVOS} anexos por despesa.`); break; }
      try {
        const { blob, mime } = await reduzirImagem(file);
        if (blob.size > 8 * 1024 * 1024) { avisar(`"${file.name}" tem mais de 8 MB.`); continue; }
        f.arquivos.push({ nome: file.name, mime, blob, url: mime === 'application/pdf' ? null : URL.createObjectURL(blob) });
      } catch (err) { avisar(err.message); }
    }
    render();
    if (autoLer && state.leituraNotaConfigurada && f.arquivos.length) await lerPelaIA();
    else if (autoLer && !state.leituraNotaConfigurada && f.arquivos.length) { f.aviso = 'Foto anexada. A leitura automática não está ativada neste servidor — preencha os campos digitando.'; render(); }
  }

  function aplicarRascunhoIA(f, r) {
    const hoje = dataLocalStr(new Date());
    if (r.tipo) f.tipo = r.tipo;
    if (r.fornecedor) f.fornecedor = r.fornecedor;
    if (r.descricao) f.descricao = r.descricao;
    if (r.valor) f.valor = String(r.valor).replace('.', ',');
    if (r.categoria) f.categoria = r.categoria;
    if (r.formaPagamento) f.forma = r.formaPagamento;
    const aPagar = !r.jaPago && (r.vencimento || r.tipo === 'boleto' || r.tipo === 'conta');
    if (aPagar) { f.pago = false; f.data = r.vencimento || hoje; }
    else { f.pago = true; f.data = r.dataEmissao && r.dataEmissao <= hoje ? r.dataEmissao : hoje; }
    if (r.linhaDigitavel) f.obs = `${f.obs ? f.obs + ' · ' : ''}Linha digitável: ${r.linhaDigitavel}`;
    f.aviso = '✨ Dados lidos pela IA a partir da foto — confira tudo antes de salvar (valor, data e vencimento principalmente).';
  }

  async function lerPelaIA() {
    const f = state.despForm;
    const arq = f && f.arquivos[0];
    if (!arq) { avisar('Anexe uma foto primeiro.'); return; }
    lerDespFormDoDom();
    f.lendo = true; f.aviso = '';
    render();
    try {
      const resp = await fetch(`${API_BASE}/financeiro/despesas/ler-nota`, {
        method: 'POST', headers: { 'Content-Type': arq.mime, Authorization: `Bearer ${state.token}` }, body: arq.blob,
      });
      const dado = await resp.json().catch(() => ({}));
      if (!resp.ok) f.aviso = dado.erro || 'Não deu pra ler a foto agora. Preencha digitando.';
      else aplicarRascunhoIA(f, dado.rascunho);
    } catch (err) {
      f.aviso = 'Não deu pra ler a foto agora. Preencha digitando.';
    }
    f.lendo = false;
    render();
  }

  async function enviarAnexo(despesaId, arq) {
    const resp = await fetch(`${API_BASE}/financeiro/despesas/${despesaId}/anexos`, {
      method: 'POST', headers: { 'Content-Type': arq.mime, Authorization: `Bearer ${state.token}` }, body: arq.blob,
    });
    if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(d.erro || 'falha ao enviar anexo'); }
  }

  async function salvarDespesa() {
    lerDespFormDoDom();
    const f = state.despForm;
    const valor = parseNumero(f.valor);
    if (!f.descricao.trim() || !f.data || !(valor > 0)) { avisar('Preencha descrição, data e um valor maior que zero.'); return; }
    if (!f.pago && f.data < dataLocalStr(new Date()) && !await confirma('O vencimento já passou. Registrar mesmo assim como conta a pagar (vencida)?')) return;
    const corpo = {
      data: f.data, descricao: f.descricao.trim(), fornecedor: f.fornecedor.trim() || null, categoria: f.categoria.trim() || null,
      valor, formaPagamento: f.forma || null, tipo: f.tipo, pago: f.pago, observacao: f.obs.trim() || null,
    };
    try {
      const r = await api(f.id ? `/financeiro/despesas/${f.id}` : '/financeiro/despesas', { method: f.id ? 'PUT' : 'POST', body: corpo });
      const despesaId = f.id || r.id;
      const falhas = [];
      for (const arq of f.arquivos) {
        try { await enviarAnexo(despesaId, arq); } catch (err) { falhas.push(`${arq.nome}: ${err.message}`); }
      }
      f.arquivos.forEach((a) => a.url && URL.revokeObjectURL(a.url));
      state.despForm = null;
      await carregarFinanceiro();
      render();
      if (falhas.length) avisar(`Despesa salva, mas não consegui anexar:\n${falhas.join('\n')}\nAbra a despesa e anexe de novo.`);
    } catch (err) {
      avisar(err.message);
    }
  }

  function dataDoPrompt(texto) {
    const t = String(texto || '').trim();
    let m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return t;
    m = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
    return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
  }

  async function abrirAnexoDespesa(id) {
    const resp = await fetch(`${API_BASE}/financeiro/despesas/anexo/${id}`, { headers: { Authorization: `Bearer ${state.token}` } });
    if (!resp.ok) throw new Error('Não foi possível abrir o anexo');
    const url = URL.createObjectURL(await resp.blob());
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  }

  async function acaoDesp(el) {
    const tipo = el.dataset.desp;
    const id = Number(el.dataset.id);
    try {
      if (tipo === 'nova') { state.despForm = novaDespForm(); render(); return; }
      if (tipo === 'foto') { document.getElementById('desp-arquivo-camera').click(); return; }
      if (tipo === 'foto-camera') { lerDespFormDoDom(); document.getElementById('desp-arquivo-camera').click(); return; }
      if (tipo === 'anexar') { lerDespFormDoDom(); document.getElementById('desp-arquivo').click(); return; }
      if (tipo === 'ler-ia') { await lerPelaIA(); return; }
      if (tipo === 'rm-arquivo') {
        lerDespFormDoDom();
        const [tirado] = state.despForm.arquivos.splice(Number(el.dataset.i), 1);
        if (tirado && tirado.url) URL.revokeObjectURL(tirado.url);
        render(); return;
      }
      if (tipo === 'cancelar') {
        if (state.despForm) state.despForm.arquivos.forEach((a) => a.url && URL.revokeObjectURL(a.url));
        state.despForm = null; render(); return;
      }
      if (tipo === 'salvar') { await salvarDespesa(); return; }
      if (tipo === 'editar') {
        const d = state.financeiroDespesas.find((x) => x.id === id) || (state.financeiroAPagar && state.financeiroAPagar.itens.find((x) => x.id === id));
        if (!d) return;
        state.despForm = { id: d.id, tipo: d.tipo || 'compra', descricao: d.descricao, fornecedor: d.fornecedor || '', categoria: d.categoria || '',
          valor: String(d.valor).replace('.', ','), pago: d.pago, data: d.data, forma: d.formaPagamento || '', obs: d.observacao || '', arquivos: [], aviso: '', lendo: false };
        state.financeiroAba = 'despesas';
        render();
        const campo = document.getElementById('df-descricao');
        if (campo) campo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (tipo === 'pagar-hoje') {
        if (!await confirma('Marcar como paga hoje?')) return;
        await api(`/financeiro/despesas/${id}/pagar`, { method: 'POST', body: {} });
      } else if (tipo === 'pagar-outra') {
        const texto = await pergunta('Data do pagamento (dd/mm/aaaa):', dataLocalStr(new Date()).split('-').reverse().join('/'));
        if (texto === null) return;
        const data = dataDoPrompt(texto);
        if (!data) { avisar('Data inválida. Use dd/mm/aaaa.'); return; }
        await api(`/financeiro/despesas/${id}/pagar`, { method: 'POST', body: { data } });
      } else if (tipo === 'remover') {
        if (!await confirma('Remover essa conta? (some também a foto anexada)')) return;
        await api(`/financeiro/despesas/${id}`, { method: 'DELETE' });
      } else if (tipo === 'anexos') {
        state.despAnexos = { despesaId: id, itens: await api(`/financeiro/despesas/${id}/anexos`) };
        render(); return;
      } else if (tipo === 'fechar-anexos') {
        state.despAnexos = null; render(); return;
      } else if (tipo === 'ver-anexo') {
        await abrirAnexoDespesa(id); return;
      } else if (tipo === 'rm-anexo') {
        if (!await confirma('Remover esse anexo?')) return;
        await api(`/financeiro/despesas/anexo/${id}`, { method: 'DELETE' });
        const despId = state.despAnexos.despesaId;
        state.despAnexos = { despesaId: despId, itens: await api(`/financeiro/despesas/${despId}/anexos`) };
        await carregarFinanceiro();
        render(); return;
      }
      await carregarFinanceiro();
      render();
    } catch (err) {
      avisar(err.message);
    }
  }

  // ---------- fluxo de caixa ----------
  async function carregarFinanceiro() {
    const { inicio, fim } = limitesMes(state.financeiroMesRef);
    const qs = `?inicio=${inicio}&fim=${fim}`;
    const [despesas, receitas, resumo, aPagar, leitura] = await Promise.all([
      api(`/financeiro/despesas${qs}`),
      api(`/financeiro/receitas${qs}`),
      api(`/financeiro/resumo${qs}`),
      api('/financeiro/despesas/a-pagar'),
      api('/financeiro/despesas/ler-nota/status').catch(() => ({ configurada: false })),
    ]);
    state.financeiroDespesas = despesas;
    state.financeiroReceitas = receitas;
    state.financeiroResumo = resumo;
    state.financeiroAPagar = aPagar;
    state.leituraNotaConfigurada = !!leitura.configurada;
  }

  async function mudarMesFinanceiro(delta) {
    let { ano, mes } = state.financeiroMesRef;
    mes += delta;
    if (mes < 0) { mes = 11; ano -= 1; } else if (mes > 11) { mes = 0; ano += 1; }
    state.financeiroMesRef = { ano, mes };
    await carregarFinanceiro();
    render();
  }

  async function adicionarLancamento() {
    const data = document.getElementById('novo-lancamento-data').value;
    const descricao = document.getElementById('novo-lancamento-descricao').value.trim();
    const categoria = document.getElementById('novo-lancamento-categoria').value.trim();
    const formaPagamento = document.getElementById('novo-lancamento-forma').value;
    const valor = parseNumero(document.getElementById('novo-lancamento-valor').value);
    if (!data || !descricao || !(valor > 0)) {
      avisar('Preencha data, descrição e um valor maior que zero.');
      return;
    }
    try {
      await api(`/financeiro/${state.financeiroAba}`, {
        method: 'POST',
        body: { data, descricao, categoria: categoria || null, formaPagamento: formaPagamento || null, valor },
      });
      await carregarFinanceiro();
      render();
    } catch (err) {
      avisar(err.message);
    }
  }

  async function removerLancamento(id) {
    if (!await confirma('Remover esse lançamento?')) return;
    await api(`/financeiro/${state.financeiroAba}/${id}`, { method: 'DELETE' });
    await carregarFinanceiro();
    render();
  }

  // ---------- tarefas ----------
  async function carregarTarefas() {
    state.tarefasLista = await api(`/tarefas?data=${state.tarefasData}`);
  }

  async function carregarTarefasCadastro() {
    const [tarefas, cargos] = await Promise.all([
      api('/tarefas/cadastro'),
      state.configCargos.length ? Promise.resolve(state.configCargos) : api('/config/cargos'),
    ]);
    state.tarefasCadastro = tarefas;
    if (!state.configCargos.length) state.configCargos = cargos;
  }

  async function toggleTarefa(id, concluida) {
    try {
      if (concluida) {
        await api(`/tarefas/${id}/concluir`, { method: 'POST', body: { data: state.tarefasData } });
      } else {
        await api(`/tarefas/${id}/concluir?data=${state.tarefasData}`, { method: 'DELETE' });
      }
      await carregarTarefas();
      render();
    } catch (err) {
      avisar(err.message);
    }
  }

  async function mudarDiaTarefas(delta) {
    const d = new Date(`${state.tarefasData}T00:00:00`);
    d.setDate(d.getDate() + delta);
    state.tarefasData = d.toISOString().slice(0, 10);
    await carregarTarefas();
    render();
  }

  async function adicionarTarefa() {
    const titulo = document.getElementById('nova-tarefa-titulo').value.trim();
    const descricao = document.getElementById('nova-tarefa-descricao').value.trim();
    const cargoId = Number(document.getElementById('nova-tarefa-cargo').value);
    const etapa = document.getElementById('nova-tarefa-etapa').value;
    const frequencia = document.getElementById('nova-tarefa-frequencia').value;
    if (!titulo || !cargoId) { avisar('Preencha pelo menos o título e o cargo.'); return; }

    const body = { titulo, descricao: descricao || null, cargoId, etapa, frequencia };
    if (frequencia === 'dias_semana') {
      body.diasSemana = [...document.querySelectorAll('.dia-semana-tarefa:checked')].map((el) => Number(el.value));
      if (!body.diasSemana.length) { avisar('Escolha pelo menos um dia da semana.'); return; }
    }
    if (frequencia === 'intervalo') {
      body.intervaloDias = parseInt(document.getElementById('nova-tarefa-intervalo').value, 10);
      if (!(body.intervaloDias > 0)) { avisar('Informe a cada quantos dias a tarefa se repete.'); return; }
    }

    try {
      await api('/tarefas', { method: 'POST', body });
      state.novaTarefaFrequencia = 'diaria';
      await Promise.all([carregarTarefas(), carregarTarefasCadastro()]);
      render();
    } catch (err) {
      avisar(err.message);
    }
  }

  async function removerTarefa(id) {
    if (!await confirma('Remover essa tarefa? O histórico de conclusões dela também será apagado.')) return;
    await api(`/tarefas/${id}`, { method: 'DELETE' });
    await Promise.all([carregarTarefas(), carregarTarefasCadastro()]);
    render();
  }

  // ---------- sócios ----------

    const params = new URLSearchParams();
    if (state.sociosBusca) params.set('q', state.sociosBusca);
    if (state.sociosFiltroClube !== 'todos') params.set('clube', state.sociosFiltroClube);
    if (state.sociosFiltroStatus !== 'todos') params.set('status', state.sociosFiltroStatus);
    const resposta = await api(`/socios?${params.toString()}`);
    state.sociosLista = resposta.socios;
    state.sociosTotal = resposta.total;

    state.sociosResumo = await api('/socios/resumo');
  }

  async function filtrarSociosClube(clube) {
    state.sociosFiltroClube = clube;
    await carregarSocios();
    render();

  async function filtrarSociosStatus(status) {

    await carregarSocios();
    render();

    state.sociosExpandidoId = id;
    state.sociosDetalhe = null;

  // teclado físico só ativo enquanto não logado. preventDefault: com o foco numa lista
  // (Cargo/Pessoa) o dígito não pode também pular de opção, e Backspace não pode voltar a página.
  document.onkeydown = (e) => {
    if (state.usuario) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length === 1 && e.key >= '0' && e.key <= '9') { e.preventDefault(); pressLoginKey(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); pressLoginKey('back'); }
    else if (e.key === 'Escape' || e.key === 'Delete') { e.preventDefault(); pressLoginKey('clear'); }
  };

  // Celular: com o teclado aberto, o campo em foco precisa ficar visível (o teclado cobre
  // metade da tela). Espera o teclado subir e rola o campo para o meio.
  document.addEventListener('focusin', (e) => {
    const c = e.target;
    if (!c || !/^(INPUT|TEXTAREA|SELECT)$/.test(c.tagName) || !ehMobile()) return;
    if (c.id === 'ini-busca' || c.id === 'busca-socios') return; // buscas ficam no topo da tela: rolar só faz o teclado "pular"
    setTimeout(() => { try { c.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) { /* ignora */ } }, 320);
  });

  // Enter num campo de um formulário em modal confirma (igual ao botão principal).
  document.getElementById('modal-raiz').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    const alvo = e.target;
    if (!alvo || alvo.tagName !== 'INPUT' || alvo.type === 'button') return;
    const principal = document.querySelector('#modal-raiz [data-m="salvar"]');
    if (principal) { e.preventDefault(); principal.click(); }
  });

  // Redesenha só quando a LARGURA muda (girar o aparelho, redimensionar). Abrir o teclado do
  // celular só muda a altura: redesenhar nesse caso destruía o campo em foco e fechava o teclado.
  let larguraAnterior = window.innerWidth;
  window.addEventListener('resize', () => {
    if (window.innerWidth === larguraAnterior) return;
    larguraAnterior = window.innerWidth;
    const digitando = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (state.usuario && !digitando) render();
  });

  // ---------- boot ----------
  (async function iniciar() {
    await carregarCargos();
    if (state.token) {
      try {
        state.usuario = await api('/auth/me');
        await entrarNoApp();
        return;
      } catch {
        localStorage.removeItem('token');
        state.token = null;
      }
    }
    render();
  })();
})();
</script>
</body>
</html>
