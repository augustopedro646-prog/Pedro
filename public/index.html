    if (state.inicioErro || !state.inicio) {
      return `${cab}<div class="secao"><p>Não foi possível carregar o resumo (${esc(state.inicioErro || 'erro')}). Os números abaixo <strong>não</strong> são zero — é falha de carregamento. Tente de novo.</p>
        <button class="botao" data-nav="inicio">Tentar de novo</button></div>`;
    }
    const d = state.inicio;
    const blocos = [];
    const cartao = (rotulo, valor, classe) => `<div class="cartao-resumo"><span class="cartao-resumo-label">${rotulo}</span><strong class="cartao-resumo-valor ${classe || ''}">${valor}</strong></div>`;
    const ver = (aba, texto) => (state.abas.some((a) => a.id === aba) ? `<p><button class="botao-ir" data-nav="${aba}">${texto} →</button></p>` : '');

    if (d.socios) {
      // só ATPN: sócios do CEPE aparecem apenas na aba Sócios
      const g = d.socios.atpn;
      blocos.push(`
        <div class="secao">
          <h3>Sócios ATPN</h3>
          <div class="cartoes-resumo">
            ${cartao('Sócios ativos', g.total - g.desligados)}
            ${cartao('Em dia', g.emDia, 'cor-receita')}
            ${cartao('Com atraso', g.atrasados, 'cor-atraso')}
            ${cartao('6 meses ou mais', g.seisOuMais, g.seisOuMais ? 'cor-atraso' : '')}
          </div>
          ${d.socios.atualizadoEm ? `<p class="placeholder">Planilha atualizada em ${esc(formatarDataExibicao(d.socios.atualizadoEm))}.</p>` : ''}
          ${ver('socios', 'Ver sócios')}
        </div>`);
    }

    if (d.caixa) {
      blocos.push(`
        <div class="secao">
          <h3>Caixa do mês</h3>
          <div class="cartoes-resumo">
            ${cartao('Receitas', formatarMoeda(d.caixa.receitas), 'cor-receita')}
            ${cartao('Despesas', formatarMoeda(d.caixa.despesas), 'cor-atraso')}
            ${cartao('Saldo', formatarMoeda(d.caixa.saldo), d.caixa.saldo >= 0 ? 'cor-receita' : 'cor-atraso')}
          </div>
          ${d.caixa.mensalidades > 0 ? `<p class="placeholder">Receitas incluem ${formatarMoeda(d.caixa.mensalidades)} de mensalidades de sócios ATPN${d.caixa.mensalidadesParcial ? ' (mês parcial: a planilha ainda não cobre o mês todo)' : ''}.</p>` : ''}
          ${ver('fluxo_caixa', 'Abrir fluxo de caixa')}
        </div>`);
    }

    if (d.tarefas) {
      const t = d.tarefas;
      blocos.push(`
        <div class="secao">
          <h3>Tarefas de hoje</h3>
          ${t.total === 0 ? '<p class="placeholder">Nenhuma tarefa para hoje.</p>' : `
            <div class="cartoes-resumo">
              ${cartao('Concluídas', `${t.concluidas}/${t.total}`, t.pendentesTotal === 0 ? 'cor-receita' : '')}
              ${cartao('Pendentes', t.pendentesTotal, t.pendentesTotal ? 'cor-atraso' : '')}
            </div>
            ${t.pendentes.map((p) => `<div>• ${esc(p.titulo)} <span class="placeholder">(${esc(ETAPA_LABEL[p.etapa] || p.etapa)}${state.usuario.administrador ? ' · ' + esc(p.cargoNome) : ''})</span></div>`).join('')}
            ${t.pendentesTotal > t.pendentes.length ? `<p class="placeholder">e mais ${t.pendentesTotal - t.pendentes.length}…</p>` : ''}`}
          ${ver('tarefas', 'Abrir tarefas')}
        </div>`);
    }

    if (d.eventos) {
      const hojeStr = dataLocalStr(new Date());
      const fers = [];
      for (let i = 0; i <= 14; i++) {
        const dia = new Date(); dia.setDate(dia.getDate() + i);
        const s = dataLocalStr(dia);
        feriadosDoDia(s).forEach((f) => fers.push({ data: s, ...f }));
      }
      blocos.push(`
        <div class="secao">
          <h3>Próximos 7 dias</h3>
          ${d.eventos.configurado === false ? '<p class="placeholder">Integração com o PDV Jabá não configurada.</p>'
            : d.eventos.erro ? '<p>Não foi possível ler a agenda do PDV Jabá agora (isso não significa que não há eventos).</p>'
            : (d.eventos.eventos.length ? `<table class="tabela-lista"><tbody>${d.eventos.eventos.map((e) => `
                <tr><td>${e.data === hojeStr ? '<strong>Hoje</strong>' : esc(e.data.split('-').reverse().slice(0, 2).join('/'))}</td>
                <td>${e.horaInicio ? esc(e.horaInicio) : '—'}</td><td>${esc(e.titulo)}</td><td>${esc(e.origem || '')}</td></tr>`).join('')}</tbody></table>`
              : '<p class="placeholder">Nenhum evento nos próximos 7 dias.</p>')}
          ${fers.length ? `<p class="placeholder">Feriados nos próximos 14 dias: ${fers.map((f) => `${esc(f.data.split('-').reverse().slice(0, 2).join('/'))} ${esc(f.nome)}`).join(' · ')}</p>` : ''}
          ${ver(state.abas.some((a) => a.id === 'calendario') ? 'calendario' : 'eventos', 'Abrir agenda')}
        </div>`);
    }

    if (d.ponto) {
      const u = d.ponto.meuUltimo;
      const hora = (iso) => new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      blocos.push(`
        <div class="secao">
          <h3>Ponto</h3>
          <p>${u ? `Seu último registro: <strong>${u.tipo === 'entrada' ? 'entrada' : 'saída'}</strong> em ${esc(hora(u.registradoEm))}.` : 'Você ainda não bateu ponto.'}</p>
          ${d.ponto.presentes ? `<p><strong>Na casa agora (${d.ponto.presentes.length}):</strong> ${d.ponto.presentes.length ? d.ponto.presentes.map((p) => esc(p.nome)).join(', ') : '<span class="placeholder">ninguém com entrada registrada hoje</span>'}</p>` : ''}
          ${ver('ponto', 'Bater ponto')}
        </div>`);
    }

    return `${cab}${blocos.length ? blocos.join('') : '<div class="secao"><p class="placeholder">Seu cargo ainda não tem nenhuma aba liberada além do Início. Peça ao administrador em Configurações.</p></div>'}`;
  }

  // ---------- eventos (próximos 90 dias, só leitura, mesma agenda) ----------
  function viewAgenda90() {
    if (!state.eventosCarregado) return '<p class="placeholder">Carregando…</p>';
    const linhas = state.eventosProximos.map((e) => `
      <tr>
        <td>${esc(e.data.split('-').reverse().join('/'))}</td>
        <td>${e.horaInicio ? esc(e.horaInicio) + (e.horaFim ? '–' + esc(e.horaFim) : '') : '—'}</td>
        <td>${esc(e.titulo)}</td>
        <td>${esc(e.observacao || '—')}</td>
        <td>${esc(e.origem || '—')}</td>
      </tr>`).join('') || '<tr><td colspan="5" class="placeholder">Nenhum evento nos próximos 90 dias.</td></tr>';
    return `
      <div class="secao">
        <p class="placeholder">Próximos 90 dias — eventos e reservas do espaço (agenda compartilhada com o PDV Jabá) e os da ATPN. Reservas da ATPN só aparecem aqui depois de confirmadas.</p>
        <table class="tabela-lista">
          <thead><tr><th>Data</th><th>Horário</th><th>Evento</th><th>Detalhes</th><th>Origem</th></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>`;
  }

  // ---------- eventos / reservas da ATPN (funil + conflito de espaço) ----------
  const STATUS_RESERVA = { novo: 'Novo', negociando: 'Em negociação', confirmado: 'Confirmado', recusado: 'Recusado', concluido: 'Concluído' };
  const FILTROS_RESERVA = [['abertas', 'Em aberto'], ['confirmadas', 'Confirmadas'], ['encerradas', 'Recusadas / concluídas'], ['todas', 'Todas']];
  // próximos passos de cada status: [status destino, rótulo]
  const ACOES_RESERVA = {
    novo: [['negociando', 'Negociar'], ['confirmado', 'Confirmar'], ['recusado', 'Recusar']],
    negociando: [['confirmado', 'Confirmar'], ['recusado', 'Recusar'], ['novo', 'Voltar p/ novo']],
    confirmado: [['concluido', 'Concluir'], ['negociando', 'Voltar p/ negociação'], ['recusado', 'Recusar']],
    recusado: [['novo', 'Reabrir']],
    concluido: [['confirmado', 'Reabrir como confirmado']],
  };

  function textoConflito(c) {
    const quando = c.horaInicio ? `${c.horaInicio}${c.horaFim ? '–' + c.horaFim : ''}` : 'sem horário';
    const rotulo = c.motivo === 'sobrepoe' ? 'Horário sobreposto' : 'Mesmo dia, sem horário pra comparar';
    return `${rotulo}: ${c.titulo} (${c.origem || '?'}, ${quando})`;
  }

  function cartaoReservaHtml(r, ehAdmin) {
    const data = new Date(`${r.data}T12:00:00`);
    const dia = data.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
    const passou = ['novo', 'negociando', 'confirmado'].includes(r.status) && r.data < dataLocalStr(new Date());
    const aberta = r.status === 'novo' || r.status === 'negociando';
    let conflito = '';
    if (aberta) {
      if (r.conflitos === null) conflito = '<div class="aviso-conflito aviso-incerto">Não foi possível checar conflitos agora (agenda do PDV indisponível) — isso não significa que está livre.</div>';
      else if (state.reservas && state.reservas.configurado === false) conflito = '<div class="aviso-conflito aviso-incerto">Integração com o PDV Jabá não configurada: conflitos não são checados.</div>';
      else if (r.conflitos && r.conflitos.length) conflito = r.conflitos.map((c) => `<div class="aviso-conflito ${c.motivo === 'sobrepoe' ? 'aviso-forte' : ''}">⚠ ${esc(textoConflito(c))}</div>`).join('');
      else conflito = '<div class="aviso-livre">✓ Nenhum conflito de espaço nesse dia.</div>';
    }
    const acoes = ehAdmin ? `
      <div class="acoes-reserva">
        ${(ACOES_RESERVA[r.status] || []).map(([s, rot]) => `<button class="botao" data-rv="status" data-id="${r.id}" data-valor="${s}">${rot}</button>`).join('')}
        <button class="botao-link" data-rv="editar" data-id="${r.id}">editar</button>
        <button class="botao-link" data-rv="excluir" data-id="${r.id}">excluir</button>
      </div>` : '';
    return `
      <div class="cartao-reserva status-${esc(r.status)}">
        <div class="topo-reserva">
          <div><strong>${esc(r.titulo)}</strong>
            <div class="placeholder">📅 ${esc(dia)}${r.horaInicio ? ` · ${esc(r.horaInicio)}${r.horaFim ? '–' + esc(r.horaFim) : ''}` : ' · sem horário'}${r.numConvidados ? ` · 👥 ${r.numConvidados} pessoas` : ''}</div>
            ${r.solicitante || r.telefone ? `<div class="placeholder">${esc(r.solicitante || '')}${r.telefone ? ' · ' + esc(r.telefone) : ''}</div>` : ''}
            ${r.observacao ? `<div class="placeholder">${esc(r.observacao)}</div>` : ''}
          </div>
          <span class="tag-status tag-${esc(r.status)}">${esc(STATUS_RESERVA[r.status])}</span>
        </div>
        ${passou ? '<div class="aviso-conflito">⚠ A data já passou — conclua, edite ou exclua.</div>' : ''}
        ${conflito}
        ${acoes}
      </div>`;
  }

  function formReservaHtml() {
    const e = state.reservaEditando; // null = nova
    const v = (k) => esc(e ? (e[k] ?? '') : '');
    return `
      <div class="secao">
        <h3>${e && e.id ? 'Editar reserva' : 'Nova reserva'}</h3>
        <div class="grade-assoc">
          <label class="campo-assoc"><span>Título (obrigatório)</span><input id="rv-titulo" maxlength="120" value="${v('titulo')}" placeholder="Ex.: Formatura Turma 2026" /></label>
          <label class="campo-assoc"><span>Solicitante</span><input id="rv-solicitante" maxlength="100" value="${v('solicitante')}" /></label>
          <label class="campo-assoc"><span>Telefone</span><input id="rv-telefone" maxlength="30" inputmode="tel" value="${v('telefone')}" /></label>
          <label class="campo-assoc"><span>Data</span><input id="rv-data" type="date" value="${e ? esc(e.data) : ''}" /></label>
          <label class="campo-assoc"><span>Início</span><input id="rv-inicio" type="time" value="${v('horaInicio')}" /></label>
          <label class="campo-assoc"><span>Fim</span><input id="rv-fim" type="time" value="${v('horaFim')}" /></label>
          <label class="campo-assoc"><span>Convidados</span><input id="rv-convidados" inputmode="numeric" maxlength="6" value="${v('numConvidados')}" /></label>
          <label class="campo-assoc"><span>Observação</span><input id="rv-obs" maxlength="500" value="${v('observacao')}" /></label>
        </div>
        <div id="rv-conflito-previa" class="placeholder">Escolha a data (e o horário) pra ver se o espaço está livre.</div>
        <div class="linha-form">
          <button class="botao" data-rv="salvar">${e && e.id ? 'Salvar alterações' : 'Adicionar reserva'}</button>
          ${e ? '<button class="botao" data-rv="cancelar-form">Cancelar</button>' : ''}
        </div>
      </div>`;
  }

  function viewEventos() {
    const ehAdmin = state.usuario.administrador;
    const abaBtn = (id, r) => `<button class="${state.eventosAba === id ? 'ativa' : ''}" data-rv="aba" data-valor="${id}">${r}</button>`;
    let corpo;
    if (state.eventosAba === 'agenda') {
      corpo = viewAgenda90();
    } else if (state.reservasErro) {
      corpo = `<div class="secao"><p>Não foi possível carregar as reservas (${esc(state.reservasErro)}). Isso é falha de carregamento, não "nenhuma reserva". <button class="botao" data-rv="recarregar">Tentar de novo</button></p></div>`;
    } else if (!state.reservas) {
      corpo = '<p class="placeholder">Carregando…</p>';
    } else {
      const filtros = FILTROS_RESERVA.map(([id, r]) => `<button class="${state.reservasFiltro === id ? 'ativa' : ''}" data-rv="filtro" data-valor="${id}">${r}</button>`).join('');
      const cartoes = state.reservas.reservas.map((r) => cartaoReservaHtml(r, ehAdmin)).join('')
        || '<p class="placeholder">Nenhuma reserva nessa seleção.</p>';
      corpo = `
        ${ehAdmin ? formReservaHtml() : ''}
        <div class="secao">
          <p class="placeholder">Reservas e pedidos de evento no espaço da ATPN. <strong>Só as confirmadas entram na agenda compartilhada com o restaurante</strong> (e saem dela se voltarem pra negociação, forem recusadas ou excluídas). Antes de confirmar, o sistema avisa se já há algo marcado no mesmo dia — quem decide é o administrador.</p>
          <div class="abas-secundarias">${filtros}</div>
          ${cartoes}
        </div>`;
    }
    return `<h2>Eventos</h2><div class="abas-secundarias">${abaBtn('reservas', 'Reservas da ATPN')}${abaBtn('agenda', 'Agenda (90 dias)')}</div>${corpo}`;
  }

  async function carregarReservas() {
    state.reservasErro = null;
    try {
      state.reservas = await api(`/reservas?filtro=${state.reservasFiltro}`);
    } catch (err) {
      state.reservas = null;
      state.reservasErro = err.message;
    }
  }

  function lerFormReserva() {
    const val = (id) => document.getElementById(id).value.trim();
    return {
      titulo: val('rv-titulo'), solicitante: val('rv-solicitante'), telefone: val('rv-telefone'),
      data: val('rv-data'), horaInicio: val('rv-inicio'), horaFim: val('rv-fim'),
      numConvidados: val('rv-convidados'), observacao: val('rv-obs'),
    };
  }

  const listaConflitosTexto = (lista) => lista.map((c) => `• ${textoConflito(c)}`).join('\n');

  // pré-visualização no formulário: mostra se o espaço está livre assim que a data/horário muda
  async function previaConflitoForm() {
    const alvo = document.getElementById('rv-conflito-previa');
    if (!alvo) return;
    const f = lerFormReserva();
    if (!f.data) { alvo.className = 'placeholder'; alvo.textContent = 'Escolha a data (e o horário) pra ver se o espaço está livre.'; return; }
    try {
      const p = new URLSearchParams({ data: f.data, horaInicio: f.horaInicio, horaFim: f.horaFim });
      if (state.reservaEditando && state.reservaEditando.id) p.set('ignorarId', state.reservaEditando.id);
      const r = await api(`/reservas/conflitos?${p.toString()}`);
      if (!r.configurado) { alvo.className = 'aviso-conflito aviso-incerto'; alvo.textContent = 'Integração com o PDV Jabá não configurada: conflitos não são checados.'; }
      else if (r.conflitos.length) { alvo.className = ''; alvo.innerHTML = r.conflitos.map((c) => `<div class="aviso-conflito ${c.motivo === 'sobrepoe' ? 'aviso-forte' : ''}">⚠ ${esc(textoConflito(c))}</div>`).join(''); }
      else { alvo.className = 'aviso-livre'; alvo.textContent = '✓ Nenhum conflito de espaço nesse dia.'; }
    } catch (err) {
      alvo.className = 'aviso-conflito aviso-incerto';
      alvo.textContent = 'Não foi possível checar conflitos agora — isso não significa que está livre.';
    }
  }

  async function acaoReserva(el) {
    const tipo = el.dataset.rv;
    const id = Number(el.dataset.id);
    try {
      if (tipo === 'aba') { state.eventosAba = el.dataset.valor; render(); return; }
      if (tipo === 'filtro') { state.reservasFiltro = el.dataset.valor; await carregarReservas(); render(); return; }
      if (tipo === 'recarregar') { state.reservas = null; render(); await carregarReservas(); render(); return; }
      if (tipo === 'editar') { state.reservaEditando = state.reservas.reservas.find((r) => r.id === id) || null; render(); previaConflitoForm(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      if (tipo === 'cancelar-form') { state.reservaEditando = null; render(); return; }
      if (tipo === 'excluir') {
        if (!confirm('Excluir essa reserva? Se estiver confirmada, ela também sai da agenda do restaurante.')) return;
        await api(`/reservas/${id}`, { method: 'DELETE' });
      } else if (tipo === 'status') {
        try {
          await api(`/reservas/${id}/status`, { method: 'POST', body: { status: el.dataset.valor } });
        } catch (err) {
          if (!err.conflitos) throw err;
          if (!confirm(`Conflito de espaço:\n\n${listaConflitosTexto(err.conflitos)}\n\nConfirmar mesmo assim?`)) return;
          await api(`/reservas/${id}/status`, { method: 'POST', body: { status: el.dataset.valor, forcar: true } });
        }
      } else if (tipo === 'salvar') {
        const corpo = lerFormReserva();
        const editando = state.reservaEditando && state.reservaEditando.id;
        const chamar = (extra) => api(editando ? `/reservas/${editando}` : '/reservas', { method: editando ? 'PUT' : 'POST', body: { ...corpo, ...extra } });
        try {
          await chamar({});
        } catch (err) {
          if (!err.conflitos) throw err;
          if (!confirm(`Conflito de espaço:\n\n${listaConflitosTexto(err.conflitos)}\n\nSalvar mesmo assim?`)) return;
          await chamar({ forcar: true });
        }
        state.reservaEditando = null;
      }
      await carregarReservas();
      state.eventosCarregado = false; // a agenda de 90 dias mudou (confirmadas entram/saem)
      render();
      carregarAgenda90();
    } catch (err) {
      alert(err.message);
    }
  }

  async function carregarAgenda90() {
    try {
      const hoje = new Date();
      const fim = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() + 90);
      const resposta = await api(`/calendario?inicio=${dataLocalStr(hoje)}&fim=${dataLocalStr(fim)}`);
      state.eventosProximos = resposta.eventos;
      state.eventosCarregado = true;
    } catch (err) {
      state.eventosProximos = [];
      state.eventosCarregado = true;
    }
    if (state.abaAtual === 'eventos') render();
  }

  // ---------- calendário (agenda compartilhada com o PDV Jabá) ----------
  function viewCalendario() {
    if (!state.calendarioCarregado) return '<h2>Calendário</h2><p class="placeholder">Carregando…</p>';

    if (!state.calendarioConfigurado) {
      return `
        <h2>Calendário</h2>
        <div class="secao">
          <p class="placeholder">A integração com o PDV Jabá ainda não foi configurada nesse servidor
          (falta rodar <code>scripts/configurar-integracao-jaba.js</code> uma vez e preencher
          <code>JABA_DATABASE_URL</code>/<code>JABA_LOJA_ID</code> no <code>.env</code>). Sem isso essa
          aba não tem onde guardar os eventos — reservas e eventos são a mesma agenda do PDV Jabá.</p>
        </div>`;
    }

    const { ano, mes } = state.calendarioMesRef;
    const hojeStr = dataLocalStr(new Date());
    const diasNoMes = new Date(ano, mes + 1, 0).getDate();
    const vaziasAntes = new Date(ano, mes, 1).getDay();
    let celulas = '<div class="cal-cell cal-cell-vazia"></div>'.repeat(vaziasAntes);
    for (let dia = 1; dia <= diasNoMes; dia++) {
      const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      const evs = state.calendarioEventos.filter((e) => e.data === dataStr);
      const fers = feriadosDoDia(dataStr);
      const ehFeriado = fers.some((f) => f.tipo !== 'facultativo');
      const classe = [
        'cal-cell',
        dataStr === hojeStr ? 'cal-cell-hoje' : '',
        evs.length ? 'cal-cell-evento' : '',
        ehFeriado ? 'cal-cell-feriado' : (fers.length ? 'cal-cell-facultativo' : ''),
      ].join(' ');
      celulas += `
        <div class="${classe}">
          <span class="cal-cell-num">${dia}</span>
          ${fers.map((f) => `<div class="cal-chip ${f.tipo === 'facultativo' ? 'cal-chip-facultativo' : 'cal-chip-feriado'}" title="${esc(ROTULO_FERIADO[f.tipo])}">${esc(f.nome)}</div>`).join('')}
          ${evs.map((e) => `<div class="cal-chip cal-chip-evento" title="${esc(e.titulo)}">${esc(e.titulo)}</div>`).join('')}
        </div>`;
    }

    const feriadosDoMes = [];
    for (let dia = 1; dia <= diasNoMes; dia++) {
      const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
      feriadosDoDia(dataStr).forEach((f) => feriadosDoMes.push({ data: dataStr, ...f }));
    }

    const linhas = state.calendarioEventos.map((e) => `
      <tr>
        <td>${esc(e.data.split('-').reverse().join('/'))}</td>
        <td>${e.horaInicio ? esc(e.horaInicio) + (e.horaFim ? '–' + esc(e.horaFim) : '') : '—'}</td>
        <td>${esc(e.titulo)}</td>
        <td>${esc(e.observacao || '—')}</td>
        <td>${esc(e.origem || '—')}</td>
        ${state.usuario.administrador ? `<td>${e.proprio ? `<button class="botao-link" data-action="remover-evento" data-id="${e.id}">remover</button>` : ''}</td>` : ''}
      </tr>`).join('') || `<tr><td colspan="${state.usuario.administrador ? 6 : 5}" class="placeholder">Nenhum evento no mês.</td></tr>`;

    const linhasFeriados = feriadosDoMes.map((f) => `
      <tr><td>${esc(f.data.split('-').reverse().join('/'))}</td><td>${esc(f.nome)}</td><td>${esc(ROTULO_FERIADO[f.tipo])}</td></tr>`).join('');

    return `
      <h2>Calendário</h2>
      <div class="secao">
        <div class="navegacao-mes">
          <button class="botao" data-action="calendario-mes-anterior">‹</button>
          <strong>${nomeMes(state.calendarioMesRef)}</strong>
          <button class="botao" data-action="calendario-mes-seguinte">›</button>
        </div>
      </div>
      <div class="secao">
        <div class="cal-legenda">
          <span><i style="background:var(--ev-bg)"></i>Evento</span>
          <span><i style="background:var(--fer-bg)"></i>Feriado</span>
          <span><i style="background:var(--fer-soft)"></i>Ponto facultativo</span>
        </div>

  const STATUS_SOCIO_LABEL = {
    em_dia: 'Em dia',
    ate_2_meses: 'Até 2 meses',
    '3_a_5_meses': '3 a 5 meses',
    '6_meses_ou_mais': '6 meses ou mais',
    desligado: 'Desligado',
  };
  const STATUS_SOCIO_CLASSE = {
    em_dia: 'cor-receita',
    ate_2_meses: 'cor-atraso',
    '3_a_5_meses': 'cor-atraso',
    '6_meses_ou_mais': 'cor-atraso',
    desligado: 'placeholder',
  };

  function resumoAgregadoSocios(resumo) {
    const soma = { total: 0, emDia: 0, atrasados: 0, desligados: 0 };
    resumo.forEach((r) => {
      soma.total += r.total;
      if (r.status === 'em_dia') soma.emDia += r.total;
      else if (r.status === 'desligado') soma.desligados += r.total;
      else soma.atrasados += r.total;
    });
    return soma;
  }

  function viewDetalheSocio() {
    const d = state.sociosDetalhe;
    if (!d) return '<p class="placeholder">Carregando detalhes…</p>';
    const linhasMensalidade = d.mensalidades.map((m) => `
      <tr>
        <td>${String(m.mes).padStart(2, '0')}/${m.ano}</td>
        <td>${m.valor != null ? formatarMoeda(m.valor) : esc(m.observacao || '—')}</td>
      </tr>`).join('') || '<tr><td colspan="2" class="placeholder">Sem histórico de mensalidade.</td></tr>';

    return `
      <div style="padding: 4px 0 12px;">
        <div class="linha-form" style="margin-top:0;">
          <div>CPF: ${esc(d.cpf || '—')}</div>
          <div>Matrícula: ${esc(d.matricula || '—')}${d.matriculaSecundaria ? ` (sistema anterior: ${esc(d.matriculaSecundaria)})` : ''}</div>
          <div>Vencimento: dia ${d.diaVencimento ?? '—'}</div>
          <div>Telefone: ${esc(d.telefone || '—')}${d.telefoneSecundario ? ` / ${esc(d.telefoneSecundario)}` : ''}</div>
        </div>
        ${d.motivoDesligamento ? `<p><strong>Motivo do desligamento:</strong> ${esc(d.motivoDesligamento)}</p>` : ''}
        <h3>Histórico de mensalidade</h3>
        <table class="tabela-lista">
          <thead><tr><th>Mês</th><th>Valor / situação</th></tr></thead>
          <tbody>${linhasMensalidade}</tbody>
        </table>
      </div>`;
  }

  // ---------- eventos (religados depois de cada render, sem duplicar
  // listener porque o innerHTML anterior já foi descartado) ----------
  function attachEvents() {
    document.querySelectorAll('[data-tecla]').forEach((el) => {
      el.addEventListener('click', () => pressLoginKey(el.dataset.tecla));
    });

    const selCargo = document.getElementById('sel-cargo');
    if (selCargo) selCargo.addEventListener('change', (e) => mudarCargo(Number(e.target.value)));

    const selPessoa = document.getElementById('sel-pessoa');
    if (selPessoa) selPessoa.addEventListener('change', (e) => { state.pessoaSelecionada = Number(e.target.value); });

    document.querySelectorAll('[data-nav]').forEach((el) => {
      el.addEventListener('click', () => abrirAba(el.dataset.nav));
    });

    document.querySelectorAll('[data-action="toggle-sidebar"]').forEach((el) => {
      el.addEventListener('click', toggleSidebar);
    });

    const btnSair = document.querySelector('[data-action="sair"]');
    if (btnSair) btnSair.addEventListener('click', sair);

    const btnAtualizar = document.querySelector('[data-action="atualizar"]');
    if (btnAtualizar) btnAtualizar.addEventListener('click', () => window.location.reload());

    const btnToggleTema = document.querySelector('[data-action="toggle-tema"]');
    if (btnToggleTema) btnToggleTema.addEventListener('click', toggleTema);

    const btnAddCargo = document.querySelector('[data-action="add-cargo"]');
    if (btnAddCargo) btnAddCargo.addEventListener('click', adicionarCargo);

    document.querySelectorAll('[data-action="toggle-permissao"]').forEach((el) => {
      el.addEventListener('change', () => {
        const linha = state.configMatriz.find((l) => l.cargoId === Number(el.dataset.cargo));
        const aba = linha?.abas.find((a) => a.aba === el.dataset.aba);
        if (aba) aba.permitido = el.checked;
      });
    });

    document.querySelectorAll('[data-rel]').forEach((el) => {
      el.addEventListener('click', () => acaoRelatorio(el));
    });

    document.querySelectorAll('[data-desp]').forEach((el) => {
      el.addEventListener('click', () => acaoDesp(el));
    });
    const arqCamera = document.getElementById('desp-arquivo-camera');
    if (arqCamera) arqCamera.addEventListener('change', async (e) => { const fs = [...e.target.files]; e.target.value = ''; await adicionarArquivosDespesa(fs, !state.despForm || !state.despForm.id); });
    const arqGaleria = document.getElementById('desp-arquivo');
    if (arqGaleria) arqGaleria.addEventListener('change', async (e) => { const fs = [...e.target.files]; e.target.value = ''; await adicionarArquivosDespesa(fs, false); });
    // trocar "já pago" <-> "a pagar" muda o rótulo da data (pagamento x vencimento)
    const selPago = document.getElementById('df-pago');
    if (selPago) selPago.addEventListener('change', () => { lerDespFormDoDom(); render(); });

    document.querySelectorAll('[data-mens]').forEach((el) => {
      el.addEventListener('click', () => acaoMens(el));
    });
    const campoBuscaMens = document.getElementById('mens-busca');
    if (campoBuscaMens) campoBuscaMens.addEventListener('input', (e) => {
      const cursor = e.target.selectionStart;
      state.mensBusca = e.target.value;
      clearTimeout(timerBuscaMens);
      timerBuscaMens = setTimeout(async () => {
        try {
          state.mensResultados = state.mensBusca.trim().length >= 2 ? await api(`/mensalidades/buscar?q=${encodeURIComponent(state.mensBusca.trim())}`) : [];
          state.mensErro = null;
        } catch (err) { state.mensErro = err.message; }
        render();
        const novo = document.getElementById('mens-busca');
        if (novo) { novo.focus(); novo.setSelectionRange(cursor, cursor); }
      }, 300);
    });

    document.querySelectorAll('[data-rv]').forEach((el) => {
      el.addEventListener('click', () => acaoReserva(el));
    });
    ['rv-data', 'rv-inicio', 'rv-fim'].forEach((id) => {
      const campo = document.getElementById(id);
      if (campo) campo.addEventListener('change', previaConflitoForm);
    });

    document.querySelectorAll('[data-hist]').forEach((el) => {
      el.addEventListener('click', () => acaoHistorico(el));
    });

    document.querySelectorAll('[data-assoc="salvar"]').forEach((el) => {
      el.addEventListener('click', salvarAssociacaoTela);
    });
    // "fechado" liga/desliga os campos de hora do dia, sem recarregar a tela
    document.querySelectorAll('.as-h-fechado').forEach((el) => {
      el.addEventListener('change', () => {
        document.querySelectorAll(`.as-h[data-dia="${el.dataset.dia}"]`).forEach((h) => { h.disabled = el.checked; });
      });
    });

    document.querySelectorAll('[data-equipe]').forEach((el) => {
      el.addEventListener('click', () => acaoEquipe(el));
    });

    const btnSalvarPermissoes = document.querySelector('[data-action="salvar-permissoes"]');
    if (btnSalvarPermissoes) btnSalvarPermissoes.addEventListener('click', salvarPermissoes);

    const btnBaterPonto = document.querySelector('[data-action="bater-ponto"]');
    if (btnBaterPonto) btnBaterPonto.addEventListener('click', baterPonto);

    document.querySelectorAll('[data-action="remover-ponto"]').forEach((el) => {
      el.addEventListener('click', () => removerPonto(Number(el.dataset.id)));
    });

    document.querySelectorAll('[data-action="financeiro-aba"]').forEach((el) => {
      el.addEventListener('click', () => { state.financeiroAba = el.dataset.aba; render(); });
    });

    const btnMesAnterior = document.querySelector('[data-action="mes-anterior"]');
    if (btnMesAnterior) btnMesAnterior.addEventListener('click', () => mudarMesFinanceiro(-1));

    const btnMesSeguinte = document.querySelector('[data-action="mes-seguinte"]');
    if (btnMesSeguinte) btnMesSeguinte.addEventListener('click', () => mudarMesFinanceiro(1));

    const btnAddLancamento = document.querySelector('[data-action="add-lancamento"]');
    if (btnAddLancamento) btnAddLancamento.addEventListener('click', adicionarLancamento);

    document.querySelectorAll('[data-action="remover-lancamento"]').forEach((el) => {
      el.addEventListener('click', () => removerLancamento(Number(el.dataset.id)));
    });

    document.querySelectorAll('[data-action="toggle-tarefa"]').forEach((el) => {
      el.addEventListener('change', () => toggleTarefa(Number(el.dataset.id), el.checked));
    });

    const btnTarefaDiaAnterior = document.querySelector('[data-action="tarefa-dia-anterior"]');
    if (btnTarefaDiaAnterior) btnTarefaDiaAnterior.addEventListener('click', () => mudarDiaTarefas(-1));

    const btnTarefaDiaSeguinte = document.querySelector('[data-action="tarefa-dia-seguinte"]');
    if (btnTarefaDiaSeguinte) btnTarefaDiaSeguinte.addEventListener('click', () => mudarDiaTarefas(1));

    // Não chama render() aqui de propósito: um render inteiro reconstruiria o
    // formulário e apagaria título/descrição/cargo/etapa já preenchidos antes
    // de mexer na frequência — só alterna os dois blocos condicionais.
    const selFrequenciaTarefa = document.getElementById('nova-tarefa-frequencia');
    if (selFrequenciaTarefa) selFrequenciaTarefa.addEventListener('change', (e) => {
      state.novaTarefaFrequencia = e.target.value;

      const campoIntervalo = document.getElementById('campo-intervalo');
      if (campoDias) campoDias.style.display = state.novaTarefaFrequencia === 'dias_semana' ? '' : 'none';
      if (campoIntervalo) campoIntervalo.style.display = state.novaTarefaFrequencia === 'intervalo' ? '' : 'none';
    });

    const btnAddTarefa = document.querySelector('[data-action="add-tarefa"]');
    if (btnAddTarefa) btnAddTarefa.addEventListener('click', adicionarTarefa);

    document.querySelectorAll('[data-action="remover-tarefa"]').forEach((el) => {
      el.addEventListener('click', () => removerTarefa(Number(el.dataset.id)));
    });

    const btnCalendarioMesAnterior = document.querySelector('[data-action="calendario-mes-anterior"]');
    if (btnCalendarioMesAnterior) btnCalendarioMesAnterior.addEventListener('click', () => mudarMesCalendario(-1));

    const btnCalendarioMesSeguinte = document.querySelector('[data-action="calendario-mes-seguinte"]');
    if (btnCalendarioMesSeguinte) btnCalendarioMesSeguinte.addEventListener('click', () => mudarMesCalendario(1));

    const btnAddEvento = document.querySelector('[data-action="add-evento"]');
    if (btnAddEvento) btnAddEvento.addEventListener('click', adicionarEvento);

    document.querySelectorAll('[data-action="remover-evento"]').forEach((el) => {
      el.addEventListener('click', () => removerEvento(el.dataset.id));
    });

    const campoBuscaSocios = document.getElementById('busca-socios');
    if (campoBuscaSocios) campoBuscaSocios.addEventListener('input', (e) => {
      const cursor = e.target.selectionStart;
      state.sociosBusca = e.target.value;
      clearTimeout(timerBuscaSocios);
      timerBuscaSocios = setTimeout(async () => {
        await carregarSocios();
        render();
        const campoNovo = document.getElementById('busca-socios');
        if (campoNovo) { campoNovo.focus(); campoNovo.setSelectionRange(cursor, cursor); }
      }, 300);
    });

    document.querySelectorAll('[data-action="filtro-socio-clube"]').forEach((el) => {
      el.addEventListener('click', () => filtrarSociosClube(el.dataset.clube));
    });

    document.querySelectorAll('[data-action="filtro-socio-status"]').forEach((el) => {
      el.addEventListener('click', () => filtrarSociosStatus(el.dataset.status));
    });

    document.querySelectorAll('[data-action="toggle-socio"]').forEach((el) => {
      el.addEventListener('click', () => toggleSocio(Number(el.dataset.id)));
    });
  }

  // ---------- login ----------
  function pressLoginKey(k) {
    if (k === 'clear') state.pin = '';
    else if (k === 'back') state.pin = state.pin.slice(0, -1);
    else if (state.pin.length < 4) state.pin += k;

    if (state.pin.length === 4) { tryLogin(); return; }
    render();
  }

  async function mudarCargo(cargoId) {
    state.cargoSelecionado = cargoId;
    state.pessoaSelecionada = null;
    await carregarPessoasDoCargo();
    render();
  }

  async function carregarCargos() {
    state.cargos = await api('/auth/cargos');
    const lembrado = Number(localStorage.getItem('ultimoCargoId'));
    state.cargoSelecionado = state.cargos.some((c) => c.id === lembrado) ? lembrado : state.cargos[0]?.id ?? null;
    await carregarPessoasDoCargo();
  }

  async function carregarPessoasDoCargo() {
    if (!state.cargoSelecionado) { state.pessoasDoCargo = []; return; }
    state.pessoasDoCargo = await api(`/auth/pessoas?cargoId=${state.cargoSelecionado}`);
    const lembrada = Number(localStorage.getItem('ultimaPessoaId'));
    state.pessoaSelecionada = state.pessoasDoCargo.some((p) => p.id === lembrada)
      ? lembrada
      : state.pessoasDoCargo[0]?.id ?? null;
  }

      const body = { pessoaId: state.pessoaSelecionada, pin: state.pin };
      const resposta = await api('/auth/login', { method: 'POST', body });

      localStorage.setItem('token', resposta.token);
      localStorage.setItem('ultimoCargoId', String(state.cargoSelecionado));
      localStorage.setItem('ultimaPessoaId', String(state.pessoaSelecionada));
      state.token = resposta.token;
      state.usuario = resposta.usuario;
      await entrarNoApp();
    } catch (err) {
      state.erroLogin = err.message;
      state.pin = '';
      render();

  async function abrirAba(id) {
    if (!id) return;
    state.abaAtual = id;
    if (id === 'inicio') {
      // sempre recarrega: o Início é o retrato do momento
      state.inicioErro = null;
      render();
      try { state.inicio = await api('/inicio'); } catch (err) { state.inicio = null; state.inicioErro = err.message; }
      state.inicioCarregado = true;
    }
    if (id === 'mensalidades') {
      state.mensHoje = null;
      state.mensFicha = null;
      state.mensBusca = '';
      state.mensResultados = [];
      render();
      await carregarMensHoje();
      render();
      const campo = document.getElementById('mens-busca');
      if (campo) campo.focus();
    }
    if (id === 'historico') {
      state.historicoVersoes = null;
      state.historicoErro = null;
      render();
      await carregarHistorico();
    }
    if (id === 'relatorios') {
      // sempre recarrega: relatório é o retrato do momento
      state.rel = null;
      render();
      await carregarRelatorios();
    }
    if (id === 'config' && !state.configCarregado) {
      render();
      await carregarConfiguracoes();
      state.configCarregado = true;
    }
    if (id === 'ponto' && !state.pontoCarregado) {
      render();
      await carregarPonto();
      state.pontoCarregado = true;
    }
    if (id === 'fluxo_caixa' && !state.financeiroCarregado) {
      render();
      if (!state.financeiroMesRef) state.financeiroMesRef = refMesAtual();
      await carregarFinanceiro();
      state.financeiroCarregado = true;

    if (id === 'tarefas' && !state.tarefasCarregado) {
      render();

      if (state.usuario.administrador) state.tarefasCadastroCarregado = true;

  async function acaoEquipe(btn) {
    const tipo = btn.dataset.equipe;
    const linha = btn.closest('tr');
    try {
      if (tipo === 'novo') {
        const nome = document.getElementById('eq-novo-nome').value.trim();
        const cargoId = Number(document.getElementById('eq-novo-cargo').value);
        const pin = document.getElementById('eq-novo-pin').value;
        if (!nome) { alert('Digite o nome.'); return; }
        if (!/^\d{4}$/.test(pin)) { alert('O PIN precisa ter exatamente 4 números.'); return; }
        await api('/config/equipe', { method: 'POST', body: { nome, cargoId, pin } });
      } else if (tipo === 'salvar') {
        await api(`/config/equipe/${btn.dataset.id}`, { method: 'PUT', body: {
          nome: linha.querySelector('.eq-nome').value.trim(),
          cargoId: Number(linha.querySelector('.eq-cargo').value),
        } });
      } else if (tipo === 'ativo') {
        const desativando = btn.dataset.ativo === '0';
        if (desativando && !confirm('Desativar essa pessoa? Ela perde o acesso na hora (o histórico fica).')) return;
        await api(`/config/equipe/${btn.dataset.id}`, { method: 'PUT', body: { ativo: !desativando } });
      } else if (tipo === 'pin') {
        const pin = linha.querySelector('.eq-pin').value;
        if (!/^\d{4}$/.test(pin)) { alert('O PIN precisa ter exatamente 4 números.'); return; }
        await api(`/config/equipe/${btn.dataset.id}/pin`, { method: 'PUT', body: { pin } });

  // Reduz foto de celular (4–8 MB) para ~1600px/JPEG antes de enviar: menos
  // dado trafegando e guardado, e a leitura da nota continua nítida.
  async function reduzirImagem(file) {
    if (file.type === 'application/pdf') return { blob: file, mime: 'application/pdf' };
    try {
      const url = URL.createObjectURL(file);
      const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
      const maxLado = 1600;
      const escala = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * escala); c.height = Math.round(img.naturalHeight * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.82));
      if (blob) return { blob, mime: 'image/jpeg' };
    } catch (e) { /* cai pro arquivo original */ }
    if (['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return { blob: file, mime: file.type };
    throw new Error('Formato não suportado — use foto (JPG/PNG/WEBP) ou PDF');
  }

  async function adicionarArquivosDespesa(files, autoLer) {
    if (!files.length) return;
    if (!state.despForm) state.despForm = novaDespForm();
    lerDespFormDoDom();
    const f = state.despForm;
    for (const file of files) {
      if (f.arquivos.length >= MAX_ARQUIVOS) { alert(`Máximo de ${MAX_ARQUIVOS} anexos por despesa.`); break; }
      try {
        const { blob, mime } = await reduzirImagem(file);
        if (blob.size > 8 * 1024 * 1024) { alert(`"${file.name}" tem mais de 8 MB.`); continue; }
        f.arquivos.push({ nome: file.name, mime, blob, url: mime === 'application/pdf' ? null : URL.createObjectURL(blob) });
      } catch (err) { alert(err.message); }
    }
    render();
    if (autoLer && state.leituraNotaConfigurada && f.arquivos.length) await lerPelaIA();
    else if (autoLer && !state.leituraNotaConfigurada && f.arquivos.length) { f.aviso = 'Foto anexada. A leitura automática não está ativada neste servidor — preencha os campos digitando.'; render(); }
  }

  function aplicarRascunhoIA(f, r) {
    const hoje = dataLocalStr(new Date());
    if (r.tipo) f.tipo = r.tipo;
    if (r.fornecedor) f.fornecedor = r.fornecedor;
    if (r.descricao) f.descricao = r.descricao;
    if (r.valor) f.valor = String(r.valor).replace('.', ',');
    if (r.categoria) f.categoria = r.categoria;
    if (r.formaPagamento) f.forma = r.formaPagamento;
    const aPagar = !r.jaPago && (r.vencimento || r.tipo === 'boleto' || r.tipo === 'conta');
    if (aPagar) { f.pago = false; f.data = r.vencimento || hoje; }
    else { f.pago = true; f.data = r.dataEmissao && r.dataEmissao <= hoje ? r.dataEmissao : hoje; }
    if (r.linhaDigitavel) f.obs = `${f.obs ? f.obs + ' · ' : ''}Linha digitável: ${r.linhaDigitavel}`;
    f.aviso = '✨ Dados lidos pela IA a partir da foto — confira tudo antes de salvar (valor, data e vencimento principalmente).';
  }

  async function lerPelaIA() {
    const f = state.despForm;
    const arq = f && f.arquivos[0];
    if (!arq) { alert('Anexe uma foto primeiro.'); return; }
    lerDespFormDoDom();
    f.lendo = true; f.aviso = '';
    render();
    try {
      const resp = await fetch(`${API_BASE}/financeiro/despesas/ler-nota`, {
        method: 'POST', headers: { 'Content-Type': arq.mime, Authorization: `Bearer ${state.token}` }, body: arq.blob,
      });
      const dado = await resp.json().catch(() => ({}));
      if (!resp.ok) f.aviso = dado.erro || 'Não deu pra ler a foto agora. Preencha digitando.';
      else aplicarRascunhoIA(f, dado.rascunho);
    } catch (err) {
      f.aviso = 'Não deu pra ler a foto agora. Preencha digitando.';
    }
    f.lendo = false;
    render();
  }

  async function enviarAnexo(despesaId, arq) {
    const resp = await fetch(`${API_BASE}/financeiro/despesas/${despesaId}/anexos`, {
      method: 'POST', headers: { 'Content-Type': arq.mime, Authorization: `Bearer ${state.token}` }, body: arq.blob,
    });
    if (!resp.ok) { const d = await resp.json().catch(() => ({})); throw new Error(d.erro || 'falha ao enviar anexo'); }
  }

  async function salvarDespesa() {
    lerDespFormDoDom();
    const f = state.despForm;
    const valor = parseNumero(f.valor);
    if (!f.descricao.trim() || !f.data || !(valor > 0)) { alert('Preencha descrição, data e um valor maior que zero.'); return; }
    if (!f.pago && f.data < dataLocalStr(new Date()) && !confirm('O vencimento já passou. Registrar mesmo assim como conta a pagar (vencida)?')) return;
    const corpo = {
      data: f.data, descricao: f.descricao.trim(), fornecedor: f.fornecedor.trim() || null, categoria: f.categoria.trim() || null,
      valor, formaPagamento: f.forma || null, tipo: f.tipo, pago: f.pago, observacao: f.obs.trim() || null,
    };
    try {
      const r = await api(f.id ? `/financeiro/despesas/${f.id}` : '/financeiro/despesas', { method: f.id ? 'PUT' : 'POST', body: corpo });
      const despesaId = f.id || r.id;
      const falhas = [];
      for (const arq of f.arquivos) {
        try { await enviarAnexo(despesaId, arq); } catch (err) { falhas.push(`${arq.nome}: ${err.message}`); }
      }
      f.arquivos.forEach((a) => a.url && URL.revokeObjectURL(a.url));
      state.despForm = null;
      await carregarFinanceiro();
      render();
      if (falhas.length) alert(`Despesa salva, mas não consegui anexar:\n${falhas.join('\n')}\nAbra a despesa e anexe de novo.`);
    } catch (err) {
      alert(err.message);
    }
  }

  function dataDoPrompt(texto) {
    const t = String(texto || '').trim();
    let m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return t;
    m = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);
    return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null;
  }

  async function abrirAnexoDespesa(id) {
    const resp = await fetch(`${API_BASE}/financeiro/despesas/anexo/${id}`, { headers: { Authorization: `Bearer ${state.token}` } });
    if (!resp.ok) throw new Error('Não foi possível abrir o anexo');
    const url = URL.createObjectURL(await resp.blob());
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  }

  async function acaoDesp(el) {
    const tipo = el.dataset.desp;
    const id = Number(el.dataset.id);
    try {
      if (tipo === 'nova') { state.despForm = novaDespForm(); render(); return; }
      if (tipo === 'foto') { document.getElementById('desp-arquivo-camera').click(); return; }
      if (tipo === 'foto-camera') { lerDespFormDoDom(); document.getElementById('desp-arquivo-camera').click(); return; }
      if (tipo === 'anexar') { lerDespFormDoDom(); document.getElementById('desp-arquivo').click(); return; }
      if (tipo === 'ler-ia') { await lerPelaIA(); return; }
      if (tipo === 'rm-arquivo') {
        lerDespFormDoDom();
        const [tirado] = state.despForm.arquivos.splice(Number(el.dataset.i), 1);
        if (tirado && tirado.url) URL.revokeObjectURL(tirado.url);
        render(); return;
      }
      if (tipo === 'cancelar') {
        if (state.despForm) state.despForm.arquivos.forEach((a) => a.url && URL.revokeObjectURL(a.url));
        state.despForm = null; render(); return;
      }
      if (tipo === 'salvar') { await salvarDespesa(); return; }
      if (tipo === 'editar') {
        const d = state.financeiroDespesas.find((x) => x.id === id) || (state.financeiroAPagar && state.financeiroAPagar.itens.find((x) => x.id === id));
        if (!d) return;
        state.despForm = { id: d.id, tipo: d.tipo || 'compra', descricao: d.descricao, fornecedor: d.fornecedor || '', categoria: d.categoria || '',
          valor: String(d.valor).replace('.', ','), pago: d.pago, data: d.data, forma: d.formaPagamento || '', obs: d.observacao || '', arquivos: [], aviso: '', lendo: false };
        state.financeiroAba = 'despesas';
        render();
        const campo = document.getElementById('df-descricao');
        if (campo) campo.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (tipo === 'pagar-hoje') {
        if (!confirm('Marcar como paga hoje?')) return;
        await api(`/financeiro/despesas/${id}/pagar`, { method: 'POST', body: {} });
      } else if (tipo === 'pagar-outra') {
        const texto = prompt('Data do pagamento (dd/mm/aaaa):', dataLocalStr(new Date()).split('-').reverse().join('/'));
        if (texto === null) return;
        const data = dataDoPrompt(texto);
        if (!data) { alert('Data inválida. Use dd/mm/aaaa.'); return; }
        await api(`/financeiro/despesas/${id}/pagar`, { method: 'POST', body: { data } });
      } else if (tipo === 'remover') {
        if (!confirm('Remover essa conta? (some também a foto anexada)')) return;
        await api(`/financeiro/despesas/${id}`, { method: 'DELETE' });
      } else if (tipo === 'anexos') {
        state.despAnexos = { despesaId: id, itens: await api(`/financeiro/despesas/${id}/anexos`) };
        render(); return;
      } else if (tipo === 'fechar-anexos') {
        state.despAnexos = null; render(); return;
      } else if (tipo === 'ver-anexo') {
        await abrirAnexoDespesa(id); return;
      } else if (tipo === 'rm-anexo') {
        if (!confirm('Remover esse anexo?')) return;
        await api(`/financeiro/despesas/anexo/${id}`, { method: 'DELETE' });
        const despId = state.despAnexos.despesaId;
        state.despAnexos = { despesaId: despId, itens: await api(`/financeiro/despesas/${despId}/anexos`) };
        await carregarFinanceiro();
        render(); return;
      }
      await carregarFinanceiro();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  // ---------- fluxo de caixa ----------
  async function carregarFinanceiro() {
    const { inicio, fim } = limitesMes(state.financeiroMesRef);
    const qs = `?inicio=${inicio}&fim=${fim}`;
    const [despesas, receitas, resumo, aPagar, leitura] = await Promise.all([
      api(`/financeiro/despesas${qs}`),
      api(`/financeiro/receitas${qs}`),
      api(`/financeiro/resumo${qs}`),
      api('/financeiro/despesas/a-pagar'),
      api('/financeiro/despesas/ler-nota/status').catch(() => ({ configurada: false })),
    ]);
    state.financeiroDespesas = despesas;
    state.financeiroReceitas = receitas;
    state.financeiroResumo = resumo;
    state.financeiroAPagar = aPagar;
    state.leituraNotaConfigurada = !!leitura.configurada;
  }

  async function mudarMesFinanceiro(delta) {
    let { ano, mes } = state.financeiroMesRef;
    mes += delta;
    if (mes < 0) { mes = 11; ano -= 1; } else if (mes > 11) { mes = 0; ano += 1; }
    state.financeiroMesRef = { ano, mes };
    await carregarFinanceiro();
    render();
  }

  async function adicionarLancamento() {
    const data = document.getElementById('novo-lancamento-data').value;
    const descricao = document.getElementById('novo-lancamento-descricao').value.trim();
    const categoria = document.getElementById('novo-lancamento-categoria').value.trim();
    const formaPagamento = document.getElementById('novo-lancamento-forma').value;
    const valor = parseNumero(document.getElementById('novo-lancamento-valor').value);
    if (!data || !descricao || !(valor > 0)) {
      alert('Preencha data, descrição e um valor maior que zero.');
      return;
    }
    try {
      await api(`/financeiro/${state.financeiroAba}`, {
        method: 'POST',
        body: { data, descricao, categoria: categoria || null, formaPagamento: formaPagamento || null, valor },
      });
      await carregarFinanceiro();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerLancamento(id) {
    if (!confirm('Remover esse lançamento?')) return;
    await api(`/financeiro/${state.financeiroAba}/${id}`, { method: 'DELETE' });
    await carregarFinanceiro();
    render();
  }

  // ---------- tarefas ----------
  async function carregarTarefas() {
    state.tarefasLista = await api(`/tarefas?data=${state.tarefasData}`);
  }

  async function carregarTarefasCadastro() {
    const [tarefas, cargos] = await Promise.all([
      api('/tarefas/cadastro'),
      state.configCargos.length ? Promise.resolve(state.configCargos) : api('/config/cargos'),
    ]);
    state.tarefasCadastro = tarefas;
    if (!state.configCargos.length) state.configCargos = cargos;
  }

  async function toggleTarefa(id, concluida) {
    try {
      if (concluida) {
        await api(`/tarefas/${id}/concluir`, { method: 'POST', body: { data: state.tarefasData } });
      } else {
        await api(`/tarefas/${id}/concluir?data=${state.tarefasData}`, { method: 'DELETE' });
      }
      await carregarTarefas();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function mudarDiaTarefas(delta) {
    const d = new Date(`${state.tarefasData}T00:00:00`);
    d.setDate(d.getDate() + delta);
    state.tarefasData = d.toISOString().slice(0, 10);
    await carregarTarefas();
    render();
  }

  async function adicionarTarefa() {
    const titulo = document.getElementById('nova-tarefa-titulo').value.trim();
    const descricao = document.getElementById('nova-tarefa-descricao').value.trim();
    const cargoId = Number(document.getElementById('nova-tarefa-cargo').value);
    const etapa = document.getElementById('nova-tarefa-etapa').value;
    const frequencia = document.getElementById('nova-tarefa-frequencia').value;
    if (!titulo || !cargoId) { alert('Preencha pelo menos o título e o cargo.'); return; }

    const body = { titulo, descricao: descricao || null, cargoId, etapa, frequencia };
    if (frequencia === 'dias_semana') {
      body.diasSemana = [...document.querySelectorAll('.dia-semana-tarefa:checked')].map((el) => Number(el.value));
      if (!body.diasSemana.length) { alert('Escolha pelo menos um dia da semana.'); return; }
    }
    if (frequencia === 'intervalo') {
      body.intervaloDias = parseInt(document.getElementById('nova-tarefa-intervalo').value, 10);
      if (!(body.intervaloDias > 0)) { alert('Informe a cada quantos dias a tarefa se repete.'); return; }
    }

    try {
      await api('/tarefas', { method: 'POST', body });
      state.novaTarefaFrequencia = 'diaria';
      await Promise.all([carregarTarefas(), carregarTarefasCadastro()]);
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerTarefa(id) {
    if (!confirm('Remover essa tarefa? O histórico de conclusões dela também será apagado.')) return;
    await api(`/tarefas/${id}`, { method: 'DELETE' });
    await Promise.all([carregarTarefas(), carregarTarefasCadastro()]);
    render();
  }

  // ---------- calendário ----------
  function uid() { return Math.random().toString(36).slice(2, 9); } // mesmo padrão de id do PDV Jabá

  async function carregarCalendario() {
    const { inicio, fim } = limitesMes(state.calendarioMesRef);
    const resposta = await api(`/calendario?inicio=${inicio}&fim=${fim}`);
    state.calendarioConfigurado = resposta.configurado;
    state.calendarioEventos = resposta.eventos;
  }

  async function mudarMesCalendario(delta) {
    let { ano, mes } = state.calendarioMesRef;
    mes += delta;
    if (mes < 0) { mes = 11; ano -= 1; } else if (mes > 11) { mes = 0; ano += 1; }
    state.calendarioMesRef = { ano, mes };
    await carregarCalendario();
    render();
  }

  async function adicionarEvento() {
    const data = document.getElementById('novo-evento-data').value;
    const horaInicio = document.getElementById('novo-evento-hora-inicio').value.trim();
    const horaFim = document.getElementById('novo-evento-hora-fim').value.trim();
    const tipo = 'evento'; // a ATPN tem equipe/escala própria — aqui só eventos
    const titulo = document.getElementById('novo-evento-titulo').value.trim();
    const observacao = document.getElementById('novo-evento-observacao').value.trim();
    if (!data || !titulo) { alert('Preencha pelo menos data e título.'); return; }
    try {
      await api('/calendario', {
        method: 'POST',
        body: { id: uid(), tipo, data, horaInicio: horaInicio || null, horaFim: horaFim || null, titulo, observacao: observacao || null },
      });
      await carregarCalendario();
      render();
    } catch (err) {
      alert(err.message);
    }
  }

  async function removerEvento(id) {
    if (!confirm('Remover esse evento?')) return;
    await api(`/calendario/${id}`, { method: 'DELETE' });
    await carregarCalendario();
    render();
  }

  // ---------- sócios ----------
  async function carregarSocios() {
    const params = new URLSearchParams();
    if (state.sociosBusca) params.set('q', state.sociosBusca);
    if (state.sociosFiltroClube !== 'todos') params.set('clube', state.sociosFiltroClube);
    if (state.sociosFiltroStatus !== 'todos') params.set('status', state.sociosFiltroStatus);
    const resposta = await api(`/socios?${params.toString()}`);
    state.sociosLista = resposta.socios;
    state.sociosTotal = resposta.total;
  }

  async function carregarResumoSocios() {
    state.sociosResumo = await api('/socios/resumo');
  }

  async function filtrarSociosClube(clube) {
    state.sociosFiltroClube = clube;
    await carregarSocios();
    render();
  }

  async function filtrarSociosStatus(status) {
    state.sociosFiltroStatus = status;
    await carregarSocios();
    render();
  }

  async function toggleSocio(id) {
    if (state.sociosExpandidoId === id) { state.sociosExpandidoId = null; render(); return; }
    state.sociosExpandidoId = id;
    state.sociosDetalhe = null;
    render();
    state.sociosDetalhe = await api(`/socios/${id}`);
    render();
  }

  // teclado físico só ativo enquanto não logado
  document.onkeydown = (e) => {
    if (state.usuario) return;
    if (e.key >= '0' && e.key <= '9') pressLoginKey(e.key);
    else if (e.key === 'Backspace') pressLoginKey('back');
    else if (e.key === 'Escape') pressLoginKey('clear');
  };

  window.addEventListener('resize', () => {
    if (state.usuario) render();
  });

  // ---------- boot ----------
  (async function iniciar() {
    await carregarCargos();
    if (state.token) {
      try {
        state.usuario = await api('/auth/me');
        await entrarNoApp();
        return;
      } catch {
        localStorage.removeItem('token');
        state.token = null;
      }
    }
    render();
  })();
})();
</script>
</body>
</html>
